      </div>
    </section>

    <!-- ================= PLAYERS ================= -->
    <section class="view" id="v-players">
      <nav class="subnav" data-spy="v-players">
        <a class="snav on" data-target="sec-cmp" data-i="cmp_title"></a>
        <a class="snav" data-target="sec-cmp-year" data-i="cmp_table_title"></a>
        <a class="snav" data-target="sec-h2h" data-i="h2h_title"></a>
      </nav>

      <div class="sec" id="sec-cmp">
        <div class="section-head"><h2 data-i="cmp_title"></h2></div>
        <div class="hint" style="margin:-8px 0 20px;font-size:13px;color:var(--ink3)" data-i="cmp_cards_sub"></div>
        <div class="pcard-grid" id="pcardGrid"></div>
      </div>

      <div class="sec" id="sec-cmp-year">
        <div class="section-head"><h2 data-i="cmp_table_title"></h2><span class="ti-badge" data-i="scope_ind"></span></div>
        <div class="hint" style="margin:-8px 0 20px;font-size:13px;color:var(--ink3)" data-i="cmp_sub"></div>
        <div class="cmp-controls" id="cmpControls"></div>
        <div id="cmpBody"></div>
      </div>

      <div class="sec" id="sec-h2h">
        <div class="section-head"><h2 data-i="h2h_title"></h2></div>
        <div class="h2h-intro"><div class="ico">VS</div><div data-i="h2h_intro"></div></div>
        <div class="h2h-toggle" id="h2hToggle">
          <button class="on" data-mode="cards" data-i="h2h_card_toggle"></button>
          <button data-mode="grid" data-i="h2h_grid_toggle"></button>
          <button data-mode="network" data-i="h2h_network_toggle"></button>
        </div>
        <div class="rec-explain"><span class="ic">?</span><span class="txt" data-i="rec_explain"></span></div>
        <div class="h2h-mode on" id="h2hCards">
          <div class="h2h-pick-row">
            <div class="h2h-playerpick" id="h2hPick"></div>
            <a class="h2h-profile-link" id="h2hProfileLink" role="button" tabindex="0"></a>
          </div>
          <div class="rival-hero" id="rivalHero"></div>
          <div class="h2h-dig-hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg><span data-i="h2h_dig"></span></div>
          <div class="matchup-list" id="matchupList"></div>
        </div>
        <div class="h2h-mode" id="h2hGrid">
          <div class="panel" style="padding:20px">
            <div class="hint" style="margin-bottom:16px;font-size:13px;color:var(--ink2)" data-i="h2h_grid_help"></div>
            <div class="h2h-scroll"><table class="h2h" id="h2hTable"></table></div>
            <div class="legend">
              <span><span class="sw" style="background:linear-gradient(90deg,#d6442f,#d9b25a)"></span><span data-i="h2h_losing"></span></span>
              <span><span class="sw" style="background:linear-gradient(90deg,#d9b25a,#3f9b54)"></span><span data-i="h2h_winning"></span></span>
            </div>
          </div>
        </div>
        <div class="h2h-mode" id="h2hNetwork">
          <div class="panel" style="padding:20px">
            <div class="hint" style="margin-bottom:16px;font-size:13px;color:var(--ink2)" data-i="h2h_network_help"></div>
            <div class="net-wrap" id="netWrap"></div>
            <div class="legend">
              <span><span class="sw" style="background:linear-gradient(90deg,#d6442f,#d9b25a)"></span><span data-i="h2h_losing"></span></span>
              <span><span class="sw" style="background:linear-gradient(90deg,#d9b25a,#3f9b54)"></span><span data-i="h2h_winning"></span></span>
              <span class="net-leg-note" data-i="h2h_network_leg"></span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= COMMANDERS ================= -->
    <section class="view" id="v-commanders">
      <div class="section-head"><h2 data-i="cmd_title"></h2><span class="hint" id="cmdCount"></span></div>
      <div class="cmd-controls">
        <div class="seg" id="cmdSort">
          <button data-s="games" data-i="cmd_mostplayed"></button>
          <button class="on" data-s="winrate" data-i="cmd_bestwin"></button>
          <button data-s="avgrank" data-i="cmd_bestfinish"></button>
        </div>
        <div class="seg" id="cmdMin">
          <button data-m="1" data-i="cmd_all"></button>
          <button data-m="5" class="on" data-i="cmd_5plus"></button>
          <button data-m="10" data-i="cmd_10plus"></button>
        </div>
        <div class="cmd-custom-wrap" id="cmdCustomWrap">
          <span class="lbl" data-i="cmd_custom"></span>
          <input type="number" min="1" id="cmdCustomInput" inputmode="numeric">
        </div>
        <div class="search"><input id="cmdSearch" autocomplete="off"></div>
      </div>
      <div class="h2h-dig-hint" style="margin-top:0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg><span data-i="cd_click_hint"></span></div>
      <div class="cmd-grid" id="cmdGrid"></div>
      <div class="colorstats-wrap" id="colorStatsWrap" style="display:none">
        <div class="section-head"><h2 data-i="cs_title"></h2><span class="hint" data-i="cs_sub"></span></div>
        <div class="cs-grid">
          <div class="cs-panel">
            <h3 data-i="cs_bycolor_title"></h3>
            <div class="cs-sub" data-i="cs_bycolor_sub"></div>
            <div id="csByColor"></div>
          </div>
          <div class="cs-panel">
            <h3 data-i="cs_bycount_title"></h3>
            <div class="cs-sub" data-i="cs_bycount_sub"></div>
            <div id="csByCount"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= INSIGHTS ================= -->
    <section class="view" id="v-insights">
      <nav class="subnav" data-spy="v-insights">
        <a class="snav on" data-target="sec-inswin" data-i="gw_title"></a>
        <a class="snav" data-target="sec-form" data-i="trends_title"></a>
        <a class="snav" data-target="sec-streaks" data-i="streak_title"></a>
        <a class="snav" data-target="sec-fin" data-i="finish_title"></a>
        <a class="snav" data-target="sec-turn" data-i="other_turn_title"></a>
        <a class="snav" data-target="sec-sol" data-i="other_sol_title"></a>
        <a class="snav" data-target="sec-presence" data-i="presence_title"></a>
        <a class="snav" data-target="sec-div" data-i="div_title"></a>
        <a class="snav" data-target="sec-parity" data-i="parity_title"></a>
        <a class="snav" data-target="sec-activity" data-i="activity_title"></a>
      </nav>

      <div class="sec" id="sec-inswin">
        <div class="section-head"><h2 data-i="gw_title"></h2></div>
        <div class="hint" style="margin:-8px 0 16px;font-size:13px;color:var(--ink3)" data-i="iw_sub"></div>
        <div class="rg-controls" style="margin-top:0">
          <div class="rg-ctrl-row" id="insPlayerRow">
            <span class="rg-ctrl-lbl" data-i="rg_players_lbl"></span>
            <div class="rg-pfilter" id="insPlayerFilter"></div>
          </div>
          <div class="rg-ctrl-row" style="margin-top:14px">
            <span class="rg-ctrl-lbl" data-i="rg_window_lbl"></span>
            <div class="seg" id="insWinSeg">
              <button data-w="0" class="on" data-i="rg_win_all"></button>
              <button data-w="25">25</button>
              <button data-w="50">50</button>
              <button data-w="100">100</button>
            </div>
            <input type="number" id="insWinCustom" class="rg-win-custom" min="1" step="1" inputmode="numeric">
          </div>
          <div class="rg-focus" id="insFocus"></div>
        </div>
      </div>

      <div class="sec" id="sec-form">
        <div class="section-head"><h2 data-i="trends_title"></h2><span class="hint" data-i="trends_sub"></span></div>
        <div class="panel chart-panel">
          <div class="chart-head">
            <div class="h2h-toggle" id="trendToggle" style="margin:0">
              <button class="on" data-tm="rolling" data-i="trend_rolling"></button>
              <button data-tm="career" data-i="trend_career"></button>
            </div>
            <span class="hint" id="trendHint"></span>
          </div>
          <div id="rwSliderWrap" style="display:flex;align-items:center;gap:14px;padding:0 18px 14px">
            <span class="hint" style="white-space:nowrap">Window size</span>
            <input type="range" id="rwSlider" min="15" max="50" step="1" value="15" style="flex:1">
            <span id="rwSliderVal" style="font-family:'Oswald';font-weight:600;font-size:14px;min-width:64px;text-align:right">15 games</span>
          </div>
          <div id="trendChart" class="chart-area"></div>
          <div id="trendLegend" class="trend-legend"></div>
        </div>
      </div>

/* ---------- CSV + parse ---------- */
function parseCSV(text){
  const rows=[];let row=[],field='',i=0,q=false;
  while(i<text.length){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){field+='"';i+=2;continue;}q=false;i++;continue;}field+=c;i++;continue;}
    if(c==='"'){q=true;i++;continue;}
    if(c===','){row.push(field);field='';i++;continue;}
    if(c==='\r'){i++;continue;}
    if(c==='\n'){row.push(field);rows.push(row);row=[];field='';i++;continue;}
    field+=c;i++;}
  if(field.length||row.length){row.push(field);rows.push(row);}
  return rows;
}
/* Date format detected ONCE across the whole dataset (not guessed per-row),
   so ambiguous values like 01/11 are read consistently for the file. */
let DATE_FORMAT = 'MDY';
function detectDateFormat(strs){
  let monthFirst=false, dayFirst=false;
  for(const s of strs){
    const m=String(s).match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})/);
    if(!m) continue;
    const a=+m[1], b=+m[2];
    if(a>12 && b<=12) dayFirst=true;
    if(b>12 && a<=12) monthFirst=true;
  }
  if(dayFirst && !monthFirst) return 'DMY';
  if(monthFirst && !dayFirst) return 'MDY';
  return 'MDY';
}
function parseDate(s){
  if(!s) return null; s=String(s).trim(); let m;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))
    return`${m[1]}-${String(+m[2]).padStart(2,'0')}-${String(+m[3]).padStart(2,'0')}`;
  if(m=s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})/)){
    let a=+m[1], b=+m[2], y=+m[3], d, mo;
    if(DATE_FORMAT==='DMY'){ d=a; mo=b; } else { mo=a; d=b; }
    if(mo<1||mo>12||d<1||d>31) return null;
    return`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }
  return null;
}
const toInt=v=>{const n=parseInt(v,10);return Number.isFinite(n)?n:null;};

function parseGames(csvText){
  const rows=parseCSV(csvText);
  if(!rows.length)throw new Error("empty");
  const header=rows[0].map(h=>(h||'').trim());
  DATE_FORMAT = detectDateFormat(rows.slice(1).map(r=>r&&r[1]).filter(Boolean));
  const pcols=[];header.forEach((h,idx)=>{if(/^Player/i.test(h))pcols.push(idx);});
  if(!pcols.length)throw new Error("noplayers");
  let gtCol=header.findIndex(h=>/game\s*time/i.test(h));
  const games=[];
  for(let r=1;r<rows.length;r++){const row=rows[r];
    if(!row||!row[0]||!String(row[0]).trim())continue;
    const date=parseDate(row[1]);const seats=[];
    for(const pc of pcols){
      const player=(row[pc]||'').trim(),commander=(row[pc+1]||'').trim();
      const sol=toInt(row[pc+2]),turn=toInt(row[pc+3]),rank=toInt(row[pc+4]);
      if(player&&commander&&rank!=null)seats.push({player,commander,sol,turn,rank});
    }
    let gt=gtCol>=0?toInt(row[gtCol]):null;if(!(gt>0))gt=null;
    // Sol Ring wasn't tracked before game times were: an untimed game's 0s mean
    // "not recorded", not "no Sol Ring" — null them so these seats leave every
    // sol-percentage denominator (players, tags, compare, the Sol Ring Effect).
    if(gt==null) for(const s of seats) s.sol=null;
    if(seats.length>=2)games.push({num:toInt(row[0]),order:games.length,date,gametime:gt,seats});
  }
  if(!games.length)throw new Error("nogames");
  return games;
}

/* ---------- commander colors ---------- */
// canonical WUBRG ordering; C (colorless) is its own thing, kept separate from "unknown"
const COLOR_ORDER = ['W','U','B','R','G'];
const COLOR_META = {
  W:{key:'W',hex:'#f4efd6',ring:'#cdbf86',label:'White'},
  U:{key:'U',hex:'#2f7fd0',ring:'#2f7fd0',label:'Blue'},
  B:{key:'B',hex:'#3a3238',ring:'#5a5058',label:'Black'},
  R:{key:'R',hex:'#d6442f',ring:'#d6442f',label:'Red'},
  G:{key:'G',hex:'#3f9b54',ring:'#3f9b54',label:'Green'},
  C:{key:'C',hex:'#b9b2a7',ring:'#b9b2a7',label:'Colorless'}
};
// map: commander name -> array of color letters, e.g. ['U','B'] or ['C'] or [] (unknown)
let COMMANDER_COLORS = {};
// secondary lookup index so Dataset short names ("Atraxa") match Commander-sheet full
// names ("Atraxa, Praetors' Voice") and vice-versa, case/spacing-insensitively.
let COMMANDER_COLOR_INDEX = {};
// key used for fuzzy matching: lowercase, collapse whitespace, strip surrounding quotes
function colorKey(s){ return String(s==null?'':s).toLowerCase().replace(/\s+/g,' ').trim(); }
// the "short" name = everything before the first comma (drops the epithet)
function shortName(s){ const i=String(s).indexOf(','); return (i>=0?String(s).slice(0,i):String(s)).trim(); }
// normalize a raw cell ("bug", "W U B", "colorless", "5c") into an ordered letter array
function normalizeColors(raw){
  if(raw==null) return [];
  let s=String(raw).trim().toUpperCase();
  if(!s) return [];
  // common words / shorthands
  if(/^(C|COLORLESS|COLOURLESS|NONE|N\/A|NA)$/.test(s)) return ['C'];
  if(/^(WUBRG|5C|5-C|FIVE.?COLOR|RAINBOW)$/.test(s)) return ['W','U','B','R','G'];
  // pull only valid color letters, dedupe, then order by WUBRG
  const set=new Set();
  for(const ch of s){ if(COLOR_ORDER.includes(ch)) set.add(ch); }
  if(set.size===0){
    // maybe it literally said colorless-ish but with stray chars, or unknown token
    return s.includes('C') ? ['C'] : [];
  }
  return COLOR_ORDER.filter(c=>set.has(c));
}
function parseColors(csvText){
  const map={};        // full name (as written in the sheet) -> colors
  const index={};      // fuzzy key (full + short) -> colors
  if(!csvText) return {map, index};
  const rows=parseCSV(csvText);
  if(!rows.length) return {map, index};
  // find the Commander + Colors columns by header (fall back to first two columns).
  // Real sheet has a leading "#" column, so we can't assume column 0/1.
  const header=rows[0].map(h=>String(h||'').trim().toLowerCase());
  let ci=header.findIndex(h=>h==='commander'||h.includes('commander')||h.includes('deck'));
  let coi=header.findIndex(h=>h.includes('color')||h.includes('colour')||h.includes('identity'));
  const hasHeader = ci>=0 || coi>=0;
  if(ci<0){ // no header match: guess — a "#"-style index col first means name is col 1
    ci = (rows[0].length>=3 && /^\d*$/.test(String(rows[0][0]||'').trim())) ? 1 : 0;
  }
  if(coi<0) coi = ci+1;
  for(let r=hasHeader?1:0;r<rows.length;r++){
    const row=rows[r]; if(!row) continue;
    const name=String(row[ci]||'').trim();
    if(!name) continue;
    const cols=normalizeColors(row[coi]);
    map[name]=cols;
    // index under full-name key and short-name key (don't clobber an existing exact entry)
    const fk=colorKey(name), sk=colorKey(shortName(name));
    if(!(fk in index)) index[fk]=cols;
    if(sk && !(sk in index)) index[sk]=cols;
  }
  return {map, index};
}
function commanderColors(name){
  if(name==null) return [];
  // 1) exact as-written match
  const exact=COMMANDER_COLORS[name];
  if(Array.isArray(exact)) return exact;
  // 2) fuzzy: try the Dataset name's full key, then its short (pre-comma) key
  const fk=colorKey(name);
  if(fk in COMMANDER_COLOR_INDEX) return COMMANDER_COLOR_INDEX[fk];
  const sk=colorKey(shortName(name));
  if(sk in COMMANDER_COLOR_INDEX) return COMMANDER_COLOR_INDEX[sk];
  return [];
}
// small inline color pips for a commander; returns '' when colors are unknown
function colorPips(name, size){
  const cols=commanderColors(name);
  if(!cols.length) return '';
  const sz=size||12;
  const dots=cols.map(c=>{const m=COLOR_META[c]||COLOR_META.C;
    return `<span class="pip" title="${m.label}" style="width:${sz}px;height:${sz}px;background:${m.hex};box-shadow:inset 0 0 0 1.5px ${m.ring}"></span>`;}).join('');
  return `<span class="pips">${dots}</span>`;
}
// pips from an explicit color-letter array (for aggregated combos, not a single commander)
function colorPipsFromArr(cols, size){
  if(!cols||!cols.length) return '';
  const sz=size||12;
  return `<span class="pips">`+cols.map(c=>{const m=COLOR_META[c]||COLOR_META.C;
    return `<span class="pip" title="${m.label}" style="width:${sz}px;height:${sz}px;background:${m.hex};box-shadow:inset 0 0 0 1.5px ${m.ring}"></span>`;}).join('')+`</span>`;
}
// a horizontal accent gradient built from a color array (for the detail topline)
function colorAccentBar(cols){
  if(!cols||!cols.length) return null;
  const hexes=cols.map(c=>(COLOR_META[c]||COLOR_META.C).hex);
  if(hexes.length===1) return `linear-gradient(90deg,${hexes[0]},${hexes[0]})`;
  // spread the colors evenly across the bar
  const stops=hexes.map((h,i)=>`${h} ${Math.round(i/(hexes.length-1)*100)}%`).join(', ');
  return `linear-gradient(90deg, ${stops})`;
}
// a very faint tint wash for a header background, layered over the panel gradient
function colorHeaderTint(cols){
  if(!cols||!cols.length) return null;
  const hexes=cols.map(c=>(COLOR_META[c]||COLOR_META.C).hex);
  // soft radial glows in each color, low alpha, positioned across the header
  const glows=hexes.map((h,i)=>{
    const x = hexes.length===1?50:Math.round(8+i/(hexes.length-1)*84);
    return `radial-gradient(circle at ${x}% 0%, ${hexToRgba(h,0.16)}, transparent 62%)`;
  });
  return glows.join(', ');
}
function hexToRgba(hex, a){
  const m=String(hex).replace('#','');
  const n=m.length===3?m.split('').map(c=>c+c).join(''):m;
  const r=parseInt(n.slice(0,2),16), g=parseInt(n.slice(2,4),16), b=parseInt(n.slice(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}
// A player's single favorite color letter (most games across ALL-TIME decks), or null.
// All-time (not filtered) so podium/profile theming is a stable identity trait.
// Cached because it's called per podium card + per profile render.
let _favColorCache=null;
function playerFavoriteColor(playerName){
  if(!COMMANDER_COLORS || !Object.keys(COMMANDER_COLORS).length) return null;
  if(!_favColorCache){
    _favColorCache={};
    const tally={}; // player -> {color: gamesCount}
    for(const g of (ALL_GAMES||[])) for(const s of g.seats){
      const cols=commanderColors(s.commander); if(!cols.length) continue;
      const t=tally[s.player]||(tally[s.player]={});
      cols.forEach(c=>{ t[c]=(t[c]||0)+1; });
    }
    for(const p of Object.keys(tally)){
      const entries=Object.entries(tally[p]);
      if(!entries.length){ _favColorCache[p]=null; continue; }
      entries.sort((a,b)=> b[1]-a[1] || COLOR_ORDER.indexOf(a[0])-COLOR_ORDER.indexOf(b[0]));
      _favColorCache[p]=entries[0][0];
    }
  }
  return _favColorCache[playerName] || null;
}
// A player's most-played exact color combination (all-time), as an ordered letter array.
// Used for theming the player detail header + podium. Cached alongside favorite color.
let _favComboCache=null;
function playerFavoriteCombo(playerName){
  if(!COMMANDER_COLORS || !Object.keys(COMMANDER_COLORS).length) return [];
  if(!_favComboCache){
    _favComboCache={};
    const tally={}; // player -> comboKey -> {cols, n}
    for(const g of (ALL_GAMES||[])) for(const s of g.seats){
      const cols=commanderColors(s.commander); if(!cols.length) continue;
      const key=cols.join('');
      const t=tally[s.player]||(tally[s.player]={});
      const e=t[key]||(t[key]={cols, n:0}); e.n++;
    }
    for(const p of Object.keys(tally)){
      const entries=Object.values(tally[p]);
      if(!entries.length){ _favComboCache[p]=[]; continue; }
      entries.sort((a,b)=> b.n-a.n || a.cols.length-b.cols.length);
      _favComboCache[p]=entries[0].cols;
    }
  }
  return _favComboCache[playerName] || [];
}

/* ---------- stats (computed from a games subset) ---------- */
function computeStats(games){
  const P={},H={},C={},PC={};
  for(const g of games){
    for(const s of g.seats){
      const p=P[s.player]||(P[s.player]={name:s.player,games:0,wins:0,rs:0,rn:0,sol:0,soln:0,pod:0,gt:0,gtn:0,decks:{}});
      p.games++;if(s.rank===1)p.wins++;p.rs+=s.rank;p.rn++;
      if(s.rank<=2)p.pod++;
      if(s.sol!=null){p.soln++;if(s.sol===1)p.sol++;}
      if(g.gametime!=null){p.gt+=g.gametime;p.gtn++;}
      p.decks[s.commander]=(p.decks[s.commander]||0)+1;
      const c=C[s.commander]||(C[s.commander]={name:s.commander,games:0,wins:0,rs:0,rn:0,pilots:{}});
      c.games++;if(s.rank===1)c.wins++;c.rs+=s.rank;c.rn++;c.pilots[s.player]=(c.pilots[s.player]||0)+1;
      const key=s.player+'||'+s.commander;
      const pc=PC[key]||(PC[key]={player:s.player,commander:s.commander,games:0,wins:0,rs:0,rn:0});
      pc.games++;if(s.rank===1)pc.wins++;pc.rs+=s.rank;pc.rn++;
    }
    for(let i=0;i<g.seats.length;i++)for(let j=0;j<g.seats.length;j++){
      if(i===j)continue;const a=g.seats[i],b=g.seats[j];
      H[a.player]=H[a.player]||{};
      const rec=H[a.player][b.player]||(H[a.player][b.player]={games:0,a:0,b:0,t:0});
      rec.games++;if(a.rank<b.rank)rec.a++;else if(a.rank>b.rank)rec.b++;else rec.t++;
    }
  }
  const players=Object.values(P).map(p=>({name:p.name,games:p.games,wins:p.wins,
    winrate:p.games?+(100*p.wins/p.games).toFixed(1):0,
    avgrank:p.rn?+(p.rs/p.rn).toFixed(2):null,
    solrate:p.soln?+(100*p.sol/p.soln).toFixed(1):null,soln:p.soln,
    podium:p.games?+(100*p.pod/p.games).toFixed(0):0,
    avgtime:p.gtn?Math.round(p.gt/p.gtn):null,
    deckcount:Object.keys(p.decks).length}))
    .sort((a,b)=>b.winrate-a.winrate||b.games-a.games);
  const commanders=Object.values(C).map(c=>({name:c.name,games:c.games,wins:c.wins,
    winrate:c.games?+(100*c.wins/c.games).toFixed(1):0,
    avgrank:c.rn?+(c.rs/c.rn).toFixed(2):null,
    pilots:Object.entries(c.pilots).map(([player,games])=>({player,games})).sort((a,b)=>b.games-a.games)}))
    .sort((a,b)=>b.games-a.games||b.winrate-a.winrate);
  const playercommanders={};
  Object.values(PC).forEach(pc=>{(playercommanders[pc.player]=playercommanders[pc.player]||[]).push({
    commander:pc.commander,games:pc.games,wins:pc.wins,
    winrate:pc.games?+(100*pc.wins/pc.games).toFixed(1):0,
    avgrank:pc.rn?+(pc.rs/pc.rn).toFixed(2):null});});
  Object.values(playercommanders).forEach(a=>a.sort((x,y)=>y.games-x.games||y.winrate-x.winrate));
  const dates=games.map(g=>g.date).filter(Boolean).sort();
  const meta={total_games:games.length,total_seats:games.reduce((s,g)=>s+g.seats.length,0),
    n_players:players.length,n_commanders:commanders.length,
    date_range:dates.length?[dates[0],dates[dates.length-1]]:[null,null]};
  const gts=games.map(g=>g.gametime).filter(x=>x!=null).sort((a,b)=>a-b);
  let gl=null;
  if(gts.length){
    const sum=gts.reduce((a,b)=>a+b,0);
    const median=gts.length%2?gts[(gts.length-1)/2]:(gts[gts.length/2-1]+gts[gts.length/2])/2;
    const buckets={};const W=30;
    gts.forEach(v=>{const b=Math.floor(v/W)*W;buckets[b]=(buckets[b]||0)+1;});
    const bmin=Math.min(...Object.keys(buckets).map(Number)),bmax=Math.max(...Object.keys(buckets).map(Number));
    const histo=[];for(let b=bmin;b<=bmax;b+=W)histo.push({lo:b,hi:b+W,count:buckets[b]||0});
    gl={n:gts.length,avg:Math.round(sum/gts.length),median:Math.round(median),min:gts[0],max:gts[gts.length-1],histo,W};
  }
  return {meta,players,h2h:H,commanders,playercommanders,gl};
}

/* ===== Rivalry network graph =====
   A hand-rolled force-directed layout (no external libs): nodes repel each other,
   edges pull their two players together (more shared games = shorter rest length),
   everything is gently pulled toward the canvas center. Runs a fixed number of
   synchronous ticks once per data change (see the _netSig check in renderH2H), not
   continuously — dragging a node just moves that node directly, it doesn't restart
   the simulation, so a layout the user has untangled stays put. */
let _netSig=null;
const netColorForPct=pct=> pct<45?'#e87a68':pct>55?'#6cc77e':'#f0cd7e';
function computeNetworkGraph(){
  const nodes=CORE.map(name=>{
    const p=S.players.find(x=>x.name===name);
    return {name, games:p?p.games:0, x:0, y:0, vx:0, vy:0};
  });
  const edges=[];
  for(let i=0;i<CORE.length;i++){
    for(let j=i+1;j<CORE.length;j++){
      const a=CORE[i], b=CORE[j];
      const rec=S.h2h[a] && S.h2h[a][b];
      if(!rec || rec.games===0) continue;
      edges.push({a,b, games:rec.games,
        aPct:Math.round(100*rec.a/rec.games), bPct:Math.round(100*rec.b/rec.games)});
    }
  }
  return {nodes, edges};
}
function simulateNetworkLayout(nodes, edges, W, H){
  const n=nodes.length;
  nodes.forEach((node,i)=>{
    const ang=(i/n)*2*Math.PI - Math.PI/2;
    node.x=W/2+Math.cos(ang)*Math.min(W,H)*0.32;
    node.y=H/2+Math.sin(ang)*Math.min(W,H)*0.32;
    node.vx=0; node.vy=0;
  });
  const byName={}; nodes.forEach(node=>byName[node.name]=node);
  const REPEL=15000, SPRING=0.02, CENTER=0.01, DAMP=0.82, STEP=0.02;
  for(let iter=0; iter<300; iter++){
    for(let i=0;i<n;i++){
      for(let j=i+1;j<n;j++){
        const A=nodes[i], B=nodes[j];
        let dx=A.x-B.x, dy=A.y-B.y;
        let distSq=dx*dx+dy*dy; if(distSq<1)distSq=1;
        const dist=Math.sqrt(distSq), force=REPEL/distSq;
        const fx=dx/dist*force, fy=dy/dist*force;
        A.vx+=fx; A.vy+=fy; B.vx-=fx; B.vy-=fy;
      }
    }
    edges.forEach(e=>{
      const A=byName[e.a], B=byName[e.b];
      const dx=B.x-A.x, dy=B.y-A.y;
      const dist=Math.max(1, Math.sqrt(dx*dx+dy*dy));
      const restLen=260-Math.min(150, e.games*3);
      const f=(dist-restLen)*SPRING;
      const fx=dx/dist*f, fy=dy/dist*f;
      A.vx+=fx; A.vy+=fy; B.vx-=fx; B.vy-=fy;
    });
    nodes.forEach(node=>{
      node.vx += (W/2-node.x)*CENTER;
      node.vy += (H/2-node.y)*CENTER;
      node.vx*=DAMP; node.vy*=DAMP;
      node.x+=node.vx*STEP; node.y+=node.vy*STEP;
    });
  }
  const PAD=56;
  nodes.forEach(node=>{
    node.x=Math.max(PAD,Math.min(W-PAD,node.x));
    node.y=Math.max(PAD,Math.min(H-PAD,node.y));
  });
}
function renderH2HNetwork(){
  const host=$('#netWrap'); if(!host) return;
  const {nodes, edges}=computeNetworkGraph();
  if(nodes.length<2){ host.innerHTML=`<div class="empty">${t('h2h_no_games')}</div>`; return; }
  const W=760, H=460;
  simulateNetworkLayout(nodes, edges, W, H);
  const gMax=Math.max(...nodes.map(n=>n.games),1);
  const rScale=g=> 20+Math.sqrt(g/gMax)*26;
  const wMax=Math.max(...edges.map(e=>e.games),1);
  const wScale=g=> 1.5+Math.sqrt(g/wMax)*7;
  const byName={}; nodes.forEach(node=>byName[node.name]=node);

  const defs=edges.map((e,i)=>{
    const A=byName[e.a], B=byName[e.b];
    return `<linearGradient id="peg-${i}" gradientUnits="userSpaceOnUse" x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}">
      <stop offset="0%" stop-color="${netColorForPct(e.aPct)}"/>
      <stop offset="100%" stop-color="${netColorForPct(e.bPct)}"/>
    </linearGradient>`;
  }).join('');
  const edgeEls=edges.map((e,i)=>{
    const A=byName[e.a], B=byName[e.b], w=wScale(e.games);
    const title=`${esc(e.a)} ${e.aPct}% – ${esc(e.b)} ${e.bPct}% (${e.games}g)`;
    return `<g class="net-edge" data-a="${esc(e.a)}" data-b="${esc(e.b)}"><title>${title}</title>
      <line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="transparent" stroke-width="${w+14}" class="net-edge-hit"/>
      <line id="netline-${i}" x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="url(#peg-${i})" stroke-width="${w}" stroke-linecap="round" opacity=".82"/>
    </g>`;
  }).join('');
  const nodeEls=nodes.map(node=>{
    const r=rScale(node.games);
    return `<g class="net-node" data-player="${esc(node.name)}" transform="translate(${node.x},${node.y})">
      <circle r="${r}" fill="${playerColor(node.name)}" stroke="var(--bg)" stroke-width="3"/>
      <text text-anchor="middle" dy="${r+16}" class="net-label">${esc(node.name)}</text>
    </g>`;
  }).join('');

  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" class="net-svg" id="netSvg">
    <defs>${defs}</defs>
    <g id="netEdges">${edgeEls}</g>
    <g id="netNodes">${nodeEls}</g>
  </svg>`;
  wireNetworkDrag(nodes, edges, byName);
}
function wireNetworkDrag(nodes, edges, byName){
  const svg=$('#netSvg'); if(!svg) return;
  svg.querySelectorAll('.net-node').forEach(el=>{
    el.addEventListener('click',()=>{ if(!el._dragged) openPlayerDetail(el.getAttribute('data-player')); });
  });
  svg.querySelectorAll('.net-edge').forEach(el=>{
    el.addEventListener('click',()=> openMatchupDetail(el.getAttribute('data-a'), el.getAttribute('data-b')));
  });
  function svgPoint(evt){
    const pt=svg.createSVGPoint(); pt.x=evt.clientX; pt.y=evt.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  let dragging=null, dragEl=null;
  svg.querySelectorAll('.net-node').forEach(el=>{
    el.addEventListener('pointerdown',ev=>{
      dragging=byName[el.getAttribute('data-player')];
      dragEl=el; el._dragged=false;
      try{ svg.setPointerCapture(ev.pointerId); }catch(err){}
      ev.preventDefault();
    });
  });
  svg.addEventListener('pointermove',ev=>{
    if(!dragging) return;
    const p=svgPoint(ev);
    dragging.x=p.x; dragging.y=p.y;
    dragEl.setAttribute('transform',`translate(${p.x},${p.y})`);
    dragEl._dragged=true;
    edges.forEach((e,i)=>{
      if(e.a!==dragging.name && e.b!==dragging.name) return;
      const A=byName[e.a], B=byName[e.b];
      const line=document.getElementById('netline-'+i);
      if(line){ line.setAttribute('x1',A.x); line.setAttribute('y1',A.y); line.setAttribute('x2',B.x); line.setAttribute('y2',B.y); }
      const grad=document.getElementById('peg-'+i);
      if(grad){ grad.setAttribute('x1',A.x); grad.setAttribute('y1',A.y); grad.setAttribute('x2',B.x); grad.setAttribute('y2',B.y); }
      const hit=line && line.previousElementSibling;
      if(hit){ hit.setAttribute('x1',A.x); hit.setAttribute('y1',A.y); hit.setAttribute('x2',B.x); hit.setAttribute('y2',B.y); }
    });
  });
  svg.addEventListener('pointerup',()=>{dragging=null;dragEl=null;});
  svg.addEventListener('pointerleave',()=>{dragging=null;dragEl=null;});
}

/* ===== color stats (respects the active year/date filter) ===== */
function renderColorStats(){
  const wrap=document.getElementById('colorStatsWrap'); if(!wrap) return;
  // only show anything if we actually have color data for commanders in the data
  const haveAny=Object.keys(COMMANDER_COLORS).length>0 &&
    Object.values(COMMANDER_COLORS).some(a=>Array.isArray(a)&&a.length);
  if(!haveAny){ wrap.style.display='none'; return; }
  wrap.style.display='';

  const games=gamesForYear();
  // per-color tallies (a seat counts toward every color its commander has)
  const byColor={}; COLOR_ORDER.concat('C').forEach(c=>byColor[c]={g:0,w:0});
  // per-color-count tallies: '1'..'5' plus 'C' for colorless; only seats with known colors
  const byCount={'1':{g:0,w:0},'2':{g:0,w:0},'3':{g:0,w:0},'4':{g:0,w:0},'5':{g:0,w:0},'C':{g:0,w:0}};
  let knownSeats=0;
  for(const g of games){
    for(const s of g.seats){
      const cols=commanderColors(s.commander);
      if(!cols.length) continue;            // unknown → excluded from color stats
      knownSeats++;
      const win=s.rank===1?1:0;
      cols.forEach(c=>{ byColor[c].g++; byColor[c].w+=win; });
      if(cols.length===1 && cols[0]==='C'){ byCount.C.g++; byCount.C.w+=win; }
      else { const k=String(cols.length); if(byCount[k]){ byCount[k].g++; byCount[k].w+=win; } }
    }
  }

  const csHost=document.getElementById('csByColor');
  const ccHost=document.getElementById('csByCount');
  if(knownSeats===0){
    if(csHost) csHost.innerHTML=`<div class="cs-empty">${t('cs_none')}</div>`;
    if(ccHost) ccHost.innerHTML='';
    return;
  }

  // ----- by color -----
  const colorRows=COLOR_ORDER.concat('C')
    .map(c=>({c, g:byColor[c].g, w:byColor[c].w, wr:byColor[c].g?100*byColor[c].w/byColor[c].g:0}))
    .filter(r=>r.g>0)
    .sort((a,b)=>b.wr-a.wr);
  const maxWrC=Math.max(...colorRows.map(r=>r.wr),1);
  csHost.innerHTML=colorRows.map(r=>{
    const m=COLOR_META[r.c];
    return `<div class="cs-row">
      <span class="cs-swatch" style="background:${m.hex};box-shadow:inset 0 0 0 2px ${m.ring}"></span>
      <span class="cs-label">${t('color_'+r.c)}</span>
      <span class="cs-bartrack"><span class="cs-barfill" style="width:${Math.max(r.wr/maxWrC*100,3)}%;background:${m.hex}"></span></span>
      <span class="cs-val"><b>${r.wr.toFixed(1)}%</b> · ${r.g} ${t('cs_seats')}</span>
    </div>`;
  }).join('');

  // ----- by color count -----
  const countOrder=['1','2','3','4','5','C'];
  const countRows=countOrder.map(k=>({k, g:byCount[k].g, w:byCount[k].w, wr:byCount[k].g?100*byCount[k].w/byCount[k].g:0}))
    .filter(r=>r.g>0);
  const maxWrK=Math.max(...countRows.map(r=>r.wr),1);
  ccHost.innerHTML=countRows.map(r=>{
    const label = r.k==='C'?t('color_C'):t('cs_count_'+r.k);
    return `<div class="cs-row">
      <span class="cs-label" style="width:auto;min-width:82px">${label}</span>
      <span class="cs-bartrack"><span class="cs-barfill" style="width:${Math.max(r.wr/maxWrK*100,3)}%;background:linear-gradient(90deg,var(--gold2),var(--gold))"></span></span>
      <span class="cs-val"><b>${r.wr.toFixed(1)}%</b> · ${r.g} ${t('cs_seats')}</span>
    </div>`;
  }).join('') + `<div class="cs-note">${t('cs_expected',{n:(100/4).toFixed(0)})}</div>`;
}

/* ===== RECENT GAMES (windowed "magnifying glass" view) ===== */
// The list shows a fixed-size window of games. rgWinSize = games in the lens
// (0 = all). rgWinEnd = how far back the window's NEWEST edge sits, in games,
// from the actual newest game (0 = anchored to newest). The slider scrubs rgWinEnd
// from 0 (newest) up to total-size (oldest); larger = further back in time.
let rgWinSize = 10;
let rgWinEnd = 0;
// Player filter: names in this set are EXCLUDED — any game they sat in is hidden.
// Default empty = everyone enabled = all games shown (unchanged behavior).
// A game always has exactly 4 players, so at least 4 must stay enabled (enforced
// in the click handler); when exactly 4 are enabled the list is exactly that
// pod's shared games.
let rgExcluded = new Set();
// Games currently inside the window — Game Length and Commander Pace read this
// too, so the whole Games tab moves together with the slider/filter.
let RG_WIN_ITEMS = [];

// newest first: by date desc, then by sheet order desc (new rows append at the bottom)
function recentSorted(){
  // The Games tab always spans the ENTIRE history — the global time scope does
  // not apply here. The window (size + slider) and the player filter are the
  // only things narrowing this pool.
  const pool = (ALL_GAMES||[]).filter(g=>!rgExcluded.size || !g.seats.some(s=>rgExcluded.has(s.player)));
  return pool.slice().sort((a,b)=>{
    const da=a.date||'', db=b.date||'';
    if(da!==db) return da<db?1:-1;
    return (b.order||0)-(a.order||0);
  });
}

function localizedGameDate(d){
  if(!d) return '—';
  const [y,mo,day]=d.split('-');
  return new Date(y,mo-1,day).toLocaleDateString(lang,{day:'numeric',month:'short',year:'numeric'});
}

// resolve the current window into a slice of the newest-first array + clamp state
function recentWindow(all){
  const total=all.length;
  const size = (rgWinSize===0 || rgWinSize>=total) ? total : rgWinSize;
  const maxEnd = Math.max(0, total-size);
  if(rgWinEnd>maxEnd) rgWinEnd=maxEnd;
  if(rgWinEnd<0) rgWinEnd=0;
  const start=rgWinEnd;                 // offset from newest
  const slice=all.slice(start, start+size);
  return {slice, size, total, start, maxEnd};
}

// One chip per player from the ALL-TIME roster (games desc), so chips are stable
// and everyone — including rare guests — can be toggled. A chip that's "off"
// excludes every game that player sat in. Hidden entirely if the roster is only
// 4 players (nothing could ever be filtered under the min-4 rule).
function renderRecentPlayerFilter(){
  const host=$('#rgPlayerFilter'); if(!host) return;
  const row=$('#rgPlayerRow');
  const note=$('#rgPfilterNote');
  const counts={};
  (ALL_GAMES||[]).forEach(g=>g.seats.forEach(s=>{ counts[s.player]=(counts[s.player]||0)+1; }));
  const roster=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]||a.localeCompare(b));
  if(roster.length<5){
    if(row) row.style.display='none';
    if(note) note.style.display='none';
    host.innerHTML=''; return;
  }
  if(row) row.style.display='';
  host.innerHTML=roster.map(p=>{
    const on=!rgExcluded.has(p);
    return `<button type="button" class="rg-pchip${on?' on':''}" data-player="${esc(p)}" title="${esc(t('rg_pfilter_tip'))}"><span class="dot" style="background:${playerColor(p)}"></span>${esc(p)}</button>`;
  }).join('');
  if(note){ note.style.display='none'; }
}

function renderRecent(){
  const host=$('#rgList'); if(!host) return;
  const hasBase = (ALL_GAMES||[]).length>0;
  const all=recentSorted();
  const controls=$('#rgControls');
  renderRecentPlayerFilter();
  if(!all.length){
    host.innerHTML=`<div class="empty">${t('rg_none')}</div>`;
    // keep the controls (esp. the player chips) visible when it's the player
    // filter that emptied the list — otherwise nothing could be re-enabled
    if(controls) controls.style.display = hasBase ? '' : 'none';
    const sr=$('#rgSliderRow'); if(sr) sr.style.display='none';
    const focus=$('#rgFocus'); if(focus) focus.innerHTML='';
    renderRecentTrend([]);
    RG_WIN_ITEMS=[];
    renderLength();
    renderRecentImpact();
    return;
  }
  if(controls) controls.style.display='';
  const win=recentWindow(all);
  const shown=win.slice;
  RG_WIN_ITEMS=shown;

  host.innerHTML=shown.map(g=>{
    const seats=g.seats.slice().sort((a,b)=>a.rank-b.rank);
    const seatRows=seats.map(s=>{
      const posCls = s.rank===1?'p1':s.rank===2?'p2':'';
      const meta=[];
      if(s.turn) meta.push(`<span class="seat">${t('rg_seat')} ${s.turn}</span>`);
      if(s.sol===1) meta.push(`<span class="sol">${t('rg_sol')}</span>`);
      return `<div class="rg-seat${s.rank===1?' win':''}">
        <div class="rg-pos ${posCls}">${s.rank}</div>
        <div class="rg-who">
          <span class="rg-pl" data-player="${esc(s.player)}">${esc(s.player)}</span>
          <span class="rg-cmd" data-cmd="${esc(s.commander)}">${esc(s.commander)}</span>${colorPips(s.commander,10)}
        </div>
        <div class="rg-meta">${meta.join('')}</div>
      </div>`;
    }).join('');
    const timeBadge = g.gametime!=null
      ? `<span class="rg-time"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><b>${g.gametime}</b> ${t('rg_min')}</span>`
      : `<span class="rg-time none">${t('rg_no_time')}</span>`;
    const gnum = g.num!=null ? `${t('rg_game')} #${g.num}` : t('rg_game');
    return `<div class="rg-card">
      <div class="rg-card-head">
        <div class="left"><span class="rg-gnum">${gnum}</span><span class="rg-date">${localizedGameDate(g.date)}</span></div>
        ${timeBadge}
      </div>
      <div class="rg-seats">${seatRows}</div>
    </div>`;
  }).join('');

  // wire clicks for players + commanders
  host.querySelectorAll('.rg-pl').forEach(el=>el.addEventListener('click',()=>openPlayerDetail(el.dataset.player)));
  host.querySelectorAll('.rg-cmd').forEach(el=>el.addEventListener('click',()=>openCommanderDetail(el.dataset.cmd)));

  updateRecentControls(win);
  renderRecentTrend(shown);
  renderLength();   // Length + Pace follow the window
  renderRecentImpact(); // independent of the window, its own small slider
}

/* ===== Recent Impact: a highlights feed, not a stat table =====
   Three real designs before this one, worth knowing the history so nobody re-walks it.
   v1 was a before/after delta of the cumulative win rate — at 150+ games a couple of
   results barely moves a career average, too small to mean anything. v2 swapped to
   window-rate-vs-season-rate — bigger swings, but at n=1 a single win/loss is 100%/0%
   by definition, so comparing it to a season average produces a dramatic, misleading
   number no matter how it's drawn (reported example: "+53pts because he won one
   game"). v3 dropped rate math for a per-player recap (result chips + streak badge +
   season reference + rank-change badge) — statistically honest, but user feedback was
   blunt: "doesn't excite me... just more of the same data displayed differently."
   Fair: season win rate restated is just the Overview leaderboard again, and even the
   streak/rank bits were fine but buried in a table shaped like the others.
   The actual insight from that feedback: streaks and standings crossings landed
   because they're THRESHOLD EVENTS (something either happened or it didn't) — restated
   rates didn't, because they're the same continuous number shown elsewhere, just
   sliced smaller. So v4 stops being a per-player table at all and becomes a feed of
   discrete, notable EVENTS the window triggered, pulling in angles nothing else in the
   app surfaces as "recent": standings crossings, streaks starting/continuing/snapping,
   head-to-head rivalry LEAD CHANGES (not just record padding — only when the lead
   actually flips or evens up, for the same "restating a number isn't news" reason),
   and first-time-commander plays. A quiet window can legitimately produce zero
   events — that's shown as an honest "nothing stood out" state, not papered over.
   Distinct from Game Window below (which shows stats OF a window and deliberately
   ignores the time scope like the rest of this tab) — Recent Impact DOES respect the
   active time-scope filter (gamesForYear(), not recentSorted()/ALL_GAMES), since
   "this period" should mean whatever's selected up top. Own small slider (1-10,
   default IMPACT_DEFAULT_N) since the useful range is much smaller than the Game
   Window's 10/25/50/All. */
const IMPACT_DEFAULT_N = 2;
let impactN = IMPACT_DEFAULT_N;
function impactPool(){
  // Same player-exclude filter as the rest of the Games tab (rgExcluded), but scoped
  // to the active time filter — the one deliberate exception on this tab.
  const pool=gamesForYear().filter(g=>!rgExcluded.size || !g.seats.some(s=>rgExcluded.has(s.player)));
  return pool.slice().sort((a,b)=>{
    const da=a.date||'', db=b.date||'';
    if(da!==db) return da<db?1:-1;
    return (b.order||0)-(a.order||0);
  });
}
// h2h ahead/behind/tied records, scoped to a given games pool (mirrors the accumulator
// in computeStats, but built fresh here since S.h2h doesn't respect rgExcluded).
function h2hRecordsFor(games){
  const H={};
  games.forEach(g=>{
    for(let i=0;i<g.seats.length;i++)for(let j=0;j<g.seats.length;j++){
      if(i===j) continue;
      const a=g.seats[i], b=g.seats[j];
      const row=H[a.player]||(H[a.player]={});
      const rec=row[b.player]||(row[b.player]={games:0,a:0,b:0,t:0});
      rec.games++; if(a.rank<b.rank)rec.a++; else if(a.rank>b.rank)rec.b++; else rec.t++;
    }
  });
  return H;
}
// A "Clean Sweep": the winner (rank 1) with the other three seats all tied at the same
// non-1 rank — a single decisive win that ends everyone else's game at once. Shared by
// Recent Impact (the news event), the Decks Piloted count on Player Profile, and the
// Executioner tag, so all three agree on exactly what counts.
function cleanSweepWinner(g){
  if(!g.seats || g.seats.length!==4) return null;
  const winner=g.seats.find(s=>s.rank===1);
  if(!winner) return null;
  const others=g.seats.filter(s=>s!==winner);
  if(others.length!==3) return null;
  const r0=others[0].rank;
  if(r0===1 || !others.every(s=>s.rank===r0)) return null;
  return winner;
}
// "Game Story" — one combined headline per game for three per-game facts (Clean Sweep,
// notable pace, winner's early Sol Ring), shared by Recent Impact (pod-wide) and Matchup News
// (one pair's shared games) so both feeds agree on what counts and read the same way. Real
// data check before building this (see Recent Impact's original commit): 44% of Clean Sweep
// games ALSO have a notable pace, and 22% ALSO have the winner landing an early Sol Ring —
// without merging, nearly half of all sweeps would double up with a second line about the
// exact same game. Early Sol Ring alone is deliberately NOT its own event type: it happens in
// 41% of games (any seat) — far too common to be "news" by itself — so it only ever appears as
// an accent clause on a game that's already headline-worthy. Headline priority: Clean Sweep >
// pace — a sweep that also ran fast/long gets a short pace accent clause appended rather than
// its own line; a non-sweep game with notable pace gets a pace headline instead. Every clause
// (base + accents) is picked deterministically by game number, not Math.random(), so the same
// historical game always reads the same way instead of rewording itself on every re-render.
function paceBucket(mins){
  if(mins==null) return null;
  if(mins<30) return 'reallyFast';
  if(mins<60) return 'fast';
  if(mins<=120) return null;
  if(mins<=145) return 'long';
  return 'veryLong';
}
const GAME_STORY_SWEEP_KEYS=['impact_ev_sweep_1','impact_ev_sweep_2','impact_ev_sweep_3','impact_ev_sweep_4','impact_ev_sweep_5'];
const GAME_STORY_PACE_KEYS={
  reallyFast:['impact_ev_pace_reallyfast_1','impact_ev_pace_reallyfast_2'],
  fast:['impact_ev_pace_fast_1','impact_ev_pace_fast_2'],
  long:['impact_ev_pace_long_1','impact_ev_pace_long_2'],
  veryLong:['impact_ev_pace_verylong_1','impact_ev_pace_verylong_2']
};
const GAME_STORY_PACE_ACCENT_KEYS={reallyFast:'impact_ev_pace_accent_reallyfast', fast:'impact_ev_pace_accent_fast',
  long:'impact_ev_pace_accent_long', veryLong:'impact_ev_pace_accent_verylong'};
const GAME_STORY_PACE_TAG={reallyFast:'impact_tag_pace_reallyfast', fast:'impact_tag_pace_fast',
  long:'impact_tag_pace_long', veryLong:'impact_tag_pace_verylong'};
// Which game of the day this was (the sheet has no explicit session-of-day column, but g.order
// is assigned in row/chronological order at parse time — see `order:games.length` in the CSV
// parser — so grouping ALL_GAMES by date and ranking by `order` recovers it). Used to label
// events like "Aug 17, 2026 · Game 2" on days the group played more than once; total===1 days
// just show the date with no qualifier, since "Game 1" would be redundant noise every time.
function dayIndexInfo(g){
  if(!g || !g.date) return null;
  const sameDay=(ALL_GAMES||[]).filter(x=>x.date===g.date).sort((a,b)=>(a.order||0)-(b.order||0));
  const idx=sameDay.indexOf(g);
  return {index:idx+1, total:sameDay.length};
}
// Latest (windowGames is newest-first) game a player appears in, for dating "state" events
// (standings rank, streaks) that describe a running condition rather than one specific game.
function latestGameFor(games, player){
  return games.find(g=>g.seats.some(s=>s.player===player)) || null;
}
// "Aug 17, 2026" normally, "Aug 17, 2026 · Game 2" on a day with more than one game — the
// qualifier only appears when it's actually informative (dayTotal>1), so single-game days
// (the vast majority) don't get a redundant "Game 1" on every line.
function eventDateLabel(e){
  const base=localizedGameDate(e.date);
  return (e.dayTotal>1) ? `${base} · ${t('impact_day_game',{n:e.dayIndex})}` : base;
}
function computeGameStory(windowGames){
  const events=[];
  windowGames.forEach(g=>{
    const winner=g.seats.find(s=>s.rank===1);
    if(!winner) return;
    const isSweep=cleanSweepWinner(g)===winner;
    const bucket=paceBucket(g.gametime);
    if(!isSweep && !bucket) return; // early Sol Ring alone never headlines — too common
    const pick=arr=>arr[(g.num!=null?g.num:0)%arr.length];
    let html, type, tagKey;
    if(isSweep){
      const losers=g.seats.filter(s=>s!==winner).map(s=>esc(s.player));
      const losersTxt=`${losers[0]}, ${losers[1]}, and ${losers[2]}`;
      html=t(pick(GAME_STORY_SWEEP_KEYS),{winner:`<b>${esc(winner.player)}</b>`,losers:`<b>${losersTxt}</b>`});
      if(bucket) html+=' '+t(GAME_STORY_PACE_ACCENT_KEYS[bucket],{mins:g.gametime});
      type='sweep'; tagKey='impact_tag_sweep';
    } else {
      html=t(pick(GAME_STORY_PACE_KEYS[bucket]),{winner:`<b>${esc(winner.player)}</b>`,mins:g.gametime});
      type='pace'; tagKey=GAME_STORY_PACE_TAG[bucket];
    }
    if(winner.sol===1) html+=' '+t('impact_ev_solring_accent');
    const di=dayIndexInfo(g);
    events.push({type, tagKey, weight:1, date:g.date, dayIndex:di&&di.index, dayTotal:di&&di.total, winner:winner.player, winnerCommander:winner.commander, html});
  });
  return events;
}
function computeRecentImpact(n){
  const sorted=impactPool(); // newest-first, within the active time scope
  if(!sorted.length) return null;
  const windowGames=sorted.slice(0, Math.min(n, sorted.length));
  const windowSet=new Set(windowGames);
  const beforeGames=sorted.filter(g=>!windowSet.has(g));
  const statsFor=games=>{
    const acc={};
    games.forEach(g=>g.seats.forEach(s=>{
      const p=acc[s.player]||(acc[s.player]={g:0,w:0,rs:0});
      p.g++; if(s.rank===1)p.w++; p.rs+=s.rank;
    }));
    return acc;
  };
  const seasonAcc=statsFor(sorted), beforeAcc=statsFor(beforeGames);
  // Same eligibility bar as the Overview leaderboard/podium, so "rank" here means the
  // same thing it does everywhere else in the app.
  const gameCounts=Object.values(seasonAcc).map(s=>s.g);
  const minG=(curYear==='all')?20:Math.min(20, Math.max(...gameCounts,1));
  const rankOf=acc=>{
    const arr=Object.entries(acc).filter(([p,s])=>s.g>=minG).map(([p,s])=>({player:p,wr:100*s.w/s.g}));
    arr.sort((a,b)=>b.wr-a.wr);
    const m={}; arr.forEach((r,i)=>{ m[r.player]=i+1; });
    return m;
  };
  const rankAfter=rankOf(seasonAcc), rankBefore=rankOf(beforeAcc);
  const streakAfterByPlayer={}, streakBeforeByPlayer={};
  computeStreaksForGames(sorted, null).forEach(r=>{ streakAfterByPlayer[r.player]=r; });
  computeStreaksForGames(beforeGames, null).forEach(r=>{ streakBeforeByPlayer[r.player]=r; });

  const involved=new Set();
  windowGames.forEach(g=>g.seats.forEach(s=>involved.add(s.player)));
  const events=[];

  // 1) standings crossings — dated to this player's most recent game in the window, since a
  // rank crossing is a before/after state comparison, not one specific game.
  involved.forEach(p=>{
    const rb=rankBefore[p], ra=rankAfter[p];
    if(rb!=null && ra!=null && rb!==ra){
      const g=latestGameFor(windowGames,p), di=dayIndexInfo(g);
      events.push({type:'rank', weight:Math.abs(rb-ra)+10, date:g&&g.date, dayIndex:di&&di.index, dayTotal:di&&di.total,
        html:t('impact_ev_rank',{name:`<b>${esc(p)}</b>`,from:rb,to:ra})});
    }
  });

  // 2) streak started/continuing/snapped — each of the 4 cases gets its own tag text
  // (not just a border color) since "Marco snapped a losing streak" (good, green) and
  // "Tuan is on a losing streak" (bad, red) both contain the words "losing streak" —
  // color alone was too easy to misread at a glance.
  involved.forEach(p=>{
    const after=streakAfterByPlayer[p]||{curWin:0,curDry:0};
    const before=streakBeforeByPlayer[p]||{curWin:0,curDry:0};
    const g=latestGameFor(windowGames,p), di=dayIndexInfo(g);
    const stamp={date:g&&g.date, dayIndex:di&&di.index, dayTotal:di&&di.total};
    if(after.curWin>=2){
      events.push({type:'streak-up', tagKey:'impact_tag_hot', weight:after.curWin, ...stamp, html:t('impact_ev_streak_win',{name:`<b>${esc(p)}</b>`,n:after.curWin})});
    } else if(after.curDry>=2){
      events.push({type:'streak-down', tagKey:'impact_tag_cold', weight:after.curDry, ...stamp, html:t('impact_ev_streak_dry',{name:`<b>${esc(p)}</b>`,n:after.curDry})});
    } else if(before.curWin>=2 && after.curWin<before.curWin){
      events.push({type:'streak-down', tagKey:'impact_tag_streak_end', weight:before.curWin, ...stamp, html:t('impact_ev_streak_snap_win',{name:`<b>${esc(p)}</b>`,n:before.curWin})});
    } else if(before.curDry>=2 && after.curDry<before.curDry){
      events.push({type:'streak-up', tagKey:'impact_tag_turnaround', weight:before.curDry, ...stamp, html:t('impact_ev_streak_snap_dry',{name:`<b>${esc(p)}</b>`,n:before.curDry})});
    }
  });

  // 3) head-to-head rivalry lead changes (only actual flips/ties, not padded leads —
  // restating "still ahead, now by one more" isn't news, same lesson as the win-rate delta)
  const beforeH2H=h2hRecordsFor(beforeGames), afterH2H=h2hRecordsFor(sorted);
  const pairsSeen=new Set();
  windowGames.forEach(g=>{
    for(let i=0;i<g.seats.length;i++)for(let j=i+1;j<g.seats.length;j++){
      const a=g.seats[i].player, b=g.seats[j].player;
      const key=[a,b].sort().join('|||');
      if(pairsSeen.has(key)) return; pairsSeen.add(key);
      const statusOf=rec=> (!rec||rec.games===0) ? null : (rec.a>rec.b?'a':rec.a<rec.b?'b':'tie');
      const br=beforeH2H[a]&&beforeH2H[a][b], ar=afterH2H[a]&&afterH2H[a][b];
      const bs=statusOf(br), as=statusOf(ar);
      if(!ar || !bs || bs===as) return; // no prior history, or nothing changed
      const di=dayIndexInfo(g);
      if(as==='tie'){
        events.push({type:'rivalry', weight:5, date:g.date, dayIndex:di&&di.index, dayTotal:di&&di.total,
          html:t('impact_ev_rivalry_tie',{a:`<b>${esc(a)}</b>`,b:`<b>${esc(b)}</b>`,rec:`${ar.a}-${ar.b}`})});
      } else {
        const leader=as==='a'?a:b, other=as==='a'?b:a, ls=as==='a'?ar.a:ar.b, os=as==='a'?ar.b:ar.a;
        events.push({type:'rivalry', weight:6, date:g.date, dayIndex:di&&di.index, dayTotal:di&&di.total,
          html:t('impact_ev_rivalry_flip',{leader:`<b>${esc(leader)}</b>`,other:`<b>${esc(other)}</b>`,rec:`${ls}-${os}`})});
      }
    }
  });

  // 4) commander debuts + first win/first loss with a commander already piloted before.
  // Both fall out of ONE running per-(player,commander) tally seeded from beforeGames and
  // walked forward through the window in chronological order (windowGames is newest-first,
  // so reversed here) — the tally itself makes each of the three outcomes fire at most once
  // per key without needing separate "seen" sets: gamesBefore===0 can only be true once
  // (their very first appearance), winsBefore===0 can only be true until their first win,
  // and winsBefore===gamesBefore (undefeated) can only be true until their first non-win.
  const cmdTally={}; // "player|||commander" -> {games, wins}, running total
  beforeGames.forEach(g=>g.seats.forEach(s=>{
    const k=s.player+'|||'+s.commander;
    const t=cmdTally[k]||(cmdTally[k]={games:0,wins:0});
    t.games++; if(s.rank===1)t.wins++;
  }));
  // "first-ever"/"undefeated" only means what it says when the active scope really is
  // All Time — impactPool() (and this whole tally) is scoped to the time filter, so a
  // named year or custom range needs narrower phrasing or it overclaims.
  const scopeKind = customRange ? 'period' : (curYear==='all' ? 'ever' : 'year');
  windowGames.slice().reverse().forEach(g=>{
    const di=dayIndexInfo(g);
    g.seats.forEach(s=>{
      const k=s.player+'|||'+s.commander;
      const tk=cmdTally[k]||(cmdTally[k]={games:0,wins:0});
      const gamesBefore=tk.games, winsBefore=tk.wins;
      if(gamesBefore===0){
        const outcome = s.rank===1 ? t('impact_outcome_win') : t('impact_outcome_other',{rank:s.rank});
        events.push({type:'commander', tagKey:'impact_tag_commander', weight:1, date:g.date, dayIndex:di&&di.index, dayTotal:di&&di.total,
          html:t('impact_ev_commander',{name:`<b>${esc(s.player)}</b>`,commander:esc(s.commander),outcome})});
      } else if(winsBefore===0 && s.rank===1){
        const key=scopeKind==='ever'?'impact_ev_commander_first_win':scopeKind==='year'?'impact_ev_commander_first_win_year':'impact_ev_commander_first_win_period';
        events.push({type:'commander-first-win', tagKey:'impact_tag_first_win', weight:2, date:g.date, dayIndex:di&&di.index, dayTotal:di&&di.total,
          html:t(key,{name:`<b>${esc(s.player)}</b>`,commander:esc(s.commander),year:curYear})});
      } else if(winsBefore===gamesBefore && s.rank!==1){
        const key=scopeKind==='ever'?'impact_ev_commander_first_loss':scopeKind==='year'?'impact_ev_commander_first_loss_year':'impact_ev_commander_first_loss_period';
        events.push({type:'commander-first-loss', tagKey:'impact_tag_first_loss', weight:2, date:g.date, dayIndex:di&&di.index, dayTotal:di&&di.total,
          html:t(key,{name:`<b>${esc(s.player)}</b>`,commander:esc(s.commander),n:gamesBefore,year:curYear})});
      }
      tk.games++; if(s.rank===1)tk.wins++;
    });
  });

  // 5) "Game Story" — see computeGameStory() above (shared with Matchup News) for the full
  // reasoning: one combined headline per game for Clean Sweep / notable pace / winner's early
  // Sol Ring, instead of a separate line for each.
  events.push(...computeGameStory(windowGames));

  // 6) "Comeback" — a player resurfaces after a real-world gap of COMEBACK_MIN_DAYS+ days
  // since their last game. Time-based, not game-count: the group's play frequency is too
  // uneven (1-21 games/month, same reason ROLLING_WINDOW_GAMES avoids calendar windows for
  // the OPPOSITE reason) for "N games since last played" to mean a consistent amount of real
  // time away — 20 games could be a week or three months depending on how active the group
  // was in between. One chronological pass tracking each player's last-played date; a true
  // debut (never appeared before in this pool) has no prior date, so it's correctly skipped
  // rather than treated as an infinite gap. Undated games are skipped entirely (both for
  // firing and for updating last-played) since elapsed time can't be measured without a date.
  // Flavor text picked deterministically by game number, same "don't reword history on every
  // re-render" rule as the Clean Sweep lines.
  const COMEBACK_MIN_DAYS=28;
  const COMEBACK_KEYS=['impact_ev_comeback_1','impact_ev_comeback_2','impact_ev_comeback_3'];
  const lastSeenDate={};
  sorted.slice().reverse().forEach(g=>{
    if(!g.date) return;
    g.seats.forEach(s=>{
      const prev=lastSeenDate[s.player];
      const gapDays=prev!=null ? Math.round((ymdToDate(g.date)-ymdToDate(prev))/86400000) : null;
      if(gapDays!=null && gapDays>=COMEBACK_MIN_DAYS && windowSet.has(g)){
        const weeks=Math.round(gapDays/7);
        const key=COMEBACK_KEYS[(g.num!=null?g.num:0)%COMEBACK_KEYS.length];
        const di=dayIndexInfo(g);
        events.push({type:'comeback', tagKey:'impact_tag_comeback', weight:gapDays, date:g.date, dayIndex:di&&di.index, dayTotal:di&&di.total,
          html:t(key,{name:`<b>${esc(s.player)}</b>`,n:weeks})});
      }
      lastSeenDate[s.player]=g.date;
    });
  });

  // 7) "Tag Trade" — a pod-wide superlative tag (Endboss, Rentner, etc.) changing hands between
  // the start and end of the window. Only the true single-winner competitive tags qualify
  // (TRADE_TAGS below) — not tag_deco/tag_guest/tag_wallflower, which are fallbacks anyone
  // under the games floor or with no other tag gets, not something actually "won" from someone.
  // Reuses computeTagsForGames at the same MIN_TAG_GAMES eligibility floor as everywhere else
  // tags appear, run once on beforeGames and once on the full scoped pool; a tag only "trades"
  // when it had a holder on both sides and they're different people — a tag with no prior
  // holder (just-crossed the games floor) is a debut, not a trade, so that case is skipped.
  // Each tag gets its OWN custom flavor line (impact_ev_trade_<tag>) rather than one generic
  // "X took over Y's tag" template, per direct request: losing Endboss and losing Rentner (the
  // group's self-deprecating longest-losing-streak title) are very different kinds of news.
  // Dated to the most recent game in the window, same "as of now" convention as rank/streaks,
  // since a tag handoff is a state comparison, not one specific game.
  const TRADE_TAGS=['tag_endboss','tag_badluck','tag_grinder','tag_bench','tag_podium','tag_solking',
    'tag_brewer','tag_onetrick','tag_slowpoke','tag_speed','tag_streaker','tag_rentner','tag_executioner','tag_onfire'];
  const holderMap=games=>{
    const tags=computeTagsForGames(games, MIN_TAG_GAMES);
    const m={};
    Object.entries(tags).forEach(([p,arr])=>arr.forEach(o=>{ if(TRADE_TAGS.includes(o.key) && !(o.key in m)) m[o.key]=p; }));
    return m;
  };
  const tagsBefore=holderMap(beforeGames), tagsAfter=holderMap(sorted);
  const tradeG=windowGames[0], tradeDi=dayIndexInfo(tradeG);
  TRADE_TAGS.forEach(tk=>{
    const oldP=tagsBefore[tk], newP=tagsAfter[tk];
    if(oldP && newP && oldP!==newP){
      events.push({type:'tag-trade', tagKey:tk, weight:3, date:tradeG&&tradeG.date, dayIndex:tradeDi&&tradeDi.index, dayTotal:tradeDi&&tradeDi.total,
        html:t('impact_ev_trade_'+tk.slice(4), {old:`<b>${esc(oldP)}</b>`, new:`<b>${esc(newP)}</b>`})});
    }
  });

  // Sorted chronologically by the game each event is about (newest first, matching every other
  // "recent first" list in the app) rather than grouped by event type — on user feedback that
  // grouping by type ("all the sweeps, then all the streaks...") read oddly out of order once
  // events carried dates, since e.g. a Feb sweep would sit above a May streak. Type/weight is
  // now only a same-day tiebreaker (dayIndex descending — later game of the day first — then
  // the old priority order), not the primary sort.
  events.sort((a,b)=>{
    const da=a.date||'', db=b.date||'';
    if(da!==db) return da<db?1:-1;
    if((a.dayIndex||0)!==(b.dayIndex||0)) return (b.dayIndex||0)-(a.dayIndex||0);
    const order={sweep:6,comeback:5,rank:5,'tag-trade':5,rivalry:4,'streak-up':3,'streak-down':3,pace:3,
      'commander-first-win':2,'commander-first-loss':2,commander:1};
    if(order[a.type]!==order[b.type]) return order[b.type]-order[a.type];
    return b.weight-a.weight;
  });
  const dated=windowGames.filter(g=>g.date).map(g=>g.date).sort();
  return {n:windowGames.length, events, from:dated[0]||null, to:dated[dated.length-1]||null};
}

/* ===== Play activity: calendar heatmap + session stats =====
   Lives on Insights (moved off Games — that tab got too long once you crank the
   window up). Follows the global time scope (gamesForYear(), not ALL_GAMES) — originally
   built scope-independent on the theory that "when did we play" wouldn't mean much sliced
   to one year, but on user feedback that's backwards: a year-scoped calendar is exactly
   what you want when asking "how active were we in 2026". Still deliberately ignores the
   Insights window lens (insWinSize) though — windowing "last N games" would chop the
   calendar off mid-timeline in a way that wouldn't read as a calendar anymore. It DOES
   follow the Insights player-exclude filter (insExcluded) since that's the visible control
   on this tab now. A "session" = every game sharing a calendar date, since the sheet only
   has date-level granularity. */
function ymdToDate(s){ const[y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function dateToYmd(dt){ return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
function computeActivity(){
  const pool=gamesForYear().filter(g=>g.date && (!insExcluded.size || !g.seats.some(s=>insExcluded.has(s.player))));
  const byDate={};
  pool.forEach(g=>{ byDate[g.date]=(byDate[g.date]||0)+1; });
  const dates=Object.keys(byDate).sort();
  if(!dates.length) return null;
  const sessions=dates.map(d=>({date:d, games:byDate[d]}));
  const longest=sessions.slice().sort((a,b)=>b.games-a.games)[0];
  let gapSum=0, gapN=0;
  for(let i=1;i<dates.length;i++){
    gapSum += Math.round((ymdToDate(dates[i])-ymdToDate(dates[i-1]))/86400000);
    gapN++;
  }
  return {
    byDate, dates, totalGames:pool.length, totalSessions:dates.length,
    avgPerSession:+(pool.length/dates.length).toFixed(1), longest,
    avgGapDays: gapN? +(gapSum/gapN).toFixed(1) : null
  };
}
function renderActivity(){
  const statHost=$('#actStats'), mapHost=$('#actHeatmap');
  if(!statHost || !mapHost) return;
  const d=computeActivity();
  if(!d){
    statHost.innerHTML=`<div class="gl-stat"><div class="lbl">${t('activity_none')}</div></div>`;
    mapHost.innerHTML='';
    return;
  }
  statHost.innerHTML=[
    [t('act_sessions'), d.totalSessions, t('act_sessions_note',{n:d.totalGames})],
    [t('act_longest'), d.longest.games, localizedGameDate(d.longest.date)],
    [t('act_avg_session'), d.avgPerSession, ''],
    [t('act_avg_gap'), d.avgGapDays!=null?d.avgGapDays+'d':'—', ''],
  ].map(s=>`<div class="gl-stat"><div class="big">${s[1]}</div><div class="lbl">${s[0]}</div>${s[2]?`<div class="note">${s[2]}</div>`:''}</div>`).join('');
  renderActivityHeatmap(d.byDate, d.dates);
}
function renderActivityHeatmap(byDate, dates){
  const host=$('#actHeatmap'); if(!host) return;
  const minD=ymdToDate(dates[0]), maxD=ymdToDate(dates[dates.length-1]);
  const start=new Date(minD); start.setDate(start.getDate()-start.getDay()); // back to the Sunday on/before
  const maxCount=Math.max(...Object.values(byDate),1);
  const CELL=11, GAP=3, STEP=CELL+GAP, GRID_X=30, GRID_Y=18;
  let cur=new Date(start), col=0, lastMonthKey=null;
  const cells=[], monthMarks=[];
  while(cur<=maxD){
    const dow=cur.getDay();
    if(dow===0 && cur.getTime()!==start.getTime()) col++;
    const monthKey=cur.getFullYear()+'-'+cur.getMonth();
    if(dow===0 && monthKey!==lastMonthKey){
      monthMarks.push({col, label:cur.toLocaleString(lang,{month:'short'})});
      lastMonthKey=monthKey;
    }
    const inRange = cur>=minD && cur<=maxD;
    if(inRange){
      const key=dateToYmd(cur);
      cells.push({col, dow, count:byDate[key]||0, key});
    }
    cur.setDate(cur.getDate()+1);
  }
  const numCols=col+1;
  const W=GRID_X+numCols*STEP, H=GRID_Y+7*STEP+4;
  const level=c=>{
    if(c<=0) return 0;
    const frac=c/maxCount;
    return frac<=0.25?1:frac<=0.5?2:frac<=0.75?3:4;
  };
  const LEVEL_COLORS=['var(--bg2)','rgba(217,178,90,.28)','rgba(217,178,90,.52)','rgba(217,178,90,.78)','var(--gold)'];
  let rects='';
  cells.forEach(c=>{
    const x=GRID_X+c.col*STEP, y=GRID_Y+c.dow*STEP;
    const title=c.count>0 ? t('activity_cell',{date:localizedGameDate(c.key), n:c.count}) : localizedGameDate(c.key);
    rects+=`<rect x="${x}" y="${y}" width="${CELL}" height="${CELL}" rx="2.5" fill="${LEVEL_COLORS[level(c.count)]}"><title>${esc(title)}</title></rect>`;
  });
  let monthLabels='';
  monthMarks.forEach(m=>{
    monthLabels+=`<text x="${GRID_X+m.col*STEP}" y="${GRID_Y-6}" fill="var(--ink3)" font-size="10" font-family="JetBrains Mono">${m.label}</text>`;
  });
  const dayLabels=[1,3,5].map(dw=>`<text x="0" y="${GRID_Y+dw*STEP+CELL-1}" fill="var(--ink3)" font-size="9.5" font-family="JetBrains Mono">${['Su','Mo','Tu','We','Th','Fr','Sa'][dw]}</text>`).join('');
  host.innerHTML=`<svg width="${W}" height="${H}" class="act-svg">${monthLabels}${dayLabels}${rects}</svg>`;
  // Scroll to the most recent activity by default. rebuild() renders every hub tab up
  // front, including hidden ones (applyRouteVisibility runs after renderRecent), so this
  // section is very often measured with width 0 at render time — scrollLeft=scrollWidth
  // would silently no-op. Fall back to watching for the wrapper actually becoming visible.
  const wrap=host.closest('.act-heatmap-wrap');
  if(wrap){
    const applyScroll=()=>{ wrap.scrollLeft=wrap.scrollWidth; };
    if(wrap.clientWidth>0){ applyScroll(); }
    else if(window.ResizeObserver){
      const ro=new ResizeObserver(()=>{ if(wrap.clientWidth>0){ applyScroll(); ro.disconnect(); } });
      ro.observe(wrap);
    }
  }
}

// sync the size chips, slider bounds/value, stepper enabled state, and focus label
function updateRecentControls(win){
  // size chips: highlight only if the current size matches a preset (0/10/25/50)
  const presets=[0,10,25,50];
  const isPreset=presets.includes(rgWinSize);
  const seg=$('#rgWinSeg');
  if(seg) seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on', isPreset && (+b.dataset.w)===rgWinSize));
  // custom field: show the number when it's a non-preset custom size, else clear
  const cust=$('#rgWinCustom');
  if(cust){
    cust.placeholder=t('rg_win_custom_ph');
    if(document.activeElement!==cust) cust.value = (!isPreset && rgWinSize>0) ? String(rgWinSize) : '';
    cust.classList.toggle('active', !isPreset && rgWinSize>0);
  }
  // slider
  const slider=$('#rgSlider'), sliderRow=$('#rgSliderRow');
  const wholeThing = win.size>=win.total; // window covers everything -> no scrubbing
  if(sliderRow) sliderRow.style.display = wholeThing ? 'none' : '';
  if(slider){
    slider.max=String(win.maxEnd);
    slider.value=String(win.start);
    slider.disabled = wholeThing;
  }
  const newer=$('#rgStepNewer'), older=$('#rgStepOlder');
  if(newer) newer.disabled = win.start<=0;
  if(older) older.disabled = win.start>=win.maxEnd;
  // focus label: which games + date span are in view
  const focus=$('#rgFocus');
  if(focus){
    const first=win.slice[0], last=win.slice[win.slice.length-1]; // first=newest in window
    const nums = (first&&first.num!=null&&last&&last.num!=null)
      ? `#${last.num}–#${first.num}` : '';
    const dates = (last&&last.date&&first&&first.date)
      ? `${localizedGameDate(last.date)} – ${localizedGameDate(first.date)}` : '';
    const posLabel = wholeThing
      ? t('rg_focus_all',{n:win.total})
      : t('rg_focus_window',{n:win.size, total:win.total, from:win.start+1, to:win.start+win.size});
    focus.innerHTML=`<span class="rg-focus-main">${posLabel}</span>${dates?`<span class="rg-focus-dates">${dates}${nums?` · ${nums}`:''}</span>`:''}`;
  }
}
