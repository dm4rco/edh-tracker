<style>
:root{
  --bg:#0b110d; --bg2:#0f1712; --panel:#141f18; --panel2:#1a2a21;
  --line:#25392e; --line2:#345140;
  --ink:#eef4ef; --ink2:#b7c6bc; --ink3:#7c9184;
  --gold:#d9b25a; --gold2:#f0cd7e; --gold-ink:#1a1207;
  --W:#f7f3e3; --U:#3a7bd5; --B:#7a5b8c; --R:#d6442f; --G:#3f9b54;
  --win:#4aa963; --lose:#d95a44; --mid:#d9b25a;
  --radius:16px; --radius-s:10px;
  --shadow:0 10px 34px rgba(0,0,0,.42);
  --topbar-h:58px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1100px 540px at 85% -8%,#182a20 0%,transparent 60%),
    radial-gradient(900px 480px at 0% 108%,#14211a 0%,transparent 55%),
    var(--bg);}
.wrap{max-width:1400px;margin:0 auto;padding:0 28px}
::selection{background:var(--gold);color:var(--gold-ink)}
button{font-family:inherit}
a{color:inherit;text-decoration:none}

/* ============ TOP BAR ============ */
.topbar{position:sticky;top:0;z-index:90;background:rgba(10,15,12,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar-inner{display:flex;align-items:center;gap:18px;height:var(--topbar-h)}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand-mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(160deg,var(--gold2),var(--gold));color:var(--gold-ink);display:flex;align-items:center;justify-content:center;font-family:'Oswald';font-weight:700;font-size:14px;letter-spacing:.02em;box-shadow:0 2px 10px rgba(217,178,90,.25)}
.brand-name{font-family:'Oswald';font-weight:600;font-size:16px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.brand-name i{font-style:normal;font-weight:300;color:var(--ink2)}
.tabs{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font-family:'Oswald';font-weight:500;font-size:14.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);padding:8px 14px;border-radius:9px;white-space:nowrap;transition:.16s;position:relative}
.tab:hover{color:var(--ink);background:rgba(255,255,255,.04)}
.tab.active{color:var(--gold2)}
.tab.active::after{content:"";position:absolute;left:14px;right:14px;bottom:2px;height:2px;border-radius:2px;background:var(--gold)}
.topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-left:auto}
.scope-anchor{position:relative}
.scopechip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line2);color:var(--ink);font-family:'Oswald';font-weight:500;font-size:13.5px;letter-spacing:.03em;padding:8px 12px;border-radius:9px;cursor:pointer;transition:.15s;white-space:nowrap}
.scopechip:hover{border-color:var(--gold)}
.scopechip svg{width:14px;height:14px;stroke:var(--gold2);flex-shrink:0}
.scopechip .chev{width:11px;height:11px;stroke:var(--ink3)}
.scopechip.customized{border-color:var(--gold);background:rgba(217,178,90,.10)}
.iconbtn{width:36px;height:36px;border-radius:9px;background:var(--panel);border:1px solid var(--line);color:var(--ink2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;flex-shrink:0}
.iconbtn:hover{color:var(--ink);border-color:var(--line2)}
.iconbtn svg{width:16px;height:16px}
.iconbtn.spin svg{animation:spin2 .8s linear infinite}

/* scope popover */
.scope-pop{position:absolute;top:calc(100% + 10px);right:0;z-index:200;background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.55);padding:16px;min-width:300px;display:none}
.scope-pop.on{display:block;animation:fade .18s ease}
.sp-lbl{font-family:'JetBrains Mono';font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink3);margin-bottom:9px}
.sp-years{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.sp-years button{font-family:'Oswald';font-weight:500;font-size:14px;letter-spacing:.03em;color:var(--ink2);background:var(--bg2);border:1px solid var(--line);padding:8px 15px;border-radius:9px;cursor:pointer;transition:.15s}
.sp-years button:hover{border-color:var(--line2);color:var(--ink)}
.sp-years button.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.sp-divider{height:1px;background:var(--line);margin:2px 0 14px}
.rp-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.rp-lbl{font-family:'Oswald';font-weight:500;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink3)}
.rp-sel{flex:1;max-width:170px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:'Inter';font-size:13px;padding:8px 10px;cursor:pointer}
.rp-sel:focus{outline:none;border-color:var(--gold)}
.rp-actions{display:flex;gap:8px;margin-top:13px}
.rp-clear,.rp-apply{flex:1;font-family:'Oswald';font-weight:500;text-transform:uppercase;font-size:13px;letter-spacing:.03em;padding:9px;border-radius:8px;cursor:pointer;border:1px solid var(--line);transition:.15s}
.rp-clear{background:none;color:var(--ink3)}
.rp-clear:hover{color:var(--ink);border-color:var(--line2)}
.rp-apply{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.rp-apply:hover{background:var(--gold2)}

/* ============ HERO ============ */
.hero{position:relative;border-bottom:1px solid var(--line);overflow:hidden;background:linear-gradient(180deg,rgba(11,17,13,.15),rgba(11,17,13,.65))}
.mana-ring{position:absolute;top:-170px;right:-130px;width:520px;height:520px;border-radius:50%;opacity:.15;pointer-events:none;
  background:conic-gradient(var(--W) 0 72deg,var(--U) 72deg 144deg,var(--B) 144deg 216deg,var(--R) 216deg 288deg,var(--G) 288deg 360deg);filter:blur(2px);
  -webkit-mask:radial-gradient(circle,transparent 38%,#000 39%,#000 60%,transparent 61%);mask:radial-gradient(circle,transparent 38%,#000 39%,#000 60%,transparent 61%);
  animation:spin 90s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hero-inner{position:relative;padding:26px 0 24px;display:flex;align-items:flex-end;justify-content:space-between;gap:30px;flex-wrap:wrap}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin-bottom:9px;display:flex;align-items:center;gap:11px}
.eyebrow::before{content:"";width:30px;height:1px;background:var(--gold)}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--G);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,155,84,.5)}70%{box-shadow:0 0 0 8px rgba(63,155,84,0)}100%{box-shadow:0 0 0 0 rgba(63,155,84,0)}}
h1{font-family:'Oswald';font-weight:600;font-size:clamp(32px,4.2vw,52px);line-height:.98;letter-spacing:-.01em;text-transform:uppercase}
h1 .thin{font-weight:300;color:var(--ink2)}
.hero-sub{color:var(--ink3);font-size:13.5px;margin-top:10px;max-width:480px}
.hero-stats{display:flex;flex-wrap:wrap;gap:8px}
.hstat{background:rgba(20,31,24,.6);border:1px solid var(--line);border-radius:12px;padding:12px 18px;min-width:104px;backdrop-filter:blur(6px)}
.hstat .n{font-family:'Oswald';font-weight:600;font-size:24px;line-height:1;color:var(--gold2)}
.hstat .l{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.1em;margin-top:6px}

/* ============ LAYOUT / SECTIONS ============ */
main{padding:30px 0 90px}
.view{display:none;animation:fade .3s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sec{scroll-margin-top:calc(var(--topbar-h) + 66px);margin-bottom:44px}
.sec:last-child{margin-bottom:0}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.section-head h2{font-family:'Oswald';font-weight:600;font-size:25px;text-transform:uppercase;letter-spacing:.01em;display:flex;align-items:center;gap:12px}
.section-head h2::before{content:"";width:5px;height:22px;border-radius:3px;background:linear-gradient(180deg,var(--gold2),var(--gold));flex-shrink:0}
.section-head .hint{color:var(--ink3);font-size:13px}
.ti-badge{display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono';font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--gold2);background:rgba(217,178,90,.10);border:1px solid rgba(217,178,90,.3);padding:4px 10px;border-radius:20px;white-space:nowrap}

/* subnav (in-page section chips) */
.subnav{position:sticky;top:var(--topbar-h);z-index:60;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px 0;margin:-10px 0 22px;background:linear-gradient(180deg,var(--bg) 78%,transparent)}
.subnav::-webkit-scrollbar{display:none}
.snav{font-family:'Oswald';font-weight:500;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink3);background:var(--panel);border:1px solid var(--line);padding:7px 14px;border-radius:20px;cursor:pointer;white-space:nowrap;transition:.15s;flex-shrink:0}
.snav:hover{color:var(--ink);border-color:var(--line2)}
.snav.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}

.status{min-height:50vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:40px}
.spinner{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--gold);animation:spin2 .9s linear infinite}
@keyframes spin2{to{transform:rotate(360deg)}}
.status h3{font-family:'Oswald';font-weight:500;font-size:21px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2)}
.status p{color:var(--ink3);max-width:460px;font-size:14px}
.status.err h3{color:var(--lose)}
.status code{font-family:'JetBrains Mono';font-size:12px;background:var(--panel);border:1px solid var(--line);padding:2px 7px;border-radius:5px;color:var(--gold2)}
.status .steps{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 22px;max-width:520px;font-size:13.5px;color:var(--ink2);line-height:1.9}
.status .steps b{color:var(--ink)}
.status .steps ol{margin:8px 0 0;padding-left:20px}
.btn{font-family:'Oswald';font-weight:500;text-transform:uppercase;letter-spacing:.04em;font-size:14px;background:var(--gold);color:var(--gold-ink);border:none;padding:11px 22px;border-radius:9px;cursor:pointer}
.empty{padding:38px;text-align:center;color:var(--ink3)}

.panel{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);margin-bottom:8px}
.chart-panel{padding:22px 24px}
.chart-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.chart-area{width:100%}
.trend-svg{width:100%;height:auto;display:block;overflow:visible}
.chart-note{margin-top:16px;font-size:13.5px;color:var(--ink2);text-align:center;line-height:1.5}
.chart-note b{color:var(--gold2)}

/* tables */
table{width:100%;border-collapse:collapse}
th{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);text-align:right;padding:13px 14px;border-bottom:1px solid var(--line);font-weight:600;cursor:pointer;user-select:none;white-space:nowrap}
th:first-child{text-align:left}
th.sortable:hover{color:var(--gold)}
th .arr{opacity:.6;font-size:9px}
td{padding:13px 14px;text-align:right;border-bottom:1px solid rgba(37,57,46,.5);font-variant-numeric:tabular-nums;font-size:14px}
td:first-child{text-align:left}
tr:last-child td{border-bottom:none}
tbody tr{transition:background .15s}
tbody tr:hover{background:rgba(217,178,90,.06)}
.rank-badge{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;font-family:'Oswald';font-weight:600;font-size:13px;margin-right:10px;background:var(--panel2);color:var(--ink3)}
.rank-badge.top{background:var(--gold);color:var(--gold-ink)}
.pname{font-family:'Oswald';font-weight:500;font-size:16px;text-transform:uppercase;letter-spacing:.02em}
.bar-cell{min-width:130px}
.bar{height:7px;border-radius:4px;background:var(--panel2);overflow:hidden;margin-top:5px}
.bar>i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--G),var(--gold))}
.wr{font-family:'Oswald';font-weight:600;font-size:15px}
.muted{color:var(--ink3)}
.lb-row{cursor:pointer}
.lb-row:hover .pname{color:var(--gold2)}

/* ============ OVERVIEW: highlights + podium ============ */
.hl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:30px}
.hl-card{background:linear-gradient(165deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:16px 18px;text-align:left;cursor:pointer;transition:.16s;display:flex;flex-direction:column;gap:4px;color:var(--ink)}
.hl-card:hover{transform:translateY(-2px);border-color:var(--line2)}
.hl-card.gold{border-color:rgba(217,178,90,.4);background:linear-gradient(165deg,rgba(217,178,90,.10),var(--panel))}
.hl-card.fire{border-color:rgba(255,140,66,.4);background:linear-gradient(165deg,rgba(255,140,66,.09),var(--panel))}
.hl-label{font-family:'JetBrains Mono';font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.hl-card.gold .hl-label{color:var(--gold2)}
.hl-card.fire .hl-label{color:#ff9d5c}
.hl-big{font-family:'Oswald';font-weight:600;font-size:23px;line-height:1.1;text-transform:uppercase}
.hl-sub{font-size:12px;color:var(--ink2)}

.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:6px 0 34px;align-items:end}
.pod-card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--radius);padding:22px 18px;text-align:center;position:relative;box-shadow:var(--shadow);overflow:hidden}
.pod-card.p1{border-color:var(--gold);transform:translateY(-14px)}
.pod-accent{position:absolute;top:0;left:0;right:0;height:4px;z-index:2}
.pod-tint{position:absolute;inset:0;z-index:0;pointer-events:none}
.pod-card.themed .medal,.pod-card.themed .pod-name,.pod-card.themed .dial,.pod-card.themed .pod-meta{position:relative;z-index:1}
.pod-fav{display:inline-flex;vertical-align:middle;margin-left:4px}
.medal{font-family:'Oswald';font-weight:700;font-size:12.5px;letter-spacing:.1em;color:var(--ink3);text-transform:uppercase}
.pod-card.p1 .medal{color:var(--gold)}
.pod-name{font-family:'Oswald';font-weight:600;font-size:25px;margin:8px 0 2px;text-transform:uppercase}
.dial{margin:14px auto 10px;position:relative}
.dial svg{transform:rotate(-90deg)}
.dial .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dial .val b{font-family:'Oswald';font-weight:600;font-size:28px;line-height:1;color:var(--ink)}
.dial .val span{font-size:9.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.1em;margin-top:3px}
.pod-meta{font-size:13px;color:var(--ink2);margin-top:4px}
.pod-meta b{color:var(--ink)}
.pod-clickable{cursor:pointer;transition:transform .18s,border-color .18s}
.pod-clickable:hover{transform:translateY(-4px);border-color:var(--line2)}
.pod-card.p1.pod-clickable:hover{transform:translateY(-18px)}

/* player tags */
.ptags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.pod-name + .ptags{justify-content:center;margin-top:8px;position:relative;z-index:1}
.ptag{font-family:'Oswald';font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;padding:3px 9px;border-radius:6px;border:1px solid;cursor:default;white-space:nowrap}
.ptag-endboss{color:#e0b34a;border-color:rgba(224,179,74,.5);background:rgba(224,179,74,.12)}
.ptag-badluck{color:#8fb0e0;border-color:rgba(120,150,220,.45);background:rgba(120,150,220,.1)}
.ptag-grinder{color:#c9a27a;border-color:rgba(201,162,122,.45);background:rgba(201,162,122,.1)}
.ptag-podium{color:#6cc77e;border-color:rgba(108,199,126,.45);background:rgba(108,199,126,.1)}
.ptag-solking{color:#e0b34a;border-color:rgba(224,179,74,.45);background:rgba(224,179,74,.1)}
.ptag-brewer{color:#b78fe0;border-color:rgba(160,120,220,.45);background:rgba(160,120,220,.1)}
.ptag-onetrick{color:#e0955f;border-color:rgba(224,149,95,.45);background:rgba(224,149,95,.1)}
.ptag-slowpoke{color:#c98f8f;border-color:rgba(201,143,143,.45);background:rgba(201,143,143,.1)}
.ptag-speed{color:#5fd0c8;border-color:rgba(95,208,200,.45);background:rgba(95,208,200,.1)}
.ptag-streaker{color:#6cc77e;border-color:rgba(108,199,126,.5);background:rgba(108,199,126,.13)}
.ptag-rentner{color:#e8917a;border-color:rgba(232,145,122,.5);background:rgba(232,145,122,.13)}
.ptag-onfire{color:#ff8c42;border-color:rgba(255,140,66,.55);background:rgba(255,140,66,.14)}
.ptag-executioner{color:#e0554a;border-color:rgba(224,85,74,.5);background:rgba(224,85,74,.13)}
.ptag-deco{color:var(--ink3);border-color:var(--line2);background:rgba(255,255,255,.03)}
.ptag-bench{color:#a89a8a;border-color:rgba(168,154,138,.4);background:rgba(168,154,138,.08)}

/* ============ GAMES: recent list + controls ============ */
.rg-controls{background:linear-gradient(165deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px;margin-top:18px;box-shadow:var(--shadow)}
.rg-ctrl-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.rg-ctrl-lbl{font-family:'JetBrains Mono';font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);flex-shrink:0;min-width:76px}
.rg-pfilter{display:flex;flex-wrap:wrap;gap:7px}
.rg-pchip{display:inline-flex;align-items:center;gap:7px;font-family:'Oswald';font-weight:500;font-size:13px;text-transform:uppercase;letter-spacing:.02em;color:var(--ink3);background:var(--bg2);border:1px solid var(--line);padding:6px 12px;border-radius:20px;cursor:pointer;transition:.15s;opacity:.55}
.rg-pchip .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;opacity:.45}
.rg-pchip.on{color:var(--ink);border-color:var(--line2);opacity:1}
.rg-pchip.on .dot{opacity:1}
.rg-pchip:hover{border-color:var(--gold)}
.rg-pfilter-note{font-size:12px;color:var(--gold2);margin-top:10px;line-height:1.5}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:3px;flex-wrap:wrap}
.seg button{font-family:'Oswald';font-weight:500;text-transform:uppercase;font-size:13px;letter-spacing:.03em;color:var(--ink3);background:none;border:none;padding:7px 14px;border-radius:7px;cursor:pointer;transition:.15s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--gold);color:var(--gold-ink)}
.rg-win-custom{width:80px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-family:'Oswald';font-weight:500;font-size:14px;padding:8px 10px;text-align:center}
.rg-win-custom:focus{outline:none;border-color:var(--gold)}
.rg-win-custom.active{border-color:var(--gold)}
.rg-win-custom::-webkit-outer-spin-button,.rg-win-custom::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.rg-slider-row{margin-top:16px;gap:10px}
.rg-step{width:34px;height:34px;border-radius:9px;background:var(--bg2);border:1px solid var(--line);color:var(--ink2);cursor:pointer;font-size:13px;transition:.15s;flex-shrink:0}
.rg-step:hover:not(:disabled){border-color:var(--gold);color:var(--ink)}
.rg-step:disabled{opacity:.3;cursor:default}
#rgSlider,#rwSlider,#impactSlider{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:4px;background:var(--bg2);outline:none;border:1px solid var(--line);cursor:pointer}
#rgSlider::-webkit-slider-thumb,#rwSlider::-webkit-slider-thumb,#impactSlider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--gold);border:2px solid var(--gold-ink);cursor:grab}
#rgSlider::-moz-range-thumb,#rwSlider::-moz-range-thumb,#impactSlider::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--gold);border:2px solid var(--gold-ink);cursor:grab}
#rgSlider:disabled{opacity:.35}
.rg-focus{margin-top:12px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.rg-focus-main{font-family:'Oswald';font-weight:500;font-size:14px;color:var(--gold2);text-transform:uppercase;letter-spacing:.02em}
.rg-focus-dates{font-family:'JetBrains Mono';font-size:11.5px;color:var(--ink3)}
.h2h-dig-hint{font-size:13px;color:var(--ink3);margin:14px 0 16px;display:flex;align-items:center;gap:7px}
.h2h-dig-hint svg{width:14px;height:14px}
.rg-list{display:flex;flex-direction:column;gap:14px}
.rg-card{background:linear-gradient(165deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.rg-card-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);background:rgba(11,17,13,.3);flex-wrap:wrap}
.rg-card-head .left{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.rg-gnum{font-family:'Oswald';font-weight:700;font-size:15px;color:var(--gold2);letter-spacing:.02em}
.rg-date{font-family:'JetBrains Mono';font-size:12px;color:var(--ink2)}
.rg-time{display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono';font-size:12px;color:var(--ink2);background:var(--panel);border:1px solid var(--line);padding:5px 11px;border-radius:20px;white-space:nowrap}
.rg-time svg{width:13px;height:13px;stroke:var(--ink3)}
.rg-time.none{color:var(--ink3)}
.rg-time b{color:var(--ink);font-family:'Oswald';font-weight:600;font-size:14px}
.rg-seats{display:flex;flex-direction:column}
.rg-seat{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid rgba(37,57,46,.4)}
.rg-seat:last-child{border-bottom:none}
.rg-seat.win{background:linear-gradient(90deg,rgba(217,178,90,.10),transparent 70%)}
.rg-pos{flex-shrink:0;width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:'Oswald';font-weight:700;font-size:14px;background:var(--panel2);color:var(--ink3)}
.rg-pos.p1{background:var(--gold);color:var(--gold-ink)}
.rg-pos.p2{background:#5c6b58;color:var(--ink)}
.rg-who{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rg-pl{font-family:'Oswald';font-weight:600;font-size:16px;text-transform:uppercase;letter-spacing:.01em;color:var(--ink);cursor:pointer;align-self:flex-start;border-bottom:1px dotted transparent;transition:.14s;line-height:1.1}
.rg-pl:hover{color:var(--gold2);border-bottom-color:var(--gold2)}
.rg-cmd{font-size:13.5px;color:var(--ink2);cursor:pointer;align-self:flex-start;border-bottom:1px dotted transparent;transition:.14s;line-height:1.2}
.rg-cmd:hover{color:var(--gold2);border-bottom-color:var(--gold2)}
.rg-meta{flex-shrink:0;display:flex;align-items:center;gap:10px;font-family:'JetBrains Mono';font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.rg-meta .sol{color:var(--gold2);border:1px solid rgba(217,178,90,.4);border-radius:5px;padding:2px 6px}
.rg-meta .seat{white-space:nowrap}
.rg-fd-name{cursor:pointer;transition:color .14s}
.rg-fd-name:hover{color:var(--gold2)}

/* game length */
.gl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:22px}
.gl-stat{background:linear-gradient(165deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.gl-stat .big{font-family:'Oswald';font-weight:600;font-size:38px;line-height:1;color:var(--gold2)}
.gl-stat .lbl{font-size:11.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;margin-top:8px}
.gl-stat .note{font-size:12px;color:var(--ink2);margin-top:9px}
.histo{display:flex;align-items:flex-end;gap:8px;height:200px;padding:16px 0 0}
.act-heatmap-wrap{overflow-x:auto;background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.act-svg{display:block}
.act-svg rect{cursor:default}
.histo .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.histo .col .b{width:100%;max-width:54px;background:linear-gradient(180deg,var(--G),#2c6b3b);border-radius:6px 6px 0 0;min-height:3px;transition:height .4s}
.histo .col .ct{font-family:'Oswald';font-weight:600;font-size:15px}
.histo .col .rng{font-size:10.5px;color:var(--ink3);font-family:'JetBrains Mono';text-align:center;line-height:1.3}

/* commander pace */
.pace-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.pace-col-title{font-family:'Oswald';font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px;padding-bottom:9px;border-bottom:1px solid var(--line)}
.pace-col-title.fast{color:#6cc77e}
.pace-col-title.slow{color:#e87a68}
.pace-row{display:flex;align-items:center;gap:12px;padding:7px 0;cursor:pointer;border-radius:8px;transition:background .14s}
.pace-row:hover{background:rgba(217,178,90,.06)}
.pace-row .pcm{flex:1;font-size:13px;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pace-track{width:110px;height:8px;border-radius:5px;background:var(--bg2);position:relative;flex-shrink:0;overflow:hidden}
.pace-track .mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line2)}
.pace-track .fill{position:absolute;top:0;bottom:0}
.pace-track .fill.f{right:50%;background:linear-gradient(270deg,#6cc77e,#3f9b54);border-radius:5px 0 0 5px}
.pace-track .fill.s{left:50%;background:linear-gradient(90deg,#e8917a,#d6553f);border-radius:0 5px 5px 0}
.pace-delta{font-family:'Oswald';font-weight:600;font-size:14px;width:88px;text-align:right;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.pace-delta.f{color:#6cc77e}
.pace-delta.s{color:#e87a68}
.pace-delta small{font-family:'JetBrains Mono';font-weight:400;font-size:10px;color:var(--ink3)}
.pace-sub{font-family:'JetBrains Mono';font-size:10.5px;color:var(--ink3);margin-top:12px}

/* ============ PLAYERS: H2H + compare ============ */
.h2h-intro{background:linear-gradient(165deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px;margin-bottom:18px;color:var(--ink2);font-size:14px;display:flex;gap:14px;align-items:flex-start}
.h2h-intro .ico{flex-shrink:0;width:34px;height:34px;border-radius:9px;background:rgba(217,178,90,.14);display:flex;align-items:center;justify-content:center;color:var(--gold2);font-family:'Oswald';font-weight:700;font-size:17px}
.h2h-toggle{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:18px}
.h2h-toggle button{font-family:'Oswald';font-weight:500;text-transform:uppercase;font-size:13px;letter-spacing:.03em;color:var(--ink3);background:none;border:none;padding:8px 16px;border-radius:7px;cursor:pointer;transition:.15s}
.h2h-toggle button.on{background:var(--gold);color:var(--gold-ink)}
.rec-explain{background:rgba(217,178,90,.07);border:1px solid rgba(217,178,90,.22);border-radius:10px;padding:12px 16px;margin-bottom:18px;font-size:13px;color:var(--ink2);display:flex;gap:11px;align-items:flex-start}
.rec-explain .ic{flex-shrink:0;width:20px;height:20px;border-radius:50%;background:rgba(217,178,90,.18);color:var(--gold2);display:flex;align-items:center;justify-content:center;font-family:'Oswald';font-weight:700;font-size:13px;margin-top:1px}
.rec-explain b{color:var(--gold2);font-weight:600}
.rec-explain .txt{line-height:1.55}
.h2h-mode{display:none}.h2h-mode.on{display:block}
.h2h-playerpick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.h2h-playerpick button{font-family:'Oswald';font-weight:500;font-size:15px;text-transform:uppercase;letter-spacing:.02em;color:var(--ink2);background:var(--panel);border:1px solid var(--line);padding:9px 18px;border-radius:10px;cursor:pointer;transition:.15s}
.h2h-playerpick button:hover{border-color:var(--line2);color:var(--ink)}
.h2h-playerpick button.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.h2h-pick-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.h2h-pick-row .h2h-playerpick{margin-bottom:0}
.h2h-profile-link{font-family:'Oswald';font-weight:500;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--gold2);display:inline-flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap;transition:.15s}
.h2h-profile-link:hover{color:var(--gold)}
.h2h-profile-link svg{width:13px;height:13px;flex-shrink:0}

/* ============ PLAYER CARDS (compare) ============ */
.pcard-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:16px;margin-bottom:8px}
.pcard{cursor:pointer}
.pcard.themed>*{position:relative;z-index:1}
.pcard.themed>.pod-accent{z-index:2}
.pcard.themed>.pod-tint{z-index:0}
.pcard .cname{cursor:pointer}
.pcard .row .v.wr{font-family:'Oswald';font-weight:600}
.rival-hero{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:22px}
.rival-stat{background:linear-gradient(165deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--radius);padding:17px}
.rival-stat .lbl{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:9px}
.rival-stat .who{font-family:'Oswald';font-weight:600;font-size:22px;text-transform:uppercase;line-height:1}
.rival-stat .det{font-size:12.5px;color:var(--ink2);margin-top:7px}
.rival-stat.best{border-color:rgba(74,169,99,.4)}
.rival-stat.worst{border-color:rgba(217,90,68,.4)}
.matchup-list{display:flex;flex-direction:column;gap:12px}
.matchup{background:linear-gradient(165deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;align-items:stretch;cursor:pointer;transition:transform .15s,border-color .15s}
.matchup:hover{transform:translateY(-2px);border-color:var(--line2)}
.matchup .leftbar{width:6px;flex-shrink:0}
.matchup .body{flex:1;padding:15px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.matchup .vs-line{display:flex;align-items:center;gap:12px;min-width:190px}
.matchup .opp{font-family:'Oswald';font-weight:600;font-size:19px;text-transform:uppercase;letter-spacing:.01em}
.matchup .verdict{font-size:13px;color:var(--ink2);flex:1;min-width:180px}
.matchup .verdict b{color:var(--ink)}
.matchup .nums{display:flex;align-items:center;gap:18px;flex-shrink:0}
.matchup .recbox{text-align:right}
.matchup .recbox .rec{font-family:'Oswald';font-weight:600;font-size:20px;line-height:1}
.matchup .recbox .reclbl{font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.matchup .ringwrap{position:relative;flex-shrink:0}
.matchup .ringwrap svg{transform:rotate(-90deg)}
.matchup .ringwrap .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Oswald';font-weight:600;font-size:15px}
.matchup .chev{flex-shrink:0;color:var(--ink3);font-size:20px;display:flex;align-items:center;padding-left:4px}
.matchup:hover .chev{color:var(--gold2)}
.winbadge{display:inline-block;font-family:'JetBrains Mono';font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:20px}
.winbadge.w{background:rgba(74,169,99,.18);color:#6cc77e}
.winbadge.l{background:rgba(217,90,68,.18);color:#e87a68}
.winbadge.e{background:rgba(217,178,90,.18);color:var(--gold2)}
.h2h-scroll{overflow-x:auto;padding-bottom:6px}
.h2h{border-collapse:separate;border-spacing:4px;margin:0 auto}
.h2h th{padding:8px;text-align:center;border:none;cursor:default}
.h2h .rowhead{font-family:'Oswald';font-weight:600;font-size:14px;text-transform:uppercase;color:var(--ink2);text-align:right;padding-right:12px;white-space:nowrap}
.h2h .colhead{font-family:'Oswald';font-weight:600;font-size:14px;text-transform:uppercase;color:var(--ink2);text-align:center;min-width:82px}
.cell{width:82px;height:62px;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;border:1px solid var(--line);cursor:default}
.cell.self{background:repeating-linear-gradient(45deg,var(--bg2),var(--bg2) 6px,var(--panel) 6px,var(--panel) 12px)}
.cell .pct{font-family:'Oswald';font-weight:600;font-size:19px;line-height:1}
.cell .rec{font-size:10px;color:var(--ink3);font-family:'JetBrains Mono';margin-top:3px}
.cell .nogame{font-size:11px;color:var(--ink3)}
.h2h-corner{font-family:'JetBrains Mono';font-size:10px;color:var(--ink3);text-align:right;padding-right:12px;line-height:1.4;text-transform:none;letter-spacing:0}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px;font-size:12px;color:var(--ink3);align-items:center}
.legend .sw{display:inline-block;width:30px;height:12px;border-radius:3px;vertical-align:middle;margin-right:7px}
.net-leg-note{margin-left:auto}

/* rivalry network graph */
.net-wrap{width:100%;overflow:hidden;border-radius:12px;background:var(--bg2)}
.net-svg{width:100%;height:auto;display:block}
.net-node{cursor:grab;touch-action:none}
.net-node:active{cursor:grabbing}
.net-node circle{transition:filter .15s}
.net-node:hover circle{filter:brightness(1.18)}
.net-label{font-family:'Oswald';font-weight:600;font-size:13px;fill:var(--ink);text-transform:uppercase;letter-spacing:.02em;pointer-events:none;paint-order:stroke;stroke:var(--bg2);stroke-width:4px;stroke-linejoin:round}
.net-edge{cursor:pointer}
.net-edge-hit{pointer-events:stroke}

/* compare */
.cmp-controls{margin-bottom:16px}
.cmp-seg{flex-wrap:wrap}
.cmp-note{font-size:13px;color:var(--ink2);margin-bottom:14px;line-height:1.55}
.cmp-table-wrap{overflow-x:auto;background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.cmp-table th{text-align:center;cursor:default}
.cmp-table th.cmp-pl-h,.cmp-table th.cmt-tag-h{text-align:left}
.cmp-table td{text-align:center;white-space:nowrap}
.cmp-table td.cmp-pl,.cmp-table td.cmt-tag{text-align:left}
.cmp-all{background:rgba(217,178,90,.05)}
.cmp-pl{font-family:'Oswald';font-weight:500;font-size:15px;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.cmp-pl:hover{color:var(--gold2)}
.cmp-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:9px;vertical-align:middle}
.cmp-v{font-family:'Oswald';font-weight:600;font-size:15px}
.cmp-best{text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:4px;text-decoration-thickness:2px}
.cmp-empty{color:var(--ink3)}
.cmp-cmd{display:block;font-size:12.5px;color:var(--ink);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0 auto}
.cmp-sub{display:block;font-family:'JetBrains Mono';font-size:10px;color:var(--ink3);margin-top:2px}
.cmt-pl{cursor:pointer;font-family:'Oswald';font-weight:500;font-size:14px;text-transform:uppercase;white-space:nowrap}
.cmt-pl:hover{color:var(--gold2)}

/* ============ COMMANDERS ============ */
.cmd-controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.search{flex:1;min-width:180px;max-width:280px}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--ink);font-family:'Inter';font-size:14px}
.search input::placeholder{color:var(--ink3)}
.search input:focus{outline:none;border-color:var(--gold)}
.cmd-custom-wrap{display:inline-flex;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:3px 3px 3px 0;gap:4px}
.cmd-custom-wrap.active{border-color:var(--gold)}
.cmd-custom-wrap input{width:84px;background:none;border:none;color:var(--ink);font-family:'Oswald';font-weight:500;font-size:14px;padding:7px 10px;text-align:center}
.cmd-custom-wrap input:focus{outline:none}
.cmd-custom-wrap input::placeholder{color:var(--ink3);font-size:12px;font-family:'Inter'}
.cmd-custom-wrap input::-webkit-outer-spin-button,.cmd-custom-wrap input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.cmd-custom-wrap .lbl{font-family:'Oswald';font-weight:500;text-transform:uppercase;font-size:12px;letter-spacing:.03em;color:var(--ink3);padding-left:12px}
.cmd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:16px}
.cmd{background:linear-gradient(165deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--radius);padding:18px;position:relative;overflow:hidden;transition:transform .18s,border-color .18s}
.cmd .topline{height:3px;position:absolute;top:0;left:0;right:0;background:linear-gradient(90deg,var(--G),var(--gold))}
.cname-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.cmd .cname{font-family:'Oswald';font-weight:600;font-size:17px;line-height:1.15;text-transform:uppercase;letter-spacing:.01em;min-height:38px;display:flex;align-items:flex-end}
.cmd .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.cmd .row .k{font-size:11.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}
.cmd .row .v{font-family:'Oswald';font-weight:600;font-size:17px}
.cmd .wrbar{height:8px;border-radius:5px;background:var(--bg);overflow:hidden;margin:4px 0 14px}
.cmd .wrbar>i{display:block;height:100%;border-radius:5px}
.cmd .pilots{border-top:1px solid var(--line);padding-top:11px;display:flex;flex-wrap:wrap;gap:6px}
.cmd .pilot{font-size:11px;font-family:'JetBrains Mono';background:var(--bg);border:1px solid var(--line);padding:3px 8px;border-radius:6px;color:var(--ink2)}
.cmd .pilot b{color:var(--gold2)}
.cmd-clickable{cursor:pointer}
.cmd-clickable:hover{transform:translateY(-3px);border-color:var(--line2)}
.pips{display:inline-flex;gap:3px;align-items:center;flex-shrink:0;margin-top:3px}
.pip{display:inline-block;border-radius:50%}

/* color stats */
.colorstats-wrap{margin-top:40px}
.cs-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cs-panel{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.cs-panel h3{font-family:'Oswald';font-weight:600;font-size:16px;text-transform:uppercase;letter-spacing:.02em}
.cs-sub{font-size:12.5px;color:var(--ink3);margin:3px 0 16px}
.cs-row{display:flex;align-items:center;gap:11px;padding:7px 0}
.cs-swatch{width:15px;height:15px;border-radius:50%;flex-shrink:0}
.cs-label{width:78px;flex-shrink:0;font-family:'Oswald';font-weight:500;font-size:14px;text-transform:uppercase}
.cs-bartrack{flex:1;height:9px;border-radius:5px;background:var(--bg);overflow:hidden}
.cs-barfill{display:block;height:100%;border-radius:5px}
.cs-val{font-family:'JetBrains Mono';font-size:11.5px;color:var(--ink3);white-space:nowrap;flex-shrink:0}
.cs-val b{color:var(--ink);font-family:'Oswald';font-size:14px}
.cs-note{font-size:12px;color:var(--ink3);margin-top:14px;line-height:1.5}
.cs-empty{color:var(--ink3);padding:10px 0}
.cs-wr{font-family:'Oswald';font-weight:600;font-size:13px}
.cmp-tags-table th.cmt-tag-h{position:sticky;left:0;background:var(--panel2);z-index:2}
.cmp-tags-table td.cmt-tag{position:sticky;left:0;background:var(--panel);z-index:1}

/* ============ INSIGHTS ============ */
.trend-legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:18px;justify-content:center}
.tl-item{display:inline-flex;align-items:center;gap:7px;font-family:'Oswald';font-weight:500;font-size:14px;text-transform:uppercase;letter-spacing:.02em;color:var(--ink2)}
.tl-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.tl-pct{font-family:'JetBrains Mono';font-size:12px;color:var(--ink3);font-weight:400}
.meta-leg-click{cursor:pointer}
.meta-leg-click:hover{color:var(--ink)}
.finish-chart{display:flex;flex-direction:column;gap:12px}
.fd-row{display:flex;align-items:center;gap:14px}
.fd-name{font-family:'Oswald';font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.02em;width:80px;flex-shrink:0;text-align:right}
.fd-bar{flex:1;display:flex;height:32px;border-radius:8px;overflow:hidden;background:var(--bg)}
.fd-seg{display:flex;align-items:center;justify-content:center;font-family:'Oswald';font-weight:600;font-size:12px;color:#0d1410;min-width:0;transition:width .5s ease;overflow:hidden;white-space:nowrap}
.fd-tot{font-family:'JetBrains Mono';font-size:12px;color:var(--ink3);width:36px;flex-shrink:0}
.fd-legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;padding-top:14px;border-top:1px solid var(--line);justify-content:center}
.fd-leg-item{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2)}
.fd-leg-sw{width:16px;height:12px;border-radius:3px}
.fc-table{width:100%;border-collapse:collapse}
.fc-th{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);text-align:right;padding:11px 14px;border-bottom:1px solid var(--line);font-weight:600;cursor:pointer;user-select:none;white-space:nowrap}
.fc-th:hover{color:var(--gold)}
.fc-th.fc-l{text-align:left}
.fc-table td{padding:12px 14px;text-align:right;border-bottom:1px solid rgba(37,57,46,.5);font-variant-numeric:tabular-nums;font-size:14px}
.fc-table tbody tr:last-child td{border-bottom:none}
.fc-name{text-align:left!important;font-family:'Oswald';font-weight:500;font-size:15px;text-transform:uppercase;letter-spacing:.02em}
.fc-podium{font-family:'Oswald';font-weight:600;color:var(--gold2)}
.fc-foot{padding:12px 14px 2px;font-size:12px;color:var(--ink3)}
.vbar-chart{display:flex;align-items:flex-end;justify-content:center;gap:26px;padding:10px 0}
.vbar-col{display:flex;flex-direction:column;align-items:center;flex:0 1 120px;max-width:120px}
.vbar-val{font-family:'Oswald';font-weight:600;font-size:18px;color:var(--ink);margin-bottom:6px}
.vbar-track{width:100%;height:170px;display:flex;align-items:flex-end}
.vbar{width:100%;border-radius:8px 8px 0 0;min-height:4px;transition:height .5s ease}
.vbar-lbl{font-family:'Oswald';font-weight:500;font-size:14px;line-height:1.25;text-transform:uppercase;letter-spacing:.03em;margin-top:12px;color:var(--ink2);min-height:2.5em}
.vbar-sub{font-family:'JetBrains Mono';font-size:11px;color:var(--ink3);margin-top:3px}
.sol-compare{display:flex;align-items:center;justify-content:center;gap:30px;padding:14px 0;flex-wrap:wrap}
.sol-side{display:flex;flex-direction:column;align-items:center;gap:10px}
.sol-ring-big{width:130px;height:130px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;background:conic-gradient(var(--gold) calc(var(--pct)*1%), var(--bg) 0)}
.sol-ring-big::before{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--panel)}
.sol-num{position:relative;font-family:'Oswald';font-weight:700;font-size:30px}
.sol-lbl{font-family:'Oswald';font-weight:500;font-size:15px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink2)}
.sol-sub{font-family:'JetBrains Mono';font-size:11px;color:var(--ink3)}
.sol-vs{display:flex;flex-direction:column;align-items:center;gap:8px}
.sol-arrow{font-size:24px;color:var(--ink3)}
.sol-delta{font-family:'Oswald';font-weight:700;font-size:26px;padding:4px 14px;border-radius:10px}
.sol-delta.pos{color:#6cc77e;background:rgba(74,169,99,.14)}
.sol-delta.neg{color:#e87a68;background:rgba(217,90,68,.14)}
.strk-list{display:flex;flex-direction:column;padding:10px 16px}
.strk-row{display:flex;align-items:center;gap:18px;padding:13px 4px;border-bottom:1px solid rgba(37,57,46,.45);flex-wrap:wrap}
.strk-row:last-child{border-bottom:none}
.strk-name{font-family:'Oswald';font-weight:600;font-size:16px;text-transform:uppercase;width:110px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;gap:9px}
.strk-name:hover{color:var(--gold2)}
.strk-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.strk-bars{flex:1;min-width:240px;display:flex;flex-direction:column;gap:7px}
.strk-metric{display:flex;align-items:center;gap:10px}
.strk-metric-l{font-family:'JetBrains Mono';font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);width:118px;flex-shrink:0;text-align:right}
.strk-track{flex:1;height:16px;border-radius:5px;background:var(--bg);overflow:hidden}
.strk-fill{height:100%;border-radius:5px;display:flex;align-items:center;justify-content:flex-end;padding-right:7px;font-family:'Oswald';font-weight:600;font-size:11px;color:#0d1410;min-width:20px}
.strk-fill.win{background:linear-gradient(90deg,#3f9b54,#6cc77e)}
.strk-fill.dry{background:linear-gradient(90deg,#8a4a3c,#d6553f);color:#fff}
.strk-cur-wrap{width:150px;flex-shrink:0;text-align:right}
.strk-cur{font-family:'JetBrains Mono';font-size:10.5px;padding:4px 9px;border-radius:14px;white-space:nowrap}
.strk-cur.win{color:#6cc77e;background:rgba(74,169,99,.13);border:1px solid rgba(74,169,99,.35)}
.strk-cur.dry{color:#e8917a;background:rgba(217,90,68,.11);border:1px solid rgba(217,90,68,.32)}
.div-row{display:flex;align-items:center;gap:16px;padding:12px 4px;border-bottom:1px solid rgba(37,57,46,.45);flex-wrap:wrap}
.div-row:last-child{border-bottom:none}
.div-track{flex:1;min-width:160px;height:10px;border-radius:5px;background:var(--bg);overflow:hidden}
.div-fill{height:100%;border-radius:5px}
.div-stats{font-size:12.5px;color:var(--ink2);white-space:nowrap;display:flex;gap:8px;align-items:center}
.div-stats b{color:var(--ink);font-family:'Oswald'}
.div-sep{color:var(--ink3)}
.div-tag{font-family:'Oswald';font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:6px;margin-left:8px}
.div-tag.brewer{color:#b78fe0;background:rgba(160,120,220,.12);border:1px solid rgba(160,120,220,.4)}
.div-tag.trick{color:#e0955f;background:rgba(224,149,95,.12);border:1px solid rgba(224,149,95,.4)}
.parity-note{margin-top:14px;font-size:13.5px;color:var(--ink2);text-align:center}
.parity-note b{color:var(--gold2)}

/* ============ DETAIL PAGES (player / commander / matchup) ============ */
.md-back{display:inline-flex;align-items:center;gap:8px;font-family:'Oswald';font-weight:500;text-transform:uppercase;font-size:13.5px;letter-spacing:.03em;color:var(--ink2);background:var(--panel);border:1px solid var(--line);padding:9px 16px;border-radius:9px;cursor:pointer;margin-bottom:20px;transition:.15s}
.md-back:hover{color:var(--ink);border-color:var(--line2)}
.md-back svg{width:15px;height:15px}
.cd-header{position:relative;background:linear-gradient(165deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--radius);padding:24px;overflow:hidden;margin-bottom:18px;box-shadow:var(--shadow)}
.cd-topline{position:absolute;top:0;left:0;right:0;height:4px;z-index:2}
.cd-tint{position:absolute;inset:0;z-index:0;pointer-events:none}
.cd-header.themed{border-color:var(--line2)}
.cd-header.themed .cd-title-row,.cd-header.themed .cd-stats,.cd-header.themed .cd-pilotline,.cd-header.themed .ptags{position:relative;z-index:1}
.cd-title-row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.cd-name{font-family:'Oswald';font-weight:600;font-size:29px;text-transform:uppercase;letter-spacing:.01em;line-height:1.05}
.cd-extra{font-size:13px;color:var(--ink3)}
.cd-extra b{color:var(--gold2);font-weight:600}
.cd-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.cd-stat{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:15px;text-align:center}
.cd-stat-v{font-family:'Oswald';font-weight:600;font-size:28px;line-height:1;color:var(--ink)}
.cd-stat-l{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;margin-top:7px}
.cd-pilotline{font-size:13px;color:var(--ink3);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cd-pilot-chip{font-family:'JetBrains Mono';font-size:11px;background:var(--bg);border:1px solid var(--line);padding:3px 9px;border-radius:6px;color:var(--ink2)}
.cd-pilot-chip b{color:var(--gold2)}
.cd-grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.cd-card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.cd-card-hd{font-family:'Oswald';font-weight:600;font-size:17px;text-transform:uppercase;letter-spacing:.02em}
.cd-card-sub{font-size:12.5px;color:var(--ink3);margin-top:2px;margin-bottom:16px}
.cd-vp-list{display:flex;flex-direction:column;gap:11px}
.cd-vp-row{display:flex;align-items:center;gap:12px}
.cd-vp-name{font-family:'Oswald';font-weight:500;font-size:15px;text-transform:uppercase;width:74px;flex-shrink:0}
.cd-vp-track{flex:1;height:9px;border-radius:5px;background:var(--bg);overflow:hidden}
.cd-vp-fill{height:100%;border-radius:5px;transition:width .5s ease}
.cd-vp-pct{font-family:'Oswald';font-weight:600;font-size:15px;width:42px;text-align:right}
.cd-vp-rec{font-family:'JetBrains Mono';font-size:11px;color:var(--ink3);width:54px;text-align:right}
.cd-side{display:flex;flex-direction:column;gap:14px}
.cd-mini{background:linear-gradient(165deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:15px 17px}
.cd-mini.best{border-color:rgba(74,169,99,.4)}
.cd-mini.worst{border-color:rgba(217,90,68,.4)}
.cd-mini-l{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.09em;margin-bottom:7px}
.cd-mini-who{font-family:'Oswald';font-weight:600;font-size:21px;text-transform:uppercase;line-height:1}
.cd-mini-d{font-size:12.5px;color:var(--ink2);margin-top:6px}
.cd-finish-card{padding:18px}
.cd-pilot-list{display:flex;flex-direction:column;gap:10px}
.cd-pilot-row{display:flex;align-items:center;gap:12px}
.cd-pilot-name{font-family:'Oswald';font-weight:500;font-size:15px;text-transform:uppercase;width:84px;flex-shrink:0}
.cd-pilot-games{font-family:'JetBrains Mono';font-size:11px;color:var(--ink3);width:70px;flex-shrink:0}
.cd-pilot-track{flex:1;height:9px;border-radius:5px;background:var(--bg);overflow:hidden}
.cd-pilot-fill{height:100%;border-radius:5px;transition:width .5s ease}
.cd-pilot-wr{font-family:'Oswald';font-weight:600;font-size:15px;width:46px;text-align:right}
.cd-dm-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.cd-dm-hd{font-family:'Oswald';font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.cd-dm-hd.up{color:#6cc77e}
.cd-dm-hd.down{color:#e87a68}
.cd-dm-row{display:flex;align-items:center;gap:10px;padding:8px 0}
.cd-dm-name{flex:1;font-size:13px;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd-dm-pct{font-family:'Oswald';font-weight:600;font-size:14px;width:40px;text-align:right;flex-shrink:0}
.cd-dm-rec{font-family:'JetBrains Mono';font-size:11px;color:var(--ink3);width:48px;text-align:right;flex-shrink:0}
.cd-dm-g{font-family:'JetBrains Mono';font-size:10px;color:var(--ink3);width:30px;text-align:right;flex-shrink:0}
.cd-dm-empty{color:var(--ink3);padding:8px 0}

/* player detail extras */
.pp-yoy-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:16px}
.yoy-chart{display:flex;align-items:flex-end;justify-content:space-around;gap:18px;padding:6px 0}
.yoy-bar-col{display:flex;flex-direction:column;align-items:center;flex:1;max-width:120px}
.yoy-bar-val{font-family:'Oswald';font-weight:600;font-size:17px;color:var(--ink);margin-bottom:6px}
.yoy-bar-track{width:100%;height:150px;display:flex;align-items:flex-end}
.yoy-bar{width:100%;border-radius:8px 8px 0 0;min-height:4px;transition:height .5s ease}
.yoy-bar-yr{font-family:'Oswald';font-weight:600;font-size:16px;margin-top:11px;color:var(--ink)}
.yoy-bar-sub{font-family:'JetBrains Mono';font-size:11px;color:var(--ink3);margin-top:3px}
.yoy-table{width:100%;border-collapse:collapse}
.yoy-table th{font-size:10px;padding:12px 14px}
.yoy-table th.fc-l{text-align:left}
.yoy-yr{text-align:left!important;font-family:'Oswald';font-weight:600;font-size:16px;color:var(--gold2)}
.pp-two-col{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start}
.pp-rival-row{cursor:pointer;border-radius:8px;padding:4px 6px;margin:0 -6px;transition:background .15s}
.pp-rival-row:hover{background:rgba(217,178,90,.07)}
.pp-rival-row:hover .chev{color:var(--gold2)!important}
.ppsol-foot{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:4px}
.ppsol-swing{font-family:'Oswald';font-weight:700;font-size:20px;padding:4px 14px;border-radius:10px}
.ppsol-swing.up{color:#6cc77e;background:rgba(74,169,99,.14)}
.ppsol-swing.down{color:#e87a68;background:rgba(217,90,68,.14)}
.ppsol-rate{font-size:13px;color:var(--ink2)}
.pcolor-callouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.pcolor-callout{background:linear-gradient(165deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.pcolor-callout-l{font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;font-family:'JetBrains Mono'}
.pcolor-callout-main{display:flex;align-items:center;gap:9px}
.pcolor-callout-name{font-family:'Oswald';font-weight:600;font-size:18px;text-transform:uppercase}
.pcolor-callout-d{font-size:12px;color:var(--ink2);margin-top:6px}
.pcolor-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pcv-row{display:flex;align-items:center;gap:10px;padding:6px 0}
.pcv-label{width:72px;flex-shrink:0;font-family:'Oswald';font-weight:500;font-size:13.5px;text-transform:uppercase}
.pcv-key{width:56px;flex-shrink:0;font-family:'JetBrains Mono';font-size:12px;color:var(--ink2)}
.pcv-track{flex:1;height:8px;border-radius:5px;background:var(--bg);overflow:hidden}
.pcv-fill{display:block;height:100%;border-radius:5px}
.pcv-pct{font-family:'Oswald';font-weight:600;font-size:13.5px;width:46px;text-align:right;flex-shrink:0}
.pcv-wr{display:flex;flex-direction:column;align-items:flex-end;width:52px;flex-shrink:0;line-height:1.2}
.pcv-g{font-family:'JetBrains Mono';font-size:9.5px;color:var(--ink3)}
.pcv-more{font-size:12px;color:var(--ink3);padding:8px 0 0}
.cw-stack{height:26px;border-radius:8px;margin:6px 0 12px}
.cw-legend{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.cw-leg{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2)}
.cw-dot{width:11px;height:11px;border-radius:50%}
.cw-leg-l{font-family:'Oswald';font-weight:500;text-transform:uppercase;font-size:12.5px}
.cw-leg-v{font-family:'JetBrains Mono';font-size:11px;color:var(--ink3)}
.cw-combos-hd{font-family:'Oswald';font-weight:600;font-size:14.5px;text-transform:uppercase;letter-spacing:.02em;border-top:1px solid var(--line);padding-top:14px;margin-bottom:6px}
.cw-combos-sub{font-family:'Inter';font-weight:400;font-size:11.5px;color:var(--ink3);text-transform:none;letter-spacing:0;margin-left:6px}

/* matchup detail */
.md-hero{display:flex;align-items:stretch;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.md-player{flex:1;min-width:200px;background:linear-gradient(165deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--radius);padding:22px;text-align:center;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.md-player.winner{border-color:var(--gold)}
.md-player .topband{position:absolute;top:0;left:0;right:0;height:4px}
.md-player .pn{font-family:'Oswald';font-weight:600;font-size:29px;text-transform:uppercase;line-height:1;margin-bottom:14px}
.md-player .bigpct{font-family:'Oswald';font-weight:700;font-size:52px;line-height:1}
.md-player .bigpct .u{font-size:24px;color:var(--ink3)}
.md-player .sublabel{font-size:11.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.1em;margin-top:8px}
.md-player .winrec{font-family:'Oswald';font-weight:600;font-size:18px;margin-top:10px;color:var(--ink2)}
.md-center{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 6px;min-width:90px}
.md-center .vs{font-family:'Oswald';font-weight:700;font-size:26px;color:var(--gold2);letter-spacing:.05em}
.md-center .gcount{font-size:11.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;text-align:center;margin-top:6px}
.md-center .ties{font-size:12px;color:var(--ink3);margin-top:4px}
.md-summary-line{background:linear-gradient(165deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:15px 20px;color:var(--ink2);font-size:14.5px;margin-bottom:22px}
.md-summary-line b{color:var(--ink)}
.md-decks-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px}
.md-deck-col{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.md-deck-col .colhd{font-family:'Oswald';font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.02em;padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.md-deck-col .colhd .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.md-deck-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;border-bottom:1px solid rgba(37,57,46,.5)}
.md-deck-row:last-child{border-bottom:none}
.md-deck-row .dname{font-size:14px;color:var(--ink);font-weight:500;flex:1}
.md-deck-row .dstat{display:flex;align-items:center;gap:14px;flex-shrink:0}
.md-deck-row .drec{font-family:'JetBrains Mono';font-size:12px;color:var(--ink3);white-space:nowrap}
.md-deck-row .dpct{font-family:'Oswald';font-weight:600;font-size:16px;min-width:46px;text-align:right}
.md-deck-row .dbar{width:60px;height:6px;border-radius:4px;background:var(--bg);overflow:hidden}
.md-deck-row .dbar>i{display:block;height:100%;border-radius:4px}
.md-pairs{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.md-pairs .ph{padding:18px 20px 10px}
.md-pairs .ph .t{font-family:'Oswald';font-weight:600;font-size:18px;text-transform:uppercase}
.md-pairs .ph .s{font-size:13px;color:var(--ink3);margin-top:2px}
.md-pair-row{display:flex;align-items:center;gap:14px;padding:13px 20px;border-top:1px solid rgba(37,57,46,.5)}
.md-pair-row .matchup-cmds{flex:1;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
.md-pair-row .ca{color:var(--ink);font-weight:500}
.md-pair-row .cb{color:var(--ink2)}
.md-pair-row .vsmini{font-family:'JetBrains Mono';font-size:11px;color:var(--ink3);text-transform:uppercase;padding:2px 7px;background:var(--bg);border-radius:5px}
.md-pair-row .presult{font-family:'Oswald';font-weight:600;font-size:15px;white-space:nowrap}
.md-pair-row .pgames{font-family:'JetBrains Mono';font-size:11px;color:var(--ink3);white-space:nowrap}

/* recent form / streak / extra stats on Matchup Detail */
.md-form{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:22px}
.md-form .ph{padding:0 0 14px}
.md-form-strip{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.md-chip{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:'Oswald';font-weight:700;font-size:12px;letter-spacing:.02em;border:1px solid;cursor:default;flex-shrink:0}
.md-chip.res-a{background:rgba(74,169,99,.14);border-color:var(--win);color:var(--win)}
.md-chip.res-b{background:rgba(217,90,68,.14);border-color:var(--lose);color:var(--lose)}
.md-chip.res-tie{background:rgba(217,178,90,.14);border-color:var(--gold);color:var(--gold)}
.md-streak-line{font-size:14px;color:var(--ink2)}
.md-streak-line b{color:var(--gold2)}
.md-streak-best{font-size:12.5px;color:var(--ink3);margin-top:6px}
.md-extra{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px}
.md-extra-card{background:linear-gradient(165deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.md-extra-card .mek{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;display:block}
.md-extra-card .mev,.pe-row .mev{display:flex;align-items:stretch;justify-content:space-between;gap:10px}
.md-extra-card .mev-half,.pe-row .mev-half{flex:1;text-align:center}
.md-extra-card .mev-half .who,.pe-row .mev-half .who{font-family:'Oswald';font-weight:600;font-size:12.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.md-extra-card .mev-half .num,.pe-row .mev-half .num{font-family:'Oswald';font-weight:700;font-size:23px;margin-top:4px}
.md-extra-card .mev-div,.pe-row .mev-div{width:1px;background:var(--line);align-self:stretch}
@media(max-width:640px){.md-extra{grid-template-columns:1fr}}

/* The Presence Effect */
.pe-list{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.pe-row{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.pe-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.pe-name{font-family:'Oswald';font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.02em}
.pe-delta{font-family:'Oswald';font-weight:700;font-size:12.5px;padding:3px 10px;border-radius:6px;white-space:nowrap}
.pe-delta.up{color:var(--win);background:rgba(74,169,99,.12)}
.pe-delta.down{color:var(--lose);background:rgba(217,90,68,.12)}
.pe-n{font-size:10.5px;color:var(--ink3);margin-top:2px}
.pe-footnote{font-size:12px;color:var(--ink3);margin-top:14px;line-height:1.5}
.impact-slider-val{font-family:'Oswald';font-weight:600;font-size:14px;min-width:72px;text-align:right;flex-shrink:0}
.pe-delta-cell{font-family:'Oswald';font-weight:700}

/* Recent Impact: highlights feed — one line per notable event, not a per-player table */
.impact-feed{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.impact-event{display:flex;align-items:center;gap:12px;padding:11px 15px;background:var(--bg2);border-left:3px solid var(--gold);border-radius:8px;font-size:13.5px;color:var(--ink2);line-height:1.5}
.impact-event b{color:var(--ink)}
.impact-event-tag{flex-shrink:0;font-family:'JetBrains Mono';font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);background:var(--panel2);padding:4px 8px;border-radius:5px;white-space:nowrap}
.impact-event-date{flex-shrink:0;margin-left:auto;font-size:11.5px;color:var(--ink3);white-space:nowrap}
.impact-event.rank{border-left-color:var(--gold)}
.impact-event.streak-up{border-left-color:var(--win)}
.impact-event.streak-down{border-left-color:var(--lose)}
.impact-event.rivalry{border-left-color:#b78fe0}
.impact-event.commander{border-left-color:#5fd0c8}
.impact-event.commander-first-win{border-left-color:var(--win)}
.impact-event.commander-first-loss{border-left-color:var(--lose)}
.impact-event.sweep{border-left-color:#ff8c42}
.impact-event.comeback{border-left-color:#4fb8e8}
.impact-event.pace{border-left-color:#e0568f}
.impact-event.tag-trade{border-left-color:#6c7ae0}
.impact-event.matchup{border-left-color:#c4d15c}
.impact-event.recap{border-left-color:#5f7268}
@media(max-width:520px){.impact-event{flex-direction:column;align-items:flex-start;gap:6px}.impact-event-date{margin-left:0}}

/* ============ SEARCH OVERLAY ============ */
.search-overlay{position:fixed;inset:0;z-index:300;background:rgba(6,10,8,.72);backdrop-filter:blur(6px);display:none;align-items:flex-start;justify-content:center;padding:12vh 20px 20px}
.search-overlay.on{display:flex;animation:fade .16s ease}
.so-box{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--line2);border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.6);overflow:hidden}
.so-input-row{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.so-input-row svg{width:18px;height:18px;stroke:var(--ink3);flex-shrink:0}
#searchInput{flex:1;background:none;border:none;color:var(--ink);font-family:'Inter';font-size:16px;outline:none}
#searchInput::placeholder{color:var(--ink3)}
.so-kbd{font-family:'JetBrains Mono';font-size:10px;color:var(--ink3);border:1px solid var(--line);border-radius:5px;padding:2px 6px;flex-shrink:0}
.so-results{max-height:52vh;overflow-y:auto;padding:8px}
.so-group{font-family:'JetBrains Mono';font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);padding:10px 12px 6px}
.so-item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:none;color:var(--ink);padding:10px 12px;border-radius:10px;cursor:pointer;font-family:'Inter';font-size:14.5px;transition:background .12s}
.so-item:hover,.so-item.sel{background:rgba(217,178,90,.10)}
.so-item .so-ic{width:26px;height:26px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:'Oswald';font-weight:600;font-size:12px;color:var(--gold2);flex-shrink:0}
.so-item .so-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.so-item .so-sub{font-family:'JetBrains Mono';font-size:10.5px;color:var(--ink3);flex-shrink:0}
.so-empty{padding:22px;text-align:center;color:var(--ink3);font-size:14px}
.so-tip{padding:10px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--ink3);font-family:'JetBrains Mono'}

/* ============ BOTTOM NAV (mobile) ============ */
.bottomnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:95;background:rgba(10,15,12,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.bottomnav-inner{display:flex}
.bnav{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:10px;color:var(--ink3);font-family:'Oswald';font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.04em;transition:.15s}
.bnav svg{width:19px;height:19px}
.bnav.active{color:var(--gold2)}

/* ============ FOOTER ============ */
footer{border-top:1px solid var(--line);padding:28px 0;color:var(--ink3);font-size:13px;text-align:center}
footer b{color:var(--ink2)}
footer .src{font-family:'JetBrains Mono';font-size:11px;margin-top:8px;word-break:break-all;opacity:.7}
.foot-links{margin-top:14px;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
.foot-links a{color:var(--gold2);transition:.15s}
.foot-links a:hover{color:var(--gold);text-decoration:underline}
.foot-sep{color:var(--ink3)}

/* ============ RESPONSIVE ============ */
@media(max-width:1020px){
  .brand-name{display:none}
  .cd-grid2,.pp-two-col,.pp-yoy-grid{grid-template-columns:1fr}
}
@media(max-width:860px){
  .tabs{display:none}
  .bottomnav{display:block}
  main{padding-bottom:120px}
  .wrap{padding:0 16px}
  .refresh-txt{display:none}
}
@media(max-width:680px){
  :root{--topbar-h:54px}
  .hero-inner{padding:20px 0 18px}
  h1{font-size:34px}
  .hero-sub{display:none}
  .hstat{padding:10px 13px;min-width:0;flex:1}
  .hstat .n{font-size:19px}
  .hero-stats{width:100%}
  .podium{grid-template-columns:1fr;gap:12px}
  .pod-card.p1{transform:none}
  .pod-card.p1.pod-clickable:hover{transform:translateY(-4px)}
  td,th{padding:10px 9px;font-size:13px}
  .hide-sm{display:none}
  .rival-hero{grid-template-columns:1fr}
  .matchup .body{flex-direction:column;align-items:flex-start;gap:10px}
  .cs-grid,.pace-grid,.cd-dm-cols,.md-decks-grid,.pcolor-grid{grid-template-columns:1fr}
  .cd-stats{grid-template-columns:repeat(2,1fr)}
  .md-hero{flex-direction:column}
  .md-player .bigpct{font-size:44px}
  .fd-name{width:60px;font-size:13px}
  .vbar-chart{gap:12px}
  .vbar-col{flex-basis:70px}
  .sol-compare{gap:16px}
  .sol-ring-big{width:104px;height:104px}
  .sol-num{font-size:24px}
  .strk-name{width:100%}
  .strk-cur-wrap{width:auto;text-align:left}
  .rg-ctrl-lbl{min-width:0;width:100%}
  .scopechip .scope-lbl-txt{max-width:110px;overflow:hidden;text-overflow:ellipsis}
  .hl-grid{grid-template-columns:repeat(2,1fr)}
  .section-head h2{font-size:21px}
  .subnav{top:var(--topbar-h)}
  .cmp-table th,.cmp-table td{padding:10px 10px}
  .search-overlay{padding-top:8vh}
}
@media(max-width:420px){
  .hl-grid{grid-template-columns:1fr}
}

/* ============ v2 refinements ============ */
/* breathing room: content clear of header & footer */
main{padding:36px 0 150px}
.subnav{margin:0 0 24px;padding:10px 0 12px}
/* last section in a subnav'd hub must be able to reach the top of the viewport,
   otherwise its chip can never activate */
.subnav~.sec:last-of-type{min-height:calc(100vh - var(--topbar-h) - 170px)}

/* player-detail tag chips: clear of the stats grid below */
.cd-header .ptags{margin:12px 0 18px}

/* color profile: fixed-width pip column so all bars start at the same x,
   visible track runway, centered legend */
.pcv-row .pips{width:84px;flex-shrink:0;margin-top:0}
.pcv-track{background:var(--panel2)}
.cw-legend{justify-content:center}
.cw-stack{margin:8px 0 14px}

/* guest tag */
.ptag-guest{color:#9db4c8;border-color:rgba(157,180,200,.45);background:rgba(157,180,200,.10)}

/* ── topbar time scope: one-click year segment (desktop) ── */
.scope-anchor{position:relative;display:flex;align-items:center;gap:8px}
.scope-seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.scope-seg button{font-family:'Oswald';font-weight:500;font-size:13px;letter-spacing:.03em;color:var(--ink3);background:none;border:none;padding:6px 12px;border-radius:7px;cursor:pointer;transition:.15s;white-space:nowrap}
.scope-seg button:hover{color:var(--ink)}
.scope-seg button.on{background:var(--gold);color:var(--gold-ink)}
.scope-cal.customized{border-color:var(--gold);color:var(--gold2);background:rgba(217,178,90,.12)}
#rangeChip{display:none;align-items:center}
#rangeChip .x{margin-left:2px;font-size:16px;line-height:1;opacity:.65;padding:0 3px;font-family:'Inter'}
#rangeChip:hover .x{opacity:1}
.scope-anchor.ranged .scope-seg{display:none}
.scope-anchor.ranged #rangeChip{display:flex}
#scopeChip{display:none}
@media(max-width:760px){
  .scope-seg,.scope-cal,#rangeChip{display:none!important}
  #scopeChip{display:flex}
}
@media(max-width:860px){
  main{padding-bottom:170px}
}

/* ============ v3 refinements ============ */
/* hubs without a subnav (Overview, Commanders, detail pages) start a touch lower */
.view > :first-child:not(.subnav){margin-top:10px}

</style>
</head>
<body>

<div class="topbar" id="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="#/overview">
      <span class="brand-mark">BR</span>
      <span class="brand-name">Blizzard <i>Rentner</i></span>
    </a>
    <nav class="tabs" id="tabs">
      <a class="tab" data-v="overview" href="#/overview"><span data-i="nav_overview"></span></a>
      <a class="tab" data-v="games" href="#/games"><span data-i="nav_games"></span></a>
      <a class="tab" data-v="players" href="#/players"><span data-i="nav_players"></span></a>
      <a class="tab" data-v="commanders" href="#/commanders"><span data-i="tab_commanders"></span></a>
      <a class="tab" data-v="insights" href="#/insights"><span data-i="nav_insights"></span></a>
    </nav>
    <div class="topbar-right">
      <div class="scope-anchor" id="scopeAnchor">
        <div class="scope-seg" id="scopeSeg"></div>
        <button class="scopechip customized" id="rangeChip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          <span class="scope-lbl-txt" id="rangeChipLbl"></span>
          <span class="x" title="Clear">×</span>
        </button>
        <button class="iconbtn scope-cal" id="scopeCalBtn" title="">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        </button>
        <button class="scopechip" id="scopeChip" title="">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          <span class="scope-lbl-txt" id="scopeChipLbl">—</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="scope-pop" id="scopePop"></div>
      </div>
      <button class="iconbtn" id="searchBtn" title="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </button>
      <button class="iconbtn" id="refreshBtn" title="">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg>
      </button>
    </div>
  </div>
</div>

<header class="hero">
  <div class="mana-ring"></div>
  <div class="wrap hero-inner">
    <div class="hero-title-block">
      <div class="eyebrow"><span data-i="eyebrow"></span> <span class="live-dot"></span></div>
      <h1><span data-i="title1"></span> <span class="thin" data-i="title2"></span></h1>
      <p class="hero-sub" data-i="sub"></p>
    </div>
    <div class="hero-stats" id="heroStats"></div>
  </div>
</header>

<main class="wrap">
  <div id="loading" class="status">
    <div class="spinner"></div>
    <h3 data-i="loading_title"></h3>
    <p data-i="loading_sub"></p>
  </div>

  <div id="error" class="status err" style="display:none">
    <h3 data-i="err_title"></h3>
    <p id="errMsg"></p>
    <div class="steps">
      <b data-i="setup_title"></b>
      <ol>
        <li data-i="setup_1"></li><li data-i="setup_2"></li><li data-i="setup_3"></li>
        <li data-i="setup_4"></li><li data-i="setup_5"></li>
      </ol>
    </div>
    <button class="btn" id="retryBtn" data-i="try_again"></button>
  </div>

  <div id="app" style="display:none">
    <div id="noYear" class="empty" style="display:none"></div>

    <!-- ================= OVERVIEW ================= -->
    <section class="view" id="v-overview">
      <div class="hl-grid" id="hlGrid"></div>
      <div class="podium" id="podium"></div>
      <div class="section-head"><h2 data-i="full_standings"></h2><span class="hint" data-i="pp_click_player"></span></div>
      <div class="panel"><table id="lbTable">
        <thead><tr>
          <th data-k="name" class="sortable"><span data-i="th_player"></span> <span class="arr"></span></th>
          <th data-k="games" class="sortable"><span data-i="th_games"></span> <span class="arr"></span></th>
          <th data-k="wins" class="sortable"><span data-i="th_wins"></span> <span class="arr"></span></th>
          <th data-k="winrate" class="sortable"><span data-i="th_winrate"></span> <span class="arr">▼</span></th>
          <th class="bar-cell hide-sm"></th>
          <th data-k="avgrank" class="sortable"><span data-i="th_avgfinish"></span> <span class="arr"></span></th>
          <th data-k="solrate" class="sortable hide-sm"><span data-i="th_solring"></span> <span class="arr"></span></th>
        </tr></thead><tbody></tbody>
      </table></div>
    </section>

    <!-- ================= GAMES (entire history · window-driven) ================= -->
    <section class="view" id="v-games">
      <nav class="subnav" data-spy="v-games">
        <a class="snav on" data-target="sec-impact" data-i="impact_title"></a>
        <a class="snav" data-target="sec-window" data-i="gw_title"></a>
        <a class="snav" data-target="sec-winfin" data-i="rg_trend_title"></a>
        <a class="snav" data-target="sec-length" data-i="length_title"></a>
        <a class="snav" data-target="sec-pace" data-i="pace_title"></a>
        <a class="snav" data-target="sec-rglist" data-i="rg_title"></a>
      </nav>

      <div class="sec" id="sec-impact">
        <div class="section-head"><h2 data-i="impact_title"></h2></div>
        <div class="hint" style="margin:-8px 0 16px;font-size:13px;color:var(--ink3)" data-i="impact_sub"></div>
        <div class="rg-controls" style="margin-top:0">
          <div class="rg-ctrl-row">
            <span class="rg-ctrl-lbl" data-i="impact_slider_lbl"></span>
            <input type="range" id="impactSlider" min="1" max="10" step="1" value="2">
            <span id="impactSliderVal" class="impact-slider-val"></span>
          </div>
          <div class="rg-focus" id="impactFocus"></div>
        </div>
        <div class="impact-feed" id="impactList"></div>
      </div>

      <div class="sec" id="sec-window">
        <div class="section-head"><h2 data-i="gw_title"></h2><span class="ti-badge" data-i="games_ind"></span></div>
        <div class="hint" style="margin:-8px 0 16px;font-size:13px;color:var(--ink3)" data-i="gw_sub"></div>
        <div class="rg-controls" id="rgControls" style="margin-top:0">
          <div class="rg-ctrl-row" id="rgPlayerRow">
            <span class="rg-ctrl-lbl" data-i="rg_players_lbl"></span>
            <div class="rg-pfilter" id="rgPlayerFilter"></div>
          </div>
          <div class="rg-pfilter-note" id="rgPfilterNote" style="display:none"></div>
          <div class="rg-ctrl-row" style="margin-top:14px">
            <span class="rg-ctrl-lbl" data-i="rg_window_lbl"></span>
            <div class="seg rg-winseg" id="rgWinSeg">
              <button data-w="10" class="on">10</button>
              <button data-w="25">25</button>
              <button data-w="50">50</button>
              <button data-w="0" data-i="rg_win_all"></button>
            </div>
            <input type="number" id="rgWinCustom" class="rg-win-custom" min="1" step="1" inputmode="numeric">
          </div>
          <div class="rg-ctrl-row rg-slider-row" id="rgSliderRow">
            <button class="rg-step" id="rgStepNewer" title="Newer">⏮</button>
            <input type="range" id="rgSlider" min="0" max="0" value="0" step="1">
            <button class="rg-step" id="rgStepOlder" title="Older">⏭</button>
          </div>
          <div class="rg-focus" id="rgFocus"></div>
        </div>
      </div>

      <div class="sec" id="sec-winfin">
        <div class="section-head"><h2 data-i="rg_trend_title"></h2><span class="hint" id="rgTrendHint"></span></div>
        <div class="panel chart-panel" id="rgTrendPanel">
          <div id="rgTrendChart" class="finish-chart"></div>
        </div>
      </div>

      <div class="sec" id="sec-length">
        <div class="section-head"><h2 data-i="length_title"></h2><span class="hint" id="glCount"></span></div>
        <div class="gl-grid" id="glStats"></div>
        <div class="panel" style="padding:24px 26px">
          <div style="font-family:'Oswald';font-weight:600;font-size:18px;text-transform:uppercase;margin-bottom:4px" data-i="gl_distribution"></div>
          <div class="hint" style="color:var(--ink3);font-size:13px" data-i="gl_dist_sub"></div>
          <div class="histo" id="glHisto"></div>
        </div>
      </div>

      <div class="sec" id="sec-pace">
        <div class="section-head"><h2 data-i="pace_title"></h2><span class="hint" data-i="pace_sub"></span></div>
        <div class="panel" style="padding:22px 24px">
          <div class="hint" style="color:var(--ink2);font-size:13px;line-height:1.6;margin-bottom:18px" id="paceHelp"></div>
          <div class="pace-grid" id="paceGrid"></div>
        </div>
      </div>

      <div class="sec" id="sec-rglist">
        <div class="section-head"><h2 data-i="rg_title"></h2><span class="hint" data-i="rg_sub"></span></div>
        <div class="h2h-dig-hint" style="margin-top:0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg><span data-i="rg_click_hint"></span></div>
        <div class="rg-list" id="rgList"></div>
