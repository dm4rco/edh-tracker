const DETAIL_PARENT={player:'overview',commander:'commanders',matchup:'players'};
let ROUTE={view:'overview',params:[]};
let NAV_STACK=[location.hash.replace(/^#\/?/,'')||'overview'];

function parseRoute(){
  const h=location.hash.replace(/^#\/?/,'');
  const parts=h.split('/').map(s=>{try{return decodeURIComponent(s);}catch(e){return s;}});
  const v=parts[0]||'overview';
  if(HUBS.includes(v))return{view:v,params:[]};
  if(v==='player'&&parts[1])return{view:'player',params:[parts[1]]};
  if(v==='commander'&&parts[1])return{view:'commander',params:[parts[1]]};
  if(v==='matchup'&&parts[1]&&parts[2])return{view:'matchup',params:[parts[1],parts[2]]};
  return{view:'overview',params:[]};
}
function navigate(path){
  const target='#/'+path;
  if(location.hash===target){applyRoute();}
  else location.hash=target;
}
function goBack(fallbackHub){
  if(NAV_STACK.length>1)history.back();
  else navigate(fallbackHub);
}
function applyRouteVisibility(){
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  const el=document.getElementById(VIEW_EL[ROUTE.view]);
  if(el)el.classList.add('active');
  const active=HUBS.includes(ROUTE.view)?ROUTE.view:DETAIL_PARENT[ROUTE.view];
  document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('active',b.dataset.v===active));
  updateSubnavSpy();
}
function syncRouteState(){
  ppName=ROUTE.view==='player'?ROUTE.params[0]:null;
  cdName=ROUTE.view==='commander'?ROUTE.params[0]:null;
  mdPair=ROUTE.view==='matchup'?{a:ROUTE.params[0],b:ROUTE.params[1]}:null;
}
function renderRouteDetail(){
  if(!S)return;
  if(ROUTE.view==='player')renderPlayerDetail();
  else if(ROUTE.view==='commander')renderCommanderDetail();
  else if(ROUTE.view==='matchup')renderMatchupDetail();
}
function applyRoute(){
  ROUTE=parseRoute();
  syncRouteState();
  applyRouteVisibility();
  renderRouteDetail();
  window.scrollTo({top:0,behavior:'auto'});
}
window.addEventListener('hashchange',()=>{
  const p=location.hash.replace(/^#\/?/,'')||'overview';
  if(NAV_STACK.length>=2&&NAV_STACK[NAV_STACK.length-2]===p)NAV_STACK.pop();
  else NAV_STACK.push(p);
  applyRoute();
});

/* ── time scope chip + popover ── */
function scopeLabel(){
  if(customRange){
    if(customRange.from===customRange.to)return monthLabel(customRange.from);
    return monthLabel(customRange.from)+' – '+monthLabel(customRange.to);
  }
  return curYear==='all'?t('year_all'):String(curYear);
}
function renderScopeChip(){
  const lbl=$('#scopeChipLbl');
  if(lbl)lbl.textContent=scopeLabel();
  const chip=$('#scopeChip');
  if(chip){chip.classList.toggle('customized',!!customRange);chip.title=t('scope_label');}
  syncScopeControls();
}
function buildScopeSeg(){
  const seg=$('#scopeSeg');if(!seg)return;
  const yrs=[['all',t('year_all')]].concat(YEARS.map(y=>[y,String(y)]));
  seg.innerHTML=yrs.map(([v,l])=>`<button data-y="${v}">${l}</button>`).join('');
  syncScopeControls();
}
function syncScopeControls(){
  const seg=$('#scopeSeg');
  if(seg)seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',!customRange&&String(b.dataset.y)===String(curYear)));
  const cal=$('#scopeCalBtn');
  if(cal)cal.classList.toggle('customized',!!customRange);
  const anchor=$('#scopeAnchor');
  if(anchor)anchor.classList.toggle('ranged',!!customRange);
  const l=$('#rangeChipLbl');
  if(l&&customRange)l.textContent=scopeLabel();
}
function buildScopePop(){
  const pop=$('#scopePop');if(!pop)return;
  const yrs=[['all',t('year_all')]].concat(YEARS.map(y=>[y,String(y)]));
  const yearBtns=yrs.map(([v,l])=>`<button data-y="${v}" class="${!customRange&&String(v)===String(curYear)?'on':''}">${l}</button>`).join('');
  const f=customRange?customRange.from:(ALL_MONTHS[0]||'');
  const to=customRange?customRange.to:(ALL_MONTHS[ALL_MONTHS.length-1]||'');
  const optsFrom=ALL_MONTHS.map(m=>`<option value="${m}" ${m===f?'selected':''}>${monthLabel(m)}</option>`).join('');
  const optsTo=ALL_MONTHS.map(m=>`<option value="${m}" ${m===to?'selected':''}>${monthLabel(m)}</option>`).join('');
  pop.innerHTML=`
    <div class="sp-lbl">${t('year_label')}</div>
    <div class="sp-years" id="spYears">${yearBtns}</div>
    <div class="sp-divider"></div>
    <div class="sp-lbl">${t('date_range_label')}</div>
    <div class="rp-row"><label class="rp-lbl">${t('date_from')}</label><select id="rpFrom" class="rp-sel">${optsFrom}</select></div>
    <div class="rp-row"><label class="rp-lbl">${t('date_to')}</label><select id="rpTo" class="rp-sel">${optsTo}</select></div>
    <div class="rp-actions">
      <button class="rp-clear" id="rpClear">${t('date_clear')}</button>
      <button class="rp-apply" id="rpApply">${t('date_apply')}</button>
    </div>`;
  $('#spYears').addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    customRange=null;curYear=b.dataset.y;
    closeScopePop();buildScopePop();rebuild();
  });
  $('#rpApply').addEventListener('click',()=>{
    let from=$('#rpFrom').value,to=$('#rpTo').value;
    if(from>to){const tmp=from;from=to;to=tmp;}
    customRange={from,to};
    closeScopePop();buildScopePop();rebuild();
  });
  $('#rpClear').addEventListener('click',()=>{
    customRange=null;
    closeScopePop();buildScopePop();rebuild();
  });
}
function openScopePop(){buildScopePop();$('#scopePop').classList.add('on');}
function closeScopePop(){const p=$('#scopePop');if(p)p.classList.remove('on');}
(function(){
  const seg=$('#scopeSeg');
  if(seg)seg.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    customRange=null;curYear=b.dataset.y;
    closeScopePop();rebuild();
  });
  const cal=$('#scopeCalBtn');
  if(cal)cal.addEventListener('click',e=>{
    e.stopPropagation();
    const p=$('#scopePop');
    if(p.classList.contains('on'))closeScopePop();else openScopePop();
  });
  const rc=$('#rangeChip');
  if(rc)rc.addEventListener('click',e=>{
    e.stopPropagation();
    if(e.target.closest('.x')){customRange=null;closeScopePop();buildScopePop();rebuild();return;}
    const p=$('#scopePop');
    if(p.classList.contains('on'))closeScopePop();else openScopePop();
  });
})();
$('#scopeChip').addEventListener('click',e=>{
  e.stopPropagation();
  const p=$('#scopePop');
  if(p.classList.contains('on'))closeScopePop();else openScopePop();
});
document.addEventListener('click',e=>{
  const p=$('#scopePop');if(!p||!p.classList.contains('on'))return;
  if(p.contains(e.target)||e.target.closest('#scopeChip')||e.target.closest('#scopeCalBtn')||e.target.closest('#rangeChip'))return;
  closeScopePop();
});

/* ── global search (players + commanders, all-time index) ── */
let SEARCH_INDEX=null;
function buildSearchIndex(){
  const pc={},cc={};
  (ALL_GAMES||[]).forEach(g=>g.seats.forEach(s=>{pc[s.player]=(pc[s.player]||0)+1;cc[s.commander]=(cc[s.commander]||0)+1;}));
  SEARCH_INDEX={
    players:Object.keys(pc).sort((a,b)=>pc[b]-pc[a]||a.localeCompare(b)).map(n=>({name:n,games:pc[n]})),
    commanders:Object.keys(cc).sort((a,b)=>cc[b]-cc[a]||a.localeCompare(b)).map(n=>({name:n,games:cc[n]}))
  };
}
function openSearch(){
  if(!SEARCH_INDEX)return;
  $('#searchOverlay').classList.add('on');
  const i=$('#searchInput');i.value='';
  renderSearchResults('');
  setTimeout(()=>i.focus(),30);
}
function closeSearch(){$('#searchOverlay').classList.remove('on');}
function renderSearchResults(q){
  const host=$('#searchResults');if(!host||!SEARCH_INDEX)return;
  q=(q||'').trim().toLowerCase();
  const filt=arr=>q?arr.filter(x=>x.name.toLowerCase().includes(q)):arr;
  const ps=filt(SEARCH_INDEX.players).slice(0,7);
  const cs=filt(SEARCH_INDEX.commanders).slice(0,8);
  if(!ps.length&&!cs.length){host.innerHTML=`<div class="so-empty">${t('search_none',{q:esc(q)})}</div>`;return;}
  let html='';
  if(ps.length){
    html+=`<div class="so-group">${t('nav_players')}</div>`;
    html+=ps.map(p=>`<button class="so-item" data-go="player/${encodeURIComponent(p.name)}"><span class="so-ic">${esc((p.name[0]||'?').toUpperCase())}</span><span class="so-name">${esc(p.name)}</span><span class="so-sub">${p.games} ${t('cs_games_short')}</span></button>`).join('');
  }
  if(cs.length){
    html+=`<div class="so-group">${t('tab_commanders')}</div>`;
    html+=cs.map(c=>`<button class="so-item" data-go="commander/${encodeURIComponent(c.name)}"><span class="so-ic">★</span><span class="so-name">${esc(c.name)} ${colorPips(c.name,10)}</span><span class="so-sub">${c.games} ${t('cs_games_short')}</span></button>`).join('');
  }
  host.innerHTML=html;
  host.querySelectorAll('.so-item').forEach(el=>el.addEventListener('click',()=>{closeSearch();navigate(el.dataset.go);}));
}
$('#searchBtn').addEventListener('click',openSearch);
$('#searchOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeSearch();});
$('#searchInput').addEventListener('input',e=>renderSearchResults(e.target.value));
$('#searchInput').addEventListener('keydown',e=>{
  if(e.key==='Enter'){const first=$('#searchResults .so-item');if(first)first.click();}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeSearch();closeScopePop();return;}
  if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
    const tag=(document.activeElement&&document.activeElement.tagName||'').toLowerCase();
    if(tag==='input'||tag==='textarea'||tag==='select')return;
    e.preventDefault();openSearch();
  }
});

/* ── overview highlights strip ── */
function renderHighlights(){
  const host=$('#hlGrid');if(!host)return;
  const cards=[];
  const games=gamesForYear().slice().sort((a,b)=>{
    const da=a.date||'',db=b.date||'';
    if(da!==db)return da<db?1:-1;
    return (b.order||0)-(a.order||0);
  });
  const lg=games[0];
  if(lg){
    const winner=lg.seats.find(s=>s.rank===1);
    cards.push({cls:'',label:t('hl_lastgame'),big:winner?esc(winner.player):'—',
      sub:`${winner?esc(winner.commander)+' · ':''}${localizedGameDate(lg.date)}`,
      go:winner?()=>openPlayerDetail(winner.player):null});
  }
  const rankedP=S.players.filter(p=>CORE.includes(p.name));
  const boss=rankedP.slice().sort((a,b)=>b.winrate-a.winrate)[0];
  if(boss)cards.push({cls:'gold',label:t('tag_endboss'),big:esc(boss.name),
    sub:`${boss.winrate}% ${t('winrate_label')} · ${boss.games} ${t('games_label')}`,
    go:()=>openPlayerDetail(boss.name)});
  const strk=computeStreaks();
  const fire=strk.filter(r=>r.curWin>=2).sort((a,b)=>b.curWin-a.curWin)[0];
  if(fire)cards.push({cls:'fire',label:t('tag_onfire'),big:esc(fire.player),
    sub:t('streak_cur_win',{n:fire.curWin}),go:()=>openPlayerDetail(fire.player)});
  else{
    const bw=strk[0];
    if(bw&&bw.bestWin>=2)cards.push({cls:'fire',label:t('streak_best_win'),big:esc(bw.player),
      sub:`${bw.bestWin} ${t('wins_label')}`,go:()=>openPlayerDetail(bw.player)});
  }
  if(S.gl)cards.push({cls:'',label:t('gl_average'),big:S.gl.avg+'m',
    sub:`${S.gl.n} ${t('pace_games')}`,
    go:()=>{navigate('games');setTimeout(()=>{const el=document.getElementById('sec-length');if(el)el.scrollIntoView({behavior:'smooth'});},90);}});
  host.innerHTML=cards.map((c,i)=>`<button class="hl-card ${c.cls}" data-hl="${i}"><span class="hl-label">${c.label}</span><span class="hl-big">${c.big}</span><span class="hl-sub">${c.sub}</span></button>`).join('');
  host.querySelectorAll('.hl-card').forEach(el=>{
    const c=cards[+el.dataset.hl];
    if(c&&c.go)el.addEventListener('click',c.go);
  });
}

/* ── in-page section subnav (scrollspy) ── */
function initSubnavs(){
  document.querySelectorAll('.subnav .snav').forEach(a=>{
    a.addEventListener('click',()=>{
      const el=document.getElementById(a.dataset.target);
      if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
    });
  });
  let ticking=false;
  window.addEventListener('scroll',()=>{
    if(ticking)return;ticking=true;
    requestAnimationFrame(()=>{ticking=false;updateSubnavSpy();});
  },{passive:true});
}
function updateSubnavSpy(){
  const view=document.querySelector('.view.active');
  if(!view)return;
  const nav=view.querySelector('.subnav');if(!nav)return;
  const links=Array.prototype.slice.call(nav.querySelectorAll('.snav'));
  if(!links.length)return;
  const tb=document.getElementById('topbar');
  const offset=(tb?tb.offsetHeight:58)+90;
  let current=links[0].dataset.target;
  for(const a of links){
    const el=document.getElementById(a.dataset.target);
    if(el&&el.getBoundingClientRect().top<=offset)current=a.dataset.target;
  }
  // at (or within a few px of) the very bottom, the last section wins even if
  // it's too short to ever cross the offset line
  if(window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-6)
    current=links[links.length-1].dataset.target;
  links.forEach(a=>a.classList.toggle('on',a.dataset.target===current));
}

  const newer=$('#rgStepNewer'),older=$('#rgStepOlder');
  if(newer)newer.addEventListener('click',()=>{
    const all=recentSorted();const win=recentWindow(all);
    rgWinEnd=Math.max(0,rgWinEnd-win.size);
    renderRecent();
  });
  if(older)older.addEventListener('click',()=>{
    const all=recentSorted();const win=recentWindow(all);
    rgWinEnd=Math.min(win.maxEnd,rgWinEnd+win.size);
    renderRecent();
  });
  const cust=$('#rgWinCustom');
  function applyCustom(){
    let v=parseInt(cust.value,10);
    if(!isFinite(v))return;
    if(v<1)v=1;
    const total=recentSorted().length;
    if(total&&v>total)v=total;
    rgWinSize=v;
    rgWinEnd=0;
    renderRecent();
  }
  if(cust){
    cust.addEventListener('input',applyCustom);
    cust.addEventListener('change',applyCustom);
  }

/* ===== load ===== */
let FIRST_LOAD=true;
async function load(){
  applyStaticI18n();
  $('#app').style.display='none';$('#error').style.display='none';$('#loading').style.display='flex';
  const rb=$('#refreshBtn');if(rb)rb.classList.add('spin');
  if(!SHEET_CSV_URL||SHEET_CSV_URL.includes('PASTE_YOUR')){
    $('#loading').style.display='none';$('#error').style.display='flex';
    $('#errMsg').textContent='';if(rb)rb.classList.remove('spin');return;
  }
  try{
    const res=await fetch(SHEET_CSV_URL,{cache:'no-store'});
    if(!res.ok)throw new Error(`HTTP ${res.status}`);
    const text=await res.text();
    if(/<html/i.test(text.slice(0,200)))throw new Error("Got HTML, not CSV — check the published link format.");
    ALL_GAMES=parseGames(text);
    buildPlayerColorMap();
    COMMANDER_COLORS={};COMMANDER_COLOR_INDEX={};_favColorCache=null;_favComboCache=null;
    const cu=colorsCsvUrl();
    if(cu){
      try{
        const cres=await fetch(cu,{cache:'no-store'});
        if(cres.ok){
          const ctext=await cres.text();
          if(!/<html/i.test(ctext.slice(0,200))){
            const parsed=parseColors(ctext);
            COMMANDER_COLORS=parsed.map;COMMANDER_COLOR_INDEX=parsed.index;
          }
        }
      }catch(ce){console.warn('Colors sheet not loaded:',ce);}
    }
    YEARS=[...new Set(ALL_GAMES.map(g=>g.date&&g.date.slice(0,4)).filter(Boolean))].sort();
    ALL_MONTHS=[...new Set(ALL_GAMES.map(g=>g.date&&g.date.slice(0,7)).filter(Boolean))].sort();
    if(FIRST_LOAD){
      curYear=YEARS.includes(DEFAULT_YEAR)?DEFAULT_YEAR:'all';
      customRange=null;
      FIRST_LOAD=false;
    }else if(curYear!=='all'&&!YEARS.includes(String(curYear))){
      curYear='all';customRange=null;
    }
    buildSearchIndex();
    buildScopePop();
    buildScopeSeg();
    $('#footSrc').textContent=SHEET_CSV_URL;
    $('#loading').style.display='none';$('#app').style.display='block';
    ROUTE=parseRoute();
    syncRouteState();
    rebuild();
  }catch(err){
    $('#loading').style.display='none';$('#error').style.display='flex';
    $('#errMsg').textContent=(err&&err.message)?err.message:String(err);
    console.error(err);
  }finally{
    if(rb)rb.classList.remove('spin');
  }
}

initSubnavs();
load();
