/* ===== COMMANDER PACE (which commanders => fast/slow games) ===== */
const PACE_MIN_GAMES = 4;        // min timed appearances for a commander to qualify
const PACE_SHOW = 8;             // entries per column
function computeCommanderPace(){
  const games=(RG_WIN_ITEMS||[]).filter(g=>g.gametime!=null);
  if(games.length<2) return null;
  const overallAvg = games.reduce((s,g)=>s+g.gametime,0)/games.length;
  const cmd={}; // commander -> {sum,n}
  for(const g of games){
    // a commander counts once per game even if (somehow) duplicated
    const seen=new Set();
    for(const s of g.seats){
      if(seen.has(s.commander)) continue;
      seen.add(s.commander);
      const c=cmd[s.commander]||(cmd[s.commander]={sum:0,n:0});
      c.sum+=g.gametime; c.n++;
    }
  }
  const arr=Object.entries(cmd)
    .filter(([_,c])=>c.n>=PACE_MIN_GAMES)
    .map(([name,c])=>({name,games:c.n,avg:c.sum/c.n,delta:(c.sum/c.n)-overallAvg}))
    .sort((a,b)=>a.delta-b.delta);
  if(!arr.length) return null;
  const maxAbs=Math.max(...arr.map(a=>Math.abs(a.delta)),1);
  return {overallAvg:Math.round(overallAvg), rows:arr, maxAbs};
}

function renderPace(){
  const grid=$('#paceGrid'); if(!grid) return;
  const help=$('#paceHelp');
  const d=computeCommanderPace();
  if(!d){
    if(help) help.textContent='';
    grid.innerHTML=`<div class="empty">${t('pace_none')}</div>`;
    return;
  }
  if(help) help.innerHTML=t('pace_help',{avg:d.overallAvg});

  const fastest=d.rows.filter(r=>r.delta<0).slice(0,PACE_SHOW);
  const slowest=d.rows.filter(r=>r.delta>0).slice(-PACE_SHOW).reverse();

  const rowHtml=(r)=>{
    const fast=r.delta<0;
    const w=Math.abs(r.delta)/d.maxAbs*50; // half-width track (50% each side)
    const mins=Math.abs(r.delta);
    const disp=(mins>=10?Math.round(mins):mins.toFixed(1));
    return `<div class="pace-row" data-cmd="${esc(r.name)}">
      <span class="pcm">${esc(r.name)}</span>
      <span class="pace-track"><span class="mid"></span><span class="fill ${fast?'f':'s'}" style="width:${w}%"></span></span>
      <span class="pace-delta ${fast?'f':'s'}">${fast?'−':'+'}${disp}m<small>${Math.round(r.avg)}m ${t('pace_avg')}</small></span>
    </div>`;
  };

  grid.innerHTML=`
    <div class="pace-col">
      <div class="pace-col-title fast">▼ ${t('pace_fastest')}</div>
      ${fastest.map(rowHtml).join('')||`<div class="empty" style="font-size:13px">—</div>`}
      <div class="pace-sub">${t('pace_min_note',{min:PACE_MIN_GAMES})}</div>
    </div>
    <div class="pace-col">
      <div class="pace-col-title slow">▲ ${t('pace_slowest')}</div>
      ${slowest.map(rowHtml).join('')||`<div class="empty" style="font-size:13px">—</div>`}
      <div class="pace-sub">${t('pace_vs_avg')}: ${d.overallAvg}m</div>
    </div>`;

  grid.querySelectorAll('.pace-row').forEach(el=>el.addEventListener('click',()=>openCommanderDetail(el.dataset.cmd)));
}




/* ===== commander detail computation (current year subset) ===== */
const CMD_MATCHUP_MIN = 3; // min games for a deck-vs-deck matchup to be shown
const MIN_TAG_GAMES = 15;  // min games for a player to be eligible for superlative tags
const PRESENCE_MIN_GAMES = 8; // min games needed in EACH of the with/without buckets
function computeCommanderDetail(cmdName){
  const games=gamesForYear();
  let g=0,w=0,rs=0,rn=0, solWith=0, solSeats=0, seatSum=0, seatN=0;
  const fin={1:0,2:0,3:0,4:0};
  const pilots={};          // player -> {g,w,rs}
  const vsPlayer={};        // opponent player -> {g,ahead,behind,ties}
  const vsCmd={};           // opponent commander -> {g,ahead,behind,ties}
  for(const gm of games){
    const me=gm.seats.find(s=>s.commander===cmdName);
    if(!me) continue;
    g++; if(me.rank===1)w++; rs+=me.rank; rn++;
    if(me.rank>=1&&me.rank<=4)fin[me.rank]++;
    if(me.sol!=null){solSeats++; if(me.sol===1)solWith++;}
    if(me.turn){seatSum+=me.turn; seatN++;}
    const pl=pilots[me.player]||(pilots[me.player]={g:0,w:0,rs:0});
    pl.g++; if(me.rank===1)pl.w++; pl.rs+=me.rank;
    for(const opp of gm.seats){
      if(opp===me) continue;
      const vp=vsPlayer[opp.player]||(vsPlayer[opp.player]={g:0,ahead:0,behind:0,ties:0});
      vp.g++; if(me.rank<opp.rank)vp.ahead++; else if(me.rank>opp.rank)vp.behind++; else vp.ties++;
      const vc=vsCmd[opp.commander]||(vsCmd[opp.commander]={g:0,ahead:0,behind:0,ties:0});
      vc.g++; if(me.rank<opp.rank)vc.ahead++; else if(me.rank>opp.rank)vc.behind++; else vc.ties++;
    }
  }
  if(g===0) return null;
  const pilotArr=Object.entries(pilots).map(([player,d])=>({player,games:d.g,wins:d.w,
    winrate:+(100*d.w/d.g).toFixed(1), avgrank:+(d.rs/d.g).toFixed(2)})).sort((a,b)=>b.games-a.games);
  const vsPlayerArr=Object.entries(vsPlayer).map(([player,d])=>({player,games:d.g,ahead:d.ahead,behind:d.behind,ties:d.ties,
    pct:+(100*d.ahead/d.g).toFixed(0)})).sort((a,b)=>b.pct-a.pct||b.games-a.games);
  const vsCmdArr=Object.entries(vsCmd).filter(([c,d])=>d.g>=CMD_MATCHUP_MIN).map(([cmd,d])=>({cmd,games:d.g,ahead:d.ahead,behind:d.behind,ties:d.ties,
    pct:+(100*d.ahead/d.g).toFixed(0)})).sort((a,b)=>b.pct-a.pct||b.games-a.games);
  return {
    name:cmdName, games:g, wins:w, winrate:+(100*w/g).toFixed(1), avgrank:+(rs/rn).toFixed(2),
    fin, finTot:fin[1]+fin[2]+fin[3]+fin[4],
    solRate: solSeats?+(100*solWith/solSeats).toFixed(0):null,
    avgSeat: seatN?+(seatSum/seatN).toFixed(1):null,
    pilots:pilotArr, vsPlayer:vsPlayerArr, vsCmd:vsCmdArr
  };
}

/* ===== commander news feed — same highlights-feed idea as Recent Impact (Games tab),
   reused here as a per-commander history instead of a per-pod recent window. No slider:
   a fixed "last 8 (or all, if fewer)" window keeps this feeling like news rather than a
   wiki page, since sample sizes vary wildly commander to commander. Reuses the exact
   i18n keys, tagKeys and CSS classes Recent Impact already established (first-win/loss,
   clean sweep, debut) so the two feeds read as one visual language; only the commander-
   level win/loss streak (independent of who's piloting) is new copy. */
// Two-name "matchup trend" detector — shared shape for both commander-vs-commander deck
// matchups and this commander's pilot vs opposing PLAYERS. Reuses Recent Impact's exact
// pod-wide rivalry wording (impact_ev_rivalry_tie/flip) — generic enough ("{a} and {b}...",
// "{leader} took the lead over {other}...") to work for any two named things, not just two
// players — so no new copy is needed for either variant. Gated at CMD_MATCHUP_MIN games (the
// same floor already used to decide whether a deck matchup is even shown elsewhere on this
// page) so a 1-2 game sample can't flip back and forth every render.
function commanderMatchupTrend(cmdName, sorted, beforeGames, windowGames, otherOf){
  const events=[];
  const recordOf=(games, otherLabel)=>{
    let mine=0, other=0, ties=0;
    games.forEach(g=>{
      const me=g.seats.find(s=>s.commander===cmdName);
      if(!me) return;
      const opp=g.seats.find(s=>s!==me && otherOf(s)===otherLabel);
      if(!opp) return;
      if(me.rank<opp.rank) mine++; else if(me.rank>opp.rank) other++; else ties++;
    });
    return {mine, other, ties};
  };
  const seen=new Set();
  windowGames.forEach(g=>{
    const me=g.seats.find(s=>s.commander===cmdName);
    if(!me) return;
    g.seats.forEach(opp=>{
      if(opp===me) return;
      const label=otherOf(opp);
      if(!label || label===cmdName || seen.has(label)) return;
      seen.add(label);
      const before=recordOf(beforeGames,label), after=recordOf(sorted,label);
      if(after.mine+after.other+after.ties < CMD_MATCHUP_MIN) return;
      const statusOf=r=>(r.mine+r.other+r.ties===0)?null:(r.mine>r.other?'a':r.mine<r.other?'b':'tie');
      const bs=statusOf(before), as=statusOf(after);
      if(bs==null||as==null||bs===as) return;
      const di=dayIndexInfo(g);
      const stamp={type:'matchup', tagKey:'impact_tag_matchup', date:g.date, dayIndex:di&&di.index, dayTotal:di&&di.total};
      if(as==='tie'){
        events.push({...stamp, weight:5, html:t('impact_ev_rivalry_tie',{a:`<b>${esc(cmdName)}</b>`,b:`<b>${esc(label)}</b>`,rec:`${after.mine}-${after.other}`})});
      } else {
        const leader=as==='a'?cmdName:label, other=as==='a'?label:cmdName, ls=as==='a'?after.mine:after.other, os=as==='a'?after.other:after.mine;
        events.push({...stamp, weight:6, html:t('impact_ev_rivalry_flip',{leader:`<b>${esc(leader)}</b>`,other:`<b>${esc(other)}</b>`,rec:`${ls}-${os}`})});
      }
    });
  });
  return events;
}
function computeCommanderNews(cmdName){
  const sorted=gamesForYear().filter(g=>g.seats.some(s=>s.commander===cmdName)).slice().sort((a,b)=>{
    const da=a.date||'', db=b.date||'';
    if(da!==db) return da<db?1:-1;
    return (b.order||0)-(a.order||0);
  });
  if(!sorted.length) return null;
  const WINDOW=Math.min(8, sorted.length);
  const windowGames=sorted.slice(0, WINDOW);
  const windowSet=new Set(windowGames);
  const beforeGames=sorted.filter(g=>!windowSet.has(g));
  const events=[];
  // Tracks which windowGames already got a dedicated event (debut, first-win/loss, sweep,
  // notable pace, comeback) — anything left uncovered gets a plain Game Recap line further
  // down, so every game in the window shows up as SOMETHING. Added because most commanders
  // aren't played often, and a game as recent as last night was sometimes surfacing nothing at
  // all here if it didn't happen to trip one of the specific triggers.
  const coveredGames=new Set();

  // commander-level streak, independent of pilot — same 4-case split (hot/cold/snapped/
  // turnaround) that fixed the "both are red and green losing streaks" ambiguity in
  // Recent Impact, reused here rather than re-litigated.
  const streakOf=games=>{
    let curWin=0, curDry=0;
    games.slice().reverse().forEach(g=>{
      const me=g.seats.find(s=>s.commander===cmdName);
      if(me.rank===1){ curWin++; curDry=0; } else { curDry++; curWin=0; }
    });
    return {curWin,curDry};
  };
  const after=streakOf(sorted), before=streakOf(beforeGames);
  // these describe a running state "as of now" rather than one specific game, so they're
  // dated to the most recent game in the window (windowGames is newest-first).
  const latestDate=windowGames[0] && windowGames[0].date;
  if(after.curWin>=2){
    events.push({type:'streak-up', tagKey:'impact_tag_hot', weight:after.curWin, date:latestDate, html:t('cd_ev_streak_win',{n:after.curWin})});
  } else if(after.curDry>=2){
    events.push({type:'streak-down', tagKey:'impact_tag_cold', weight:after.curDry, date:latestDate, html:t('cd_ev_streak_dry',{n:after.curDry})});
  } else if(before.curWin>=2 && after.curWin<before.curWin){
    events.push({type:'streak-down', tagKey:'impact_tag_streak_end', weight:before.curWin, date:latestDate, html:t('cd_ev_streak_snap_win',{n:before.curWin})});
  } else if(before.curDry>=2 && after.curDry<before.curDry){
    events.push({type:'streak-up', tagKey:'impact_tag_turnaround', weight:before.curDry, date:latestDate, html:t('cd_ev_streak_snap_dry',{n:before.curDry})});
  }

  // pilot debuts + first win/first loss with this commander — identical tally mechanic to
  // Recent Impact's cmdTally, just keyed by player alone since the commander is fixed here.
  // Reuses the same scope-aware wording (ever/year/period) fixed there for the same reason.
  const scopeKind = customRange ? 'period' : (curYear==='all' ? 'ever' : 'year');
  const tally={};
  beforeGames.forEach(g=>{
    const me=g.seats.find(s=>s.commander===cmdName);
    const tk=tally[me.player]||(tally[me.player]={games:0,wins:0});
    tk.games++; if(me.rank===1)tk.wins++;
  });
  windowGames.slice().reverse().forEach(g=>{
    const me=g.seats.find(s=>s.commander===cmdName);
    const tk=tally[me.player]||(tally[me.player]={games:0,wins:0});
    const gamesBefore=tk.games, winsBefore=tk.wins;
    if(gamesBefore===0){
      const outcome = me.rank===1 ? t('impact_outcome_win') : t('impact_outcome_other',{rank:me.rank});
      // Same scope-honesty fix as first-win/first-loss below: "for the first time" overclaims
      // when a named year or custom range is active, since `sorted` is scoped to gamesForYear()
      // — a debut in the selected 2026 window isn't necessarily this pilot's first-ever game
      // with the commander, just their first one THIS period.
      const debutKey=scopeKind==='ever'?'cd_ev_debut':scopeKind==='year'?'cd_ev_debut_year':'cd_ev_debut_period';
      events.push({type:'commander', tagKey:'impact_tag_commander', weight:1, date:g.date,
        html:t(debutKey,{name:`<b>${esc(me.player)}</b>`,outcome,year:curYear})});
      coveredGames.add(g);
    } else if(winsBefore===0 && me.rank===1){
      const key=scopeKind==='ever'?'impact_ev_commander_first_win':scopeKind==='year'?'impact_ev_commander_first_win_year':'impact_ev_commander_first_win_period';
      events.push({type:'commander-first-win', tagKey:'impact_tag_first_win', weight:2, date:g.date,
        html:t(key,{name:`<b>${esc(me.player)}</b>`,commander:esc(cmdName),year:curYear})});
      coveredGames.add(g);
    } else if(winsBefore===gamesBefore && me.rank!==1){
      const key=scopeKind==='ever'?'impact_ev_commander_first_loss':scopeKind==='year'?'impact_ev_commander_first_loss_year':'impact_ev_commander_first_loss_period';
      events.push({type:'commander-first-loss', tagKey:'impact_tag_first_loss', weight:2, date:g.date,
        html:t(key,{name:`<b>${esc(me.player)}</b>`,commander:esc(cmdName),n:gamesBefore,year:curYear})});
      coveredGames.add(g);
    }
    tk.games++; if(me.rank===1)tk.wins++;
  });

  // Game Story (Clean Sweep / notable pace / early Sol Ring) — commander-specific wording, NOT
  // the pod-wide computeGameStory() templates. Those name every player who was beaten ("Mario
  // took down Marco, Tuan, and Dennis"), which reads as news about the WINNING PLAYER, not the
  // commander itself — on direct feedback that this feed should be "very commander specific".
  // Same underlying detection (cleanSweepWinner()/paceBucket()) restricted to games THIS
  // commander's pilot won, but the copy only ever names the pilot (needed context for a
  // multi-pilot commander) — never the other players at the table.
  const CD_SWEEP_KEYS=['cd_ev_sweep_1','cd_ev_sweep_2'];
  const CD_PACE_KEYS={reallyFast:'cd_ev_pace_reallyfast', fast:'cd_ev_pace_fast', long:'cd_ev_pace_long', veryLong:'cd_ev_pace_verylong'};
  windowGames.forEach(g=>{
    const me=g.seats.find(s=>s.commander===cmdName);
    if(!me || me.rank!==1) return;
    const isSweep=cleanSweepWinner(g)===me;
    const bucket=paceBucket(g.gametime);
    if(!isSweep && !bucket) return;
    const pick=arr=>arr[(g.num!=null?g.num:0)%arr.length];
    let html, type, tagKey;
    if(isSweep){
      html=t(pick(CD_SWEEP_KEYS),{name:`<b>${esc(me.player)}</b>`});
      if(bucket) html+=' '+t(GAME_STORY_PACE_ACCENT_KEYS[bucket],{mins:g.gametime});
      type='sweep'; tagKey='impact_tag_sweep';
    } else {
      html=t(CD_PACE_KEYS[bucket],{name:`<b>${esc(me.player)}</b>`,mins:g.gametime});
      type='pace'; tagKey=GAME_STORY_PACE_TAG[bucket];
    }
    if(me.sol===1) html+=' '+t('impact_ev_solring_accent');
    const di=dayIndexInfo(g);
    events.push({type, tagKey, weight:1, date:g.date, dayIndex:di&&di.index, dayTotal:di&&di.total, html});
    coveredGames.add(g);
  });

  // commander-vs-commander deck matchup shifts, and this commander's pilot vs opposing
  // PLAYERS — both via the shared commanderMatchupTrend() detector above. "Everything we have
  // about this commander" per direct request: deck matchups were previously only shown as
  // static best/worst callouts elsewhere on this page, never as a "just changed" moment.
  events.push(...commanderMatchupTrend(cmdName, sorted, beforeGames, windowGames, s=>s.commander));
  events.push(...commanderMatchupTrend(cmdName, sorted, beforeGames, windowGames, s=>s.player));

  // commander comeback — a pilot picks THIS specific commander back up after a real-world gap
  // (same COMEBACK_MIN_DAYS threshold as Recent Impact's pod-wide Comeback), reporting the
  // OUTCOME of that return game and which opposing commander was on the other side of it — on
  // direct feedback, "the pilot showed up again" alone isn't the story here, "did the dusty
  // deck still have it, and against what" is. Win → the runner-up's commander (the one they
  // beat most directly); loss → the winner's commander (the one that beat them). The gap is
  // reported in GAMES PLAYED BY THE POD in between, not weeks — on direct feedback that a
  // weeks count is a misleading yardstick when play frequency swings as wildly as this group's
  // does (1-21 games/month), the same reasoning ROLLING_WINDOW_GAMES was built on. The 28-day
  // trigger threshold itself stays time-based (a real "this deck's been on the shelf" gap).
  // Also requires COMEBACK_MIN_GAMES games to have actually happened in between — on direct
  // feedback that "Turns out 1 games of rust does matter" both had a grammar bug (singular
  // "game") AND overstated a 1-game gap as meaningful "rust" (raised from an initial 3 to 8 on
  // further feedback that 3 still felt too low for "dusted off"/"rust" framing to land). Below
  // that floor the game still shows up, just as a plain Game Recap instead of a dramatic
  // comeback. Five flavor variants each for win/loss (up from two) since a window with several
  // comebacks was repeating the same line 4-5 times.
  const COMEBACK_MIN_DAYS=28;
  const COMEBACK_MIN_GAMES=8;
  const COMEBACK_WIN_KEYS=['cd_ev_comeback_win_1','cd_ev_comeback_win_2','cd_ev_comeback_win_3','cd_ev_comeback_win_4','cd_ev_comeback_win_5'];
  const COMEBACK_LOSS_KEYS=['cd_ev_comeback_loss_1','cd_ev_comeback_loss_2','cd_ev_comeback_loss_3','cd_ev_comeback_loss_4','cd_ev_comeback_loss_5'];
  const podGames=gamesForYear();
  const lastSeenDate={};
  sorted.slice().reverse().forEach(g=>{
    if(!g.date) return;
    const me=g.seats.find(s=>s.commander===cmdName);
    const prev=lastSeenDate[me.player];
    const gapDays=prev!=null?Math.round((ymdToDate(g.date)-ymdToDate(prev))/86400000):null;
    if(gapDays!=null && gapDays>=COMEBACK_MIN_DAYS && windowSet.has(g)){
      const gamesBetween=podGames.filter(x=>x.date>prev && x.date<g.date).length;
      if(gamesBetween>=COMEBACK_MIN_GAMES){
        const pick=arr=>arr[(g.num!=null?g.num:0)%arr.length];
        const di=dayIndexInfo(g);
        let html;
        if(me.rank===1){
          // "rank===2" isn't reliable — ties can land nobody exactly there (e.g. two players
          // tied for 3rd, one alone at 4th, nobody at 2nd) — so pick whichever opponent finished
          // closest to the win instead, which always resolves to someone.
          const runnerUp=g.seats.filter(s=>s!==me).sort((a,b)=>a.rank-b.rank)[0];
          html=t(pick(COMEBACK_WIN_KEYS),{name:`<b>${esc(me.player)}</b>`,n:gamesBetween,opponent:esc(runnerUp?runnerUp.commander:'the table')});
        } else {
          const winner=g.seats.find(s=>s.rank===1);
          html=t(pick(COMEBACK_LOSS_KEYS),{name:`<b>${esc(me.player)}</b>`,n:gamesBetween,opponent:esc(winner?winner.commander:'the table')});
        }
        events.push({type:'comeback', tagKey:'impact_tag_comeback', weight:gapDays, date:g.date, dayIndex:di&&di.index, dayTotal:di&&di.total, html});
        coveredGames.add(g);
      }
    }
    lastSeenDate[me.player]=g.date;
  });

  // Game Recap — every remaining game in the window that didn't already earn a dedicated event
  // still gets a plain factual line, so nothing goes unmentioned. Added on direct feedback: a
  // low-frequency commander's game from last night was surfacing NOTHING here if it didn't
  // happen to trip one of the specific triggers above — which defeats the point of "what's new
  // with this commander". Lowest sort priority of any event type, since it's the fallback.
  windowGames.forEach(g=>{
    if(coveredGames.has(g)) return;
    const me=g.seats.find(s=>s.commander===cmdName);
    if(!me) return;
    const outcome = me.rank===1 ? t('impact_outcome_win') : t('impact_outcome_other',{rank:me.rank});
    const di=dayIndexInfo(g);
    events.push({type:'recap', tagKey:'impact_tag_recap', weight:0, date:g.date, dayIndex:di&&di.index, dayTotal:di&&di.total,
      html:t('cd_ev_recap',{name:`<b>${esc(me.player)}</b>`,outcome})});
  });

  // Sorted chronologically by the game each event is about (newest first), not grouped by
  // event type — same fix, and same reasoning, as Recent Impact's sort above: grouping by type
  // read oddly out of order once every event carried its own date. Type/weight is now only a
  // same-day tiebreaker.
  events.sort((a,b)=>{
    const da=a.date||'', db=b.date||'';
    if(da!==db) return da<db?1:-1;
    if((a.dayIndex||0)!==(b.dayIndex||0)) return (b.dayIndex||0)-(a.dayIndex||0);
    const order={sweep:5,matchup:5,comeback:4,'streak-up':3,'streak-down':3,pace:3,'commander-first-win':2,'commander-first-loss':2,commander:1,recap:0};
    if(order[a.type]!==order[b.type]) return order[b.type]-order[a.type];
    return b.weight-a.weight;
  });
  const dated=windowGames.filter(g=>g.date).map(g=>g.date).sort();
  return {n:WINDOW, total:sorted.length, events, from:dated[0]||null, to:dated[dated.length-1]||null};
}

let cdName=null;
function openCommanderDetail(name){ navigate('commander/'+encodeURIComponent(name)); }
function closeCommanderDetail(){ goBack('commanders'); }

/* ===== commander detail rendering ===== */
function renderCommanderDetail(){
  if(!cdName)return;
  const d=computeCommanderDetail(cdName);
  const cont=$('#commanderDetail');
  const backBtn=`<button class="md-back" id="cdBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>${t('cd_back')}</button>`;
  if(!d){
    cont.innerHTML=backBtn+`<div class="empty">—</div>`;
    $('#cdBack').addEventListener('click',closeCommanderDetail); return;
  }
  const wrCol=wrColor(d.winrate);

  // hero stat cards
  const stats=[
    [t('cd_games'), d.games, ''],
    [t('cd_winrate'), d.winrate+'%', `color:${wrCol}`],
    [t('cd_avgfinish'), d.avgrank, ''],
    [t('cd_pilots'), d.pilots.length, ''],
  ];
  const heroStats=stats.map(s=>`<div class="cd-stat"><div class="cd-stat-v" style="${s[2]}">${s[1]}</div><div class="cd-stat-l">${s[0]}</div></div>`).join('');

  // finish spread mini-bar
  const segColors={1:'var(--gold)',2:'#9aa97f',3:'#6b7d6f',4:'#3a4a40'};
  const segLabels={1:t('finish_1st'),2:t('finish_2nd'),3:t('finish_3rd'),4:t('finish_4th')};
  const finBar=[1,2,3,4].map(r=>{
    const pct=d.finTot?100*d.fin[r]/d.finTot:0;
    if(pct<=0)return'';
    return `<div class="fd-seg" style="width:${pct}%;background:${segColors[r]}" title="${segLabels[r]}: ${d.fin[r]}">${pct>=10?Math.round(pct)+'%':''}</div>`;
  }).join('');
  const finLegend=[1,2,3,4].map(r=>`<span class="fd-leg-item"><span class="fd-leg-sw" style="background:${segColors[r]}"></span>${segLabels[r]} <b style="color:var(--ink2)">${d.fin[r]}</b></span>`).join('');

  // vs each player rows (sorted best->worst already)
  const vsPlayerRows=d.vsPlayer.map(v=>{
    const col=v.pct>=55?'var(--win)':v.pct<=45?'var(--lose)':'var(--gold)';
    return `<div class="cd-vp-row">
      <span class="cd-vp-name">${v.player}</span>
      <div class="cd-vp-track"><div class="cd-vp-fill" style="width:${v.pct}%;background:${col}"></div></div>
      <span class="cd-vp-pct" style="color:${col}">${v.pct}%</span>
      <span class="cd-vp-rec">${v.ahead}–${v.behind}${v.ties?'–'+v.ties:''}</span>
    </div>`;
  }).join('');

  // best / worst player callouts — require a meaningful sample so 1-game outliers
  // don't headline. Threshold scales down if the commander has few games overall.
  const CALL_MIN = Math.min(5, Math.max(2, Math.round(d.games/8)));
  const eligible = d.vsPlayer.filter(v=>v.games>=CALL_MIN);
  const pool = eligible.length>=2 ? eligible : d.vsPlayer; // fall back if too few qualify
  const bestP = pool[0];
  const worstP = pool[pool.length-1];

  // pilots
  const pilotRows=d.pilots.map(p=>{
    const col=wrColor(p.winrate);
    return `<div class="cd-pilot-row">
      <span class="cd-pilot-name">${p.player}</span>
      <span class="cd-pilot-games">${p.games} ${t('cd_games').toLowerCase()}</span>
      <div class="cd-pilot-track"><div class="cd-pilot-fill" style="width:${Math.max(p.winrate,3)}%;background:${col}"></div></div>
      <span class="cd-pilot-wr" style="color:${col}">${p.winrate}%</span>
    </div>`;
  }).join('');

  // deck matchups: best few and worst few
  let deckMatchupHtml='';
  if(d.vsCmd.length){
    const best=d.vsCmd.slice(0,5);
    const worst=d.vsCmd.slice(-5).reverse().filter(x=>!best.includes(x));
    const row=v=>{
      const col=v.pct>=55?'var(--win)':v.pct<=45?'var(--lose)':'var(--gold)';
      return `<div class="cd-dm-row">
        <span class="cd-dm-name">${v.cmd}</span>
        <span class="cd-dm-pct" style="color:${col}">${v.pct}%</span>
        <span class="cd-dm-rec">${v.ahead}–${v.behind}${v.ties?'–'+v.ties:''}</span>
        <span class="cd-dm-g">${v.games}${t('md_games_short')}</span>
      </div>`;
    };
    deckMatchupHtml=`
      <div class="cd-dm-cols">
        <div class="cd-dm-col">
          <div class="cd-dm-hd up">▲ ${t('cd_best_vs')}</div>
          ${best.map(row).join('')}
        </div>
        <div class="cd-dm-col">
          <div class="cd-dm-hd down">▼ ${t('cd_worst_vs')}</div>
          ${worst.length?worst.map(row).join(''):`<div class="cd-dm-empty">—</div>`}
        </div>
      </div>`;
  } else {
    deckMatchupHtml=`<div class="empty">${t('cd_no_matchups')}</div>`;
  }

  const extraStats=[];
  if(d.solRate!=null) extraStats.push(`${t('cd_solrate')}: <b>${d.solRate}%</b>`);
  if(d.avgSeat!=null) extraStats.push(`${t('cd_seat')}: <b>${d.avgSeat}</b>`);

  // color theming (only if we have color data for this commander)
  const cdCols=commanderColors(d.name);
  const accent=colorAccentBar(cdCols) || `linear-gradient(90deg,${wrCol},var(--gold))`;
  const tint=colorHeaderTint(cdCols);
  const tintLayer = tint ? `<div class="cd-tint" style="background:${tint}"></div>` : '';

  // commander news feed
  const news=computeCommanderNews(d.name);
  let newsHtml='';
  if(news){
    const focusTxt = news.total>news.n ? t('cd_news_focus_partial',{n:news.n,total:news.total}) : t('cd_news_focus_all',{n:news.n});
    const focusHtml = news.from&&news.to
      ? `<span class="rg-focus-main">${focusTxt}</span><span class="rg-focus-dates">${localizedGameDate(news.from)} – ${localizedGameDate(news.to)}</span>`
      : `<span class="rg-focus-main">${focusTxt}</span>`;
    const defaultTagKey={commander:'impact_tag_commander'};
    const eventsHtml = news.events.length
      ? news.events.map(e=>`<div class="impact-event ${e.type}">
          <span class="impact-event-tag">${t(e.tagKey||defaultTagKey[e.type])}</span>
          <span class="impact-event-text">${e.html}</span>
          ${e.date?`<span class="impact-event-date">${localizedGameDate(e.date)}</span>`:''}
        </div>`).join('')
      : `<div class="empty">${t('cd_news_quiet')}</div>`;
    newsHtml=`<div class="cd-card" style="margin-top:18px;margin-bottom:18px">
      <div class="cd-card-hd">${t('cd_news_title')}</div>
      <div class="cd-card-sub">${t('cd_news_sub')}</div>
      <div class="rg-focus" style="margin-top:2px">${focusHtml}</div>
      <div class="impact-feed">${eventsHtml}</div>
    </div>`;
  }

  cont.innerHTML=`
    ${backBtn}
    <div class="cd-header${cdCols.length?' themed':''}">
      ${tintLayer}
      <div class="cd-topline" style="background:${accent}"></div>
      <div class="cd-title-row">
        <h2 class="cd-name">${d.name}</h2>
        ${colorPips(d.name,16)}
        ${extraStats.length?`<div class="cd-extra">${extraStats.join(' &nbsp;·&nbsp; ')}</div>`:''}
      </div>
      <div class="cd-stats">${heroStats}</div>
      <div class="cd-pilotline">${t('cd_piloted_by')}: ${d.pilots.map(p=>`<span class="cd-pilot-chip">${p.player} <b>${p.games}</b></span>`).join('')}</div>
    </div>

/* ===== player detail computation ===== */
/* ===== The Presence Effect =====
   Does a player's OWN win rate shift depending on who ELSE is at the table?
   Distinct from head-to-head (which measures who finishes ahead of whom): this
   splits a player's games into "opponent X was seated" vs "opponent X was not",
   and compares win rate between the two groups. Both groups need
   PRESENCE_MIN_GAMES to qualify (small rosters mean the "without" bucket is
   rarely empty, but noise is still a real risk with ~5-7 core players). This is
   a correlation, not a causal claim — copy in the UI should stay honest about
   that (other players present differ between the two buckets too). */
function computePresenceEffectFor(playerName, games){
  games = games || gamesForYear();
  const myGames=[];
  for(const g of games){ if(g.seats.some(s=>s.player===playerName)) myGames.push(g); }
  const opponents = new Set();
  myGames.forEach(g=>g.seats.forEach(s=>{ if(s.player!==playerName) opponents.add(s.player); }));
  const acc={};
  opponents.forEach(o=>acc[o]={withG:0,withW:0,withoutG:0,withoutW:0});
  for(const g of myGames){
    const me=g.seats.find(s=>s.player===playerName);
    const present=new Set(g.seats.map(s=>s.player));
    opponents.forEach(o=>{
      const b=acc[o];
      if(present.has(o)){ b.withG++; if(me.rank===1)b.withW++; }
      else { b.withoutG++; if(me.rank===1)b.withoutW++; }
    });
  }
  const rows=[];
  opponents.forEach(o=>{
    const b=acc[o];
    if(b.withG<PRESENCE_MIN_GAMES || b.withoutG<PRESENCE_MIN_GAMES) return;
    const withWR=+(100*b.withW/b.withG).toFixed(1);
    const withoutWR=+(100*b.withoutW/b.withoutG).toFixed(1);
    rows.push({opp:o, withN:b.withG, withWR, withoutN:b.withoutG, withoutWR,
      delta:+(withWR-withoutWR).toFixed(1)});
  });
  rows.sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta));
  return rows;
}
// Pod-wide: every qualifying (player, opponent) pair across the roster, ranked by
// |delta| so the most dramatic presence effects in the whole group surface first.
// Takes explicit games/roster so callers can scope it to the Insights lens.
function computePresenceEffectAll(games, roster){
  games = games || gamesForYear();
  roster = (roster && roster.length) ? roster : (CORE.length?CORE:(S?S.players.map(p=>p.name):[]));
  const out=[];
  roster.forEach(p=>{
    computePresenceEffectFor(p, games).forEach(r=>out.push({player:p, ...r}));
  });
  out.sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta));
  return out;
}

function computePlayerDetail(playerName){
  const games=gamesForYear();
  let g=0,w=0,rs=0,rn=0, solWith=0,solSeats=0;
  // Sol Ring win-rate split: games where THIS player landed a T1 Sol Ring vs not.
  // solW.g/solW.w = with a T1 Sol Ring; solX.g/solX.w = without (both only over
  // games where the sol column was actually recorded for this player).
  let solW_g=0,solW_w=0, solX_g=0,solX_w=0;
  const fin={1:0,2:0,3:0,4:0};
  const decks={};       // commander -> {g,w,rs,timeSum,timeN}
  const vsPlayer={};    // opponent -> {g,ahead,behind,ties}
  const seat={};        // turn -> {g,w}
  for(const gm of games){
    const me=gm.seats.find(s=>s.player===playerName);
    if(!me) continue;
    g++; if(me.rank===1)w++; rs+=me.rank; rn++;
    if(me.rank>=1&&me.rank<=4)fin[me.rank]++;
    if(me.sol!=null){
      solSeats++;
      if(me.sol===1){ solWith++; solW_g++; if(me.rank===1)solW_w++; }
      else { solX_g++; if(me.rank===1)solX_w++; }
    }
    if(me.turn){const st=seat[me.turn]||(seat[me.turn]={g:0,w:0}); st.g++; if(me.rank===1)st.w++;}
    const dk=decks[me.commander]||(decks[me.commander]={g:0,w:0,rs:0,timeSum:0,timeN:0,sweeps:0});
    dk.g++; if(me.rank===1)dk.w++; dk.rs+=me.rank;
    if(gm.gametime!=null){dk.timeSum+=gm.gametime; dk.timeN++;}
    if(cleanSweepWinner(gm)===me) dk.sweeps++;
    for(const o of gm.seats){
      if(o.player===playerName) continue;
      const vp=vsPlayer[o.player]||(vsPlayer[o.player]={g:0,ahead:0,behind:0,ties:0});
      vp.g++; if(me.rank<o.rank)vp.ahead++; else if(me.rank>o.rank)vp.behind++; else vp.ties++;
    }
  }
  if(g===0) return null;
  const deckArr=Object.entries(decks).map(([commander,d])=>({commander,games:d.g,wins:d.w,
    winrate:+(100*d.w/d.g).toFixed(1), avgrank:+(d.rs/d.g).toFixed(2),
    avgtime:d.timeN?Math.round(d.timeSum/d.timeN):null, sweeps:d.sweeps})).sort((a,b)=>b.games-a.games||b.winrate-a.winrate);
  const RIVAL_DISPLAY_MIN=15; // hide opponents faced fewer than this many times (too noisy)
  let vsArr=Object.entries(vsPlayer).map(([player,d])=>({player,games:d.g,ahead:d.ahead,behind:d.behind,ties:d.ties,
    pct:+(100*d.ahead/d.g).toFixed(0)})).sort((a,b)=>b.pct-a.pct||b.games-a.games);
  const vsArrFiltered=vsArr.filter(v=>v.games>=RIVAL_DISPLAY_MIN);
  // if filtering leaves nothing (e.g. a narrow date range), fall back to all so the section isn't empty
  vsArr = vsArrFiltered.length>=1 ? vsArrFiltered : vsArr;
  const seatArr=[1,2,3,4].map(t=>{const d=seat[t]||{g:0,w:0};return {seat:t,games:d.g,wins:d.w,wr:d.g?+(100*d.w/d.g).toFixed(0):null};}).filter(s=>s.games>0);
  // best seat (min 5 games to be meaningful)
  const seatEligible=seatArr.filter(s=>s.games>=5);
  const bestSeat=(seatEligible.length?seatEligible:seatArr).slice().sort((a,b)=>b.wr-a.wr)[0];

  // YEAR ON YEAR — always across ALL years (ignores current filter)
  const allYears=[...new Set(ALL_GAMES.map(gm=>gm.date&&gm.date.slice(0,4)).filter(Boolean))].sort();
  const yoy=allYears.map(y=>{
    let yg=0,yw=0,yrs=0; const yf={1:0,2:0};
    ALL_GAMES.filter(gm=>gm.date&&gm.date.slice(0,4)===y).forEach(gm=>{
      const me=gm.seats.find(s=>s.player===playerName);
      if(!me)return; yg++; if(me.rank===1)yw++; yrs+=me.rank;
      if(me.rank===1)yf[1]++; if(me.rank===2)yf[2]++;
    });
    return {year:y, games:yg, wins:yw,
      winrate: yg?+(100*yw/yg).toFixed(1):null,
      avgrank: yg?+(yrs/yg).toFixed(2):null,
      podium: yg?+(100*(yf[1]+yf[2])/yg).toFixed(0):null};
  }).filter(r=>r.games>0);

  return {
    name:playerName, games:g, wins:w, winrate:+(100*w/g).toFixed(1), avgrank:+(rs/rn).toFixed(2),
    fin, finTot:fin[1]+fin[2]+fin[3]+fin[4],
    solRate: solSeats?+(100*solWith/solSeats).toFixed(0):null,
    sol: solSeats ? {
      seats: solSeats,
      withN: solW_g, withWr: solW_g?+(100*solW_w/solW_g).toFixed(0):null,
      withoutN: solX_g, withoutWr: solX_g?+(100*solX_w/solX_g).toFixed(0):null,
      rate: +(100*solWith/solSeats).toFixed(0)
    } : null,
    bestSeat, decks:deckArr, vsPlayer:vsArr, seats:seatArr, yoy,
    colors: computePlayerColorProfile(deckArr),
    presence: computePresenceEffectFor(playerName, games)
  };
}

// Aggregate a player's decks into a color profile: per-color games/wins (a deck counts
// toward each color in its identity) and per-exact-combination tallies. Uses the deck
// list already computed for this player (so it respects the active year filter).
function computePlayerColorProfile(deckArr){
  const byColor={}; COLOR_ORDER.concat('C').forEach(c=>byColor[c]={g:0,w:0});
  const weighted={}; COLOR_ORDER.concat('C').forEach(c=>weighted[c]=0); // fractional share
  const byCombo={};   // combo key (e.g. "UB", "WUBRG", "C") -> {cols, g, w}
  let known=0;        // deck-games with known colors
  for(const dk of deckArr){
    const cols=commanderColors(dk.commander);
    if(!cols.length) continue;
    known+=dk.games;
    cols.forEach(c=>{ byColor[c].g+=dk.games; byColor[c].w+=dk.wins; });
    // weighted: each game contributes 1 total, split evenly across its colors
    const share=dk.games/cols.length;
    cols.forEach(c=>{ weighted[c]+=share; });
    const key=cols.join('');
    const cb=byCombo[key]||(byCombo[key]={cols, g:0, w:0});
    cb.g+=dk.games; cb.w+=dk.wins;
  }
  if(known===0) return null;
  const colorRows=COLOR_ORDER.concat('C')
    .map(c=>({c, g:byColor[c].g, w:byColor[c].w,
      wr:byColor[c].g?+(100*byColor[c].w/byColor[c].g).toFixed(1):null,
      pct:+(100*byColor[c].g/known).toFixed(1)}))   // share of games this color appears in
    .filter(r=>r.g>0);
  // weighted color share: fraction of the player's total color-weight per color (sums to 100%)
  const weightRows=COLOR_ORDER.concat('C')
    .map(c=>({c, share:weighted[c], pct:+(100*weighted[c]/known).toFixed(1)}))
    .filter(r=>r.share>0.0001)
    .sort((a,b)=>b.share-a.share);
  // favorite = most-played color; least = fewest games among colors actually played
  const byGames=colorRows.slice().sort((a,b)=>b.g-a.g || (b.wr||0)-(a.wr||0));
  const favorite = byGames[0] || null;
  const least = byGames.length>1 ? byGames[byGames.length-1] : null;
  const combos=Object.values(byCombo).map(cb=>({cols:cb.cols, key:cb.cols.join(''), g:cb.g, w:cb.w,
    wr:cb.g?+(100*cb.w/cb.g).toFixed(1):null,
    pct:+(100*cb.g/known).toFixed(1)}))            // share of total games (sums to 100%)
    .sort((a,b)=>b.g-a.g || (b.wr||0)-(a.wr||0));
  const mostCombo = combos[0] || null;
  const leastCombo = combos.length>1 ? combos[combos.length-1] : null;
  return {colorRows:byGames, weightRows, combos, favorite, least, mostCombo, leastCombo, knownGames:known,
    distinctCombos:combos.length};
}

// Rolling win-rate window: last N games played, not a calendar window — some months the
// group plays a lot, some barely at all, so a fixed game count keeps the sample size (and
// therefore the noise level) consistent instead of swinging with how busy a given month was.
// Adjustable at runtime via the slider on the Trends chart (#rwSlider) while the group settles
// on a number; defaults to 15. Charts plot one point per GAME (not per calendar month/bucket)
// so the x-axis matches the "last N games" unit the window itself is defined in — a player
// who hasn't played recently just gets no new point, rather than a stale value smeared across
// a month they sat out. ROLLING_MIN_GAMES is a floor (5) on how many games must be in the
// window before a point plots; capped to N itself so small windows (e.g. N=1..4) still work.
let ROLLING_WINDOW_GAMES = 15;
const ROLLING_MIN_GAMES = 5;

/* personal win-rate trend (rolling last N games) for one player, current year subset —
   one point per game THIS PLAYER played, in order */
function computePlayerTrend(playerName){
  const games=gamesForYear().filter(g=>g.date && g.seats.some(s=>s.player===playerName))
    .sort((a,b)=>a.date<b.date?-1:1);
  if(games.length<2) return null;
  const minGames=Math.min(ROLLING_WINDOW_GAMES, ROLLING_MIN_GAMES);
  const hist=[];
  const series=games.map(g=>{
    const me=g.seats.find(s=>s.player===playerName);
    hist.push(me.rank===1);
    const win=hist.slice(-ROLLING_WINDOW_GAMES);
    return win.length>=minGames ? Math.round(100*win.filter(Boolean).length/win.length) : null;
  });
  return {n:games.length, series, dateAt:i=>games[i].date};
}

/* ===== chart data computations (use current year subset) ===== */

/* Compute a tidy y-axis range from the actual plotted values so the chart
   fills the vertical space instead of always spanning 0-100%. Returns
   {lo, hi, ticks:[...]} with gridlines at nice round numbers. */
function niceAxis(values){
  const vals = values.filter(v=>v!=null && !isNaN(v));
  if(!vals.length) return {lo:0, hi:100, ticks:[0,25,50,75,100]};
  let mn=Math.min(...vals), mx=Math.max(...vals);
  if(mn===mx){ mn=Math.max(0,mn-10); mx=Math.min(100,mx+10); } // flat line -> give it room
  const span=mx-mn;
  const pad=Math.max(4, span*0.15);            // ~15% headroom each side
  let lo=Math.max(0, mn-pad);
  let hi=Math.min(100, mx+pad);
  // round outward to a clean step
  const step = span<=20 ? 5 : 10;
  lo=Math.floor(lo/step)*step;
  hi=Math.ceil(hi/step)*step;
  if(hi-lo<step) hi=lo+step;                    // guarantee at least one interval
  if(hi>100) hi=100;
  if(lo<0) lo=0;
  // build ticks
  const ticks=[];
  for(let v=lo; v<=hi+0.001; v+=step) ticks.push(Math.round(v));
  return {lo, hi, ticks};
}

const PLAYER_COLORS = ['#d9b25a','#3f9b54','#3a7bd5','#d6442f','#7a5b8c','#c98a3a','#5bbf8a'];
// Stable color per player: assigned once from the full all-time roster (sorted by total
// games desc) so a player's color never changes when the year/date filter changes.
let PLAYER_COLOR_MAP=null;
function buildPlayerColorMap(){
  const totals={};
  (ALL_GAMES||[]).forEach(g=>g.seats.forEach(s=>{ totals[s.player]=(totals[s.player]||0)+1; }));
  const ordered=Object.keys(totals).sort((a,b)=> totals[b]-totals[a] || a.localeCompare(b));
  PLAYER_COLOR_MAP={};
  ordered.forEach((p,i)=>{ PLAYER_COLOR_MAP[p]=PLAYER_COLORS[i % PLAYER_COLORS.length]; });
}
function playerColor(name){
  if(!PLAYER_COLOR_MAP) buildPlayerColorMap();
  return (PLAYER_COLOR_MAP && PLAYER_COLOR_MAP[name]) || PLAYER_COLORS[0];
}

function computeTrend(mode){ // mode: 'rolling' | 'career'
  const games = insG().filter(g=>g.date).sort((a,b)=>a.date<b.date?-1:1);
  if(!games.length) return null;
  const players=insR().slice();
  const series={};
  players.forEach(p=>series[p]=[]);
  if(mode==='career'){
    // cumulative average -> still one point per calendar month, no window-size mismatch to fix
    const months=[...new Set(games.map(g=>g.date.slice(0,7)))].sort();
    if(months.length<2) return null;
    const cum={}; players.forEach(p=>cum[p]={g:0,w:0});
    months.forEach(m=>{
      games.filter(g=>g.date.slice(0,7)===m).forEach(g=>g.seats.forEach(s=>{
        if(cum[s.player]){cum[s.player].g++; if(s.rank===1)cum[s.player].w++;}}));
      players.forEach(p=>{const d=cum[p]; series[p].push(d.g?Math.round(100*d.w/d.g):null);});
    });
    return {n:months.length, players, series, dateAt:i=>months[i]+'-15'};
  }
  // rolling: one point per GAME in scope. A player not in a given game gets a null (gap) at
  // that index instead of a carried-forward stale value.
  if(games.length<2) return null;
  const minGames=Math.min(ROLLING_WINDOW_GAMES, ROLLING_MIN_GAMES);
  const hist={}; players.forEach(p=>hist[p]=[]);
  games.forEach(g=>{
    const inGame=new Set(g.seats.map(s=>s.player));
    g.seats.forEach(s=>{ if(hist[s.player]) hist[s.player].push(s.rank===1); });
    players.forEach(p=>{
      if(!inGame.has(p)){ series[p].push(null); return; }
      const win=hist[p].slice(-ROLLING_WINDOW_GAMES);
      series[p].push(win.length>=minGames ? Math.round(100*win.filter(Boolean).length/win.length) : null);
    });
  });
  return {n:games.length, players, series, dateAt:i=>games[i].date};
}

function computeFinishDist(){
  const games=insG();
  const fin={};
  games.forEach(g=>g.seats.forEach(s=>{
    fin[s.player]=fin[s.player]||{1:0,2:0,3:0,4:0,tot:0};
    if(s.rank>=1&&s.rank<=4){fin[s.player][s.rank]++; fin[s.player].tot++;}
  }));
  return CORE.map(p=>{const d=fin[p]||{1:0,2:0,3:0,4:0,tot:0};
    return {player:p, c1:d[1],c2:d[2],c3:d[3],c4:d[4],tot:d.tot,
      p1:d.tot?100*d[1]/d.tot:0,p2:d.tot?100*d[2]/d.tot:0,p3:d.tot?100*d[3]/d.tot:0,p4:d.tot?100*d[4]/d.tot:0};
  }).filter(x=>x.tot>0);
}

function computeTurnOrder(){
  const games=insG();
  const turn={};
  let total=0;
  games.forEach(g=>g.seats.forEach(s=>{if(s.turn){turn[s.turn]=turn[s.turn]||{g:0,w:0};turn[s.turn].g++;if(s.rank===1)turn[s.turn].w++;total++;}}));
  const rows=[1,2,3,4].map(seat=>{const d=turn[seat]||{g:0,w:0};
    return {seat, games:d.g, wins:d.w, wr:d.g?+(100*d.w/d.g).toFixed(1):0};}).filter(r=>r.games>0);
  return {rows, total};
}

function computeSolRing(){
  const games=insG();
  let w1={g:0,w:0}, w0={g:0,w:0};
  games.forEach(g=>g.seats.forEach(s=>{
    if(s.sol===1){w1.g++; if(s.rank===1)w1.w++;}
    else if(s.sol===0){w0.g++; if(s.rank===1)w0.w++;}
  }));
  const totSeats=w1.g+w0.g;
  return {
    withWr: w1.g?+(100*w1.w/w1.g).toFixed(1):0, withG:w1.g,
    withoutWr: w0.g?+(100*w0.w/w0.g).toFixed(1):0, withoutG:w0.g,
    rate: totSeats?+(100*w1.g/totSeats).toFixed(1):0,
    hasData: totSeats>0
  };
}


/* ===== chart rendering (SVG, no libraries) ===== */
let trendMode='rolling';

function renderTrends(){
  // toggle buttons state + hints
  document.querySelectorAll('#trendToggle button').forEach(b=>b.classList.toggle('on',b.dataset.tm===trendMode));
  const hint=$('#trendHint'); if(hint) hint.textContent = trendMode==='rolling'?t('trend_rolling_hint',{n:ROLLING_WINDOW_GAMES}):t('trend_career_hint');
  const rwWrap=$('#rwSliderWrap'); if(rwWrap) rwWrap.style.display = trendMode==='rolling'?'flex':'none';

  const data=computeTrend(trendMode);
  const host=$('#trendChart');
  if(!data){host.innerHTML=`<div class="empty">${t('trend_no_data')}</div>`; renderTrendLegend(null); return;}

  const W=860, H=380, padL=44, padR=20, padT=20, padB=54;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const n=data.n;
  const xAt=i=> padL + (n<=1?plotW/2:(i/(n-1))*plotW);
  // auto-scale the y-axis to the data so lines fill the chart
  const allVals=[]; data.players.forEach(p=>data.series[p].forEach(v=>{ if(v!=null) allVals.push(v); }));
  const ax=niceAxis(allVals);
  const yAt=v=> padT + (1-(v-ax.lo)/(ax.hi-ax.lo))*plotH;

  let grid='';
  ax.ticks.forEach(v=>{
    const y=yAt(v);
    grid+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--line)" stroke-width="1" ${v===ax.lo?'':'stroke-dasharray="2 4"'}/>`;
    grid+=`<text x="${padL-8}" y="${y+4}" text-anchor="end" fill="var(--ink3)" font-size="11" font-family="JetBrains Mono">${v}%</text>`;
  });

  // x labels (show ~6 evenly); dateAt(i) is a real game date in rolling mode, a mid-month
  // stand-in in career mode
  let xlabels='';
  const step=Math.max(1,Math.ceil(n/6));
  for(let i=0;i<n;i+=step){
    const [y,mo]=data.dateAt(i).split('-');
    const lbl=new Date(y,mo-1).toLocaleString(lang,{month:'short',year:'2-digit'});
    xlabels+=`<text x="${xAt(i)}" y="${H-padB+20}" text-anchor="middle" fill="var(--ink3)" font-size="10.5" font-family="JetBrains Mono">${lbl}</text>`;
  }

  // lines per player (skip null gaps)
  let paths='';
  data.players.forEach(p=>{
    const col=playerColor(p);
    const pts=data.series[p].map((v,i)=>({v,i})).filter(o=>o.v!=null);
    if(pts.length<2) return;
    let d='';
    pts.forEach((o,k)=>{ d+=(k===0?'M':'L')+xAt(o.i)+' '+yAt(o.v); });
    paths+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.92"/>`;
    // end dot
    const last=pts[pts.length-1];
    paths+=`<circle cx="${xAt(last.i)}" cy="${yAt(last.v)}" r="3.5" fill="${col}"/>`;
  });

  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" class="trend-svg" preserveAspectRatio="xMidYMid meet">${grid}${paths}${xlabels}</svg>`;
  renderTrendLegend(data.players);
}

/* ===== Commander choices over time (Player Profile) =====
   100%-stacked area of THIS PLAYER's pick share per quarter, top N commanders by their
   own total games + an "Other" catch-all. Started as a pod-wide Insights chart, but with
   90+ distinct commanders in the group "Other" swallowed almost everything — moved to
   Player Profile instead, where a player's own deck count (usually well under META_TOP_N)
   makes the breakdown actually mean something. Scoped to gamesForYear() like the rest of
   Player Profile (Player Profile isn't part of the Insights lens, so no insG() here). */
const META_TOP_N = 7;
const META_PALETTE = ['#d9b25a','#4aa963','#3a7bd5','#d6442f','#b78fe0','#5fd0c8','#e0955f'];
const META_OTHER_COLOR = '#5a6a60';
function computePlayerCommanderMeta(playerName, games){
  games = games || gamesForYear();
  const buckets={}, order=[], totalByCmd={};
  games.forEach(g=>{
    if(!g.date) return;
    const me=g.seats.find(s=>s.player===playerName);
    if(!me) return;
    const [y,mo]=g.date.split('-');
    const q='Q'+(Math.floor((+mo-1)/3)+1);
    const key=`${y} ${q}`;
    if(!buckets[key]){ buckets[key]={cmds:{}, total:0}; order.push(key); }
    buckets[key].cmds[me.commander]=(buckets[key].cmds[me.commander]||0)+1;
    buckets[key].total++;
    totalByCmd[me.commander]=(totalByCmd[me.commander]||0)+1;
  });
  order.sort();
  const topCmds=Object.entries(totalByCmd).sort((a,b)=>b[1]-a[1]).slice(0,META_TOP_N).map(e=>e[0]);
  const series=topCmds.concat(['__other__']);
  const rows=order.map(key=>{
    const b=buckets[key];
    const shares=series.map(cmd=>{
      if(cmd==='__other__'){
        const topSum=topCmds.reduce((s,c)=>s+(b.cmds[c]||0),0);
        return b.total? 100*(b.total-topSum)/b.total : 0;
      }
      return b.total? 100*(b.cmds[cmd]||0)/b.total : 0;
    });
    return {key, total:b.total, shares};
  });
  return {rows, series};
}
// Pure markup builder (no DOM writes) so it can be embedded straight into
// renderPlayerDetail's template string, same pattern as the personal trend chart.
function commanderMetaChartHtml(data){
  const {rows, series}=data;
  if(rows.length<2) return '';
  const W=820, H=240, padL=40, padR=16, padT=14, padB=30;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const n=rows.length;
  const xAt=i=> padL+(n<=1?plotW/2:(i/(n-1))*plotW);
  const yAt=pct=> padT+(1-pct/100)*plotH;

  let grid='';
  [0,50,100].forEach(v=>{
    const y=yAt(v);
    grid+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--line)" stroke-width="1" ${v===0?'':'stroke-dasharray="2 4"'}/>`;
    grid+=`<text x="${padL-8}" y="${y+4}" text-anchor="end" fill="var(--ink3)" font-size="10.5" font-family="JetBrains Mono">${v}%</text>`;
  });

  let running=rows.map(()=>0), paths='';
  series.forEach((cmd,si)=>{
    const bottomPts=rows.map((r,i)=>running[i]);
    const topPts=rows.map((r,i)=>running[i]+r.shares[si]);
    running=topPts;
    let d='M'+xAt(0)+','+yAt(bottomPts[0]);
    for(let i=1;i<n;i++) d+=' L'+xAt(i)+','+yAt(bottomPts[i]);
    for(let i=n-1;i>=0;i--) d+=' L'+xAt(i)+','+yAt(topPts[i]);
    d+=' Z';
    const color=cmd==='__other__'?META_OTHER_COLOR:META_PALETTE[si%META_PALETTE.length];
    const label=cmd==='__other__'?t('meta_other'):esc(cmd);
    paths+=`<path d="${d}" fill="${color}" opacity=".88" stroke="var(--bg)" stroke-width="1"><title>${label}</title></path>`;
  });

  const step=Math.max(1,Math.ceil(n/8));
  let xl='';
  for(let i=0;i<n;i+=step){
    xl+=`<text x="${xAt(i)}" y="${H-padB+16}" text-anchor="middle" fill="var(--ink3)" font-size="10" font-family="JetBrains Mono">${rows[i].key}</text>`;
  }

  const legend=series.map((cmd,si)=>{
    const color=cmd==='__other__'?META_OTHER_COLOR:META_PALETTE[si%META_PALETTE.length];
    const label=cmd==='__other__'?t('meta_other'):cmd;
    return `<span class="tl-item${cmd==='__other__'?'':' meta-leg-click'}" ${cmd==='__other__'?'':`data-cmd="${esc(cmd)}"`}><span class="tl-dot" style="background:${color}"></span>${esc(label)}</span>`;
  }).join('');

  return `<svg viewBox="0 0 ${W} ${H}" class="trend-svg" preserveAspectRatio="xMidYMid meet">${grid}${paths}${xl}</svg>
    <div class="trend-legend" style="margin-top:14px">${legend}</div>`;
}

/* ===== Quirky player tags (pod-wide superlatives) ===== */
// Each tag is awarded to ONE player (the extreme on some dimension), over the active
// year filter. Returns { playerName: [ {key, cls} ] }. Renders on leaderboard + detail.
let _tagCache=null;
// Core tag logic, parameterized on a games array so it can run either on the
// filter-scoped games (podium/detail chips) or on a specific year / all-time
// slice (the Compare tags matrix). `minGames` overrides the eligibility floor
// (defaults to MIN_TAG_GAMES so existing callers are unchanged); the Compare
// matrix raises it to keep tiny-sample guests from sweeping the superlatives.
// Returns { player -> [{key,cls}] }.
function computeTagsForGames(games, minGames){
  if(!games||!games.length) return {};
  const floor = (minGames==null) ? MIN_TAG_GAMES : minGames;
  const P={};
  const ensure=p=>P[p]||(P[p]={g:0,w:0,pod:0,sol:0,soln:0,gt:0,gtn:0,decks:{},sweeps:0});
  for(const gm of games){
    const sweepWinner=cleanSweepWinner(gm);
    for(const s of gm.seats){
      const p=ensure(s.player);
      p.g++; if(s.rank===1)p.w++; if(s.rank<=2)p.pod++;
      if(s.sol!=null){p.soln++; if(s.sol===1)p.sol++;}
      if(gm.gametime!=null){p.gt+=gm.gametime; p.gtn++;}
      p.decks[s.commander]=(p.decks[s.commander]||0)+1;
      if(sweepWinner===s) p.sweeps++;
    }
  }
  const players=Object.keys(P).filter(p=>P[p].g>=floor);
  // sub-floor participants become "Guest" instead of silently tag-less
  const guests={}; Object.keys(P).forEach(p=>{ if(P[p].g<floor) guests[p]=[{key:'tag_guest', cls:'guest'}]; });
  if(!players.length) return guests;
  players.forEach(p=>{const o=P[p];
    o.wr=100*o.w/o.g; o.podpct=100*o.pod/o.g;
    o.solrate=o.soln? 100*o.sol/o.soln : null;
    o.avgGt=o.gtn? o.gt/o.gtn : null;
    o.distinct=Object.keys(o.decks).length;
    o.topPct=100*Math.max(...Object.values(o.decks))/o.g;
  });
  const streaks=computeStreaksForGames(games);
  const byName={}; streaks.forEach(s=>byName[s.player]=s);

  const tags={}; players.forEach(p=>tags[p]=[]);
  const award=(key,cls,player)=>{ if(player&&tags[player]) tags[player].push({key,cls}); };
  const argmax=(fn,elig)=>{let best=null,bp=null;(elig||players).forEach(p=>{const v=fn(P[p],p);if(v==null)return;if(best==null||v>best){best=v;bp=p;}});return bp;};
  const argmin=(fn,elig)=>{let best=null,bp=null;(elig||players).forEach(p=>{const v=fn(P[p],p);if(v==null)return;if(best==null||v<best){best=v;bp=p;}});return bp;};

  award('tag_endboss','endboss', argmax(o=>o.wr));
  award('tag_badluck','badluck', argmin(o=>o.wr));
  award('tag_grinder','grinder', argmax(o=>o.g));
  award('tag_bench','bench', argmin(o=>o.g));
  award('tag_podium','podium', argmax(o=>o.podpct));
  award('tag_solking','solking', argmax(o=>o.solrate!=null?o.solrate:null));
  award('tag_brewer','brewer', argmax(o=>o.distinct));
  award('tag_onetrick','onetrick', argmax(o=>o.topPct));
  const timed=players.filter(p=>P[p].avgGt!=null);
  if(timed.length>1){
    award('tag_slowpoke','slowpoke', argmax(o=>o.avgGt, timed));
    award('tag_speed','speed', argmin(o=>o.avgGt, timed));
  }
  award('tag_streaker','streaker', argmax((_,p)=>byName[p]?byName[p].bestWin:null));
  award('tag_rentner','rentner', argmax((_,p)=>byName[p]?byName[p].bestDry:null));
  award('tag_executioner','executioner', argmax(o=>o.sweeps>0?o.sweeps:null));
  let fireP=null,fireN=1;
  players.forEach(p=>{const s=byName[p]; if(s&&s.curWin>fireN){fireN=s.curWin;fireP=p;}});
  award('tag_onfire','onfire', fireP);
  // fallback: anyone eligible who earned no tag is "just here for decoration"
  players.forEach(p=>{ if(tags[p].length===0) tags[p].push({key:'tag_deco', cls:'deco'}); });
  return Object.assign(guests, tags);
}
function computePlayerTags(){
  return computeTagsForGames(gamesForYear());
}
function playerTagsFor(name){
  if(!_tagCache) _tagCache=computePlayerTags();
  return _tagCache[name]||[];
}
function renderTagChips(name, max){
  const tags=playerTagsFor(name);
  if(!tags.length) return '';
  const show=max?tags.slice(0,max):tags;
  return `<span class="ptags">`+show.map(tg=>`<span class="ptag ptag-${tg.cls}" title="${t(tg.key+'_d')}">${t(tg.key)}</span>`).join('')+`</span>`;
}

/* ===== Cross-player Year-on-Year comparison =====
   Uses ALL_GAMES (own year handling), ignoring the global year filter so the
   whole history is comparable side by side. */
function computeCompare(){
  const games=(ALL_GAMES||[]).slice();
  const years=[...new Set(games.map(g=>g.date&&g.date.slice(0,4)).filter(Boolean))].sort();
  const cols=['all',...years];   // an "All-time" column plus each year
  // accumulator: player -> colKey -> bucket
  const acc={};
  const blank=()=>({g:0,w:0,rs:0,rn:0,sol:0,soln:0,seat:0,seatn:0,pod:0,gt:0,gtn:0,
    cmd:{},color:{}});
  function bump(pl,key,s,gametime){
    const P=acc[pl]||(acc[pl]={}); const b=P[key]||(P[key]=blank());
    b.g++; if(s.rank===1)b.w++; b.rs+=s.rank; b.rn++;
    if(s.rank<=2)b.pod++;
    if(s.sol!=null){b.soln++; if(s.sol===1)b.sol++;}
    if(s.turn){b.seat+=s.turn; b.seatn++;}
    if(gametime!=null){b.gt+=gametime; b.gtn++;}
    b.cmd[s.commander]=(b.cmd[s.commander]||0)+1;
    commanderColors(s.commander).forEach(c=>{ b.color[c]=(b.color[c]||0)+1; });
  }
  for(const g of games){
    const yr=g.date&&g.date.slice(0,4);
    for(const s of g.seats){ bump(s.player,'all',s,g.gametime); if(yr) bump(s.player,yr,s,g.gametime); }
  }
  const topKey=obj=>{ const e=Object.entries(obj); if(!e.length) return null;
    e.sort((a,b)=>b[1]-a[1]); return {k:e[0][0], n:e[0][1]}; };
  const finalize=b=>{
    if(!b||!b.g) return null;
    return {
      games:b.g, wins:b.w,
      winrate:+(100*b.w/b.g).toFixed(1),
      avg:+(b.rs/b.rn).toFixed(2),
      podium:+(100*b.pod/b.g).toFixed(0),
      sol: b.soln? +(100*b.sol/b.soln).toFixed(0):null,
      seat: b.seatn? +(b.seat/b.seatn).toFixed(2):null,
      avgtime: b.gtn? Math.round(b.gt/b.gtn):null,
      deckcount: Object.keys(b.cmd).length,
      topCmd: topKey(b.cmd),
      topColor: topKey(b.color)
    };
  };
  const players=Object.keys(acc).sort((a,b)=>{
    const ga=acc[a].all?acc[a].all.g:0, gb=acc[b].all?acc[b].all.g:0; return gb-ga;
  });
  const rows=players.map(pl=>{
    const byCol={}; cols.forEach(c=>byCol[c]=finalize(acc[pl][c]));
    return {player:pl, byCol};
  });
  return {cols, years, rows};
}

/* ===== Compare: Player Tags matrix =====
   Rows = each superlative tag; columns = All-time + each year. A cell names the
   player who held that tag in that period (or — if nobody qualified). Computed
   from ALL_GAMES per column, ignoring the global year filter, to match the
   metric table above. Some tags (Slowpoke/Speedrunner) need timed games and the
   fallback Wallflower is intentionally omitted — it isn't a "who was X" title.
   Eligibility is raised above the default here so low-sample guests can't sweep
   the superlatives: a strict floor for All-time, a lighter one per single year. */
const TAG_MIN_ALLTIME=30;   // ~ enough to clear occasional guests all-time
const TAG_MIN_YEAR=15;      // per-year floor: real for a regular, out of reach for a guest
const TAG_MATRIX_ORDER=['tag_endboss','tag_badluck','tag_grinder','tag_bench',
  'tag_podium','tag_solking','tag_brewer','tag_onetrick','tag_slowpoke','tag_speed',
  'tag_streaker','tag_rentner','tag_executioner','tag_onfire','tag_deco'];
const TAG_CLS={tag_endboss:'endboss',tag_badluck:'badluck',tag_grinder:'grinder',
  tag_bench:'bench',tag_podium:'podium',tag_solking:'solking',tag_brewer:'brewer',
  tag_onetrick:'onetrick',tag_slowpoke:'slowpoke',tag_speed:'speed',
  tag_streaker:'streaker',tag_rentner:'rentner',tag_executioner:'executioner',
  tag_onfire:'onfire',tag_deco:'deco'};
function computeTagMatrix(){
  const games=(ALL_GAMES||[]).slice();
  const years=[...new Set(games.map(g=>g.date&&g.date.slice(0,4)).filter(Boolean))].sort();
  const cols=['all',...years];
  // colKey -> { tagKey -> winnerName }
  const byCol={};
  cols.forEach(c=>{
    const slice = c==='all' ? games : games.filter(g=>g.date&&g.date.slice(0,4)===c);
    const floor = c==='all' ? TAG_MIN_ALLTIME : TAG_MIN_YEAR;
    const tagsByPlayer=computeTagsForGames(slice, floor);   // player -> [{key,cls}]
    const winner={};
    for(const pl in tagsByPlayer){
      for(const tg of tagsByPlayer[pl]) (winner[tg.key]=winner[tg.key]||[]).push(pl); // holders per tag (Wallflower can be shared)
    }
    byCol[c]=winner;
  });
  return {cols, years, byCol};
}
function tagsMatrixHTML(){
  const m=computeTagMatrix();
  const anyData=m.cols.some(c=>Object.keys(m.byCol[c]).length);
  if(!anyData) return '';
  const colLabel=c=> c==='all'?t('year_all'):c;
  const head=`<th class="cmt-tag-h">${t('cmt_tag_col')}</th>`+
    m.cols.map(c=>`<th${c==='all'?' class="cmp-all"':''}>${colLabel(c)}</th>`).join('');
  const rows=TAG_MATRIX_ORDER.map(tk=>{
    // skip a tag row entirely if no column ever awarded it (e.g. no timed games)
    if(!m.cols.some(c=>m.byCol[c][tk])) return '';
    const cls=TAG_CLS[tk];
    const label=`<td class="cmt-tag"><span class="ptag ptag-${cls}" title="${esc(t(tk+'_d'))}">${esc(t(tk))}</span></td>`;
    const cells=m.cols.map(c=>{
      const who=m.byCol[c][tk];
      if(!who||!who.length) return `<td class="cmp-empty${c==='all'?' cmp-all':''}">—</td>`;
      const names=who.slice().sort((a,b)=>a.localeCompare(b))
        .map(w=>`<span class="cmt-pl" data-player="${esc(w)}"><span class="cmp-dot" style="background:${playerColor(w)}"></span>${esc(w)}</span>`)
        .join('<span class="muted">, </span>');
      return `<td${c==='all'?' class="cmp-all"':''}>${names}</td>`;
    }).join('');
    return `<tr>${label}${cells}</tr>`;
  }).join('');
  return `<div class="cmp-note" style="margin-top:2px">${t('cmt_help')}</div>
    <div class="cmp-table-wrap"><table class="cmp-table cmp-tags-table"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

let INS_ROSTER = null;         // resolved lens roster

  let pool = gamesForYear();

/* ===== Win streaks & droughts ===== */
// For each ranked player, walk their games chronologically and find the longest run
// of consecutive wins (rank 1) and the longest drought (consecutive games without a win),
// plus their current active streak/drought.
// Streaks over an arbitrary games array. When `roster` is null every player
// present is included (the tag helper wants this); the Streaks chart passes CORE.
function computeStreaksForGames(games, roster){
  const sorted=(games||[]).filter(g=>g.date).slice().sort((a,b)=>{
    const da=a.date||'', db=b.date||''; if(da!==db) return da<db?-1:1; return (a.order||0)-(b.order||0);
  });
  const seq={}; // player -> [1/0,...] chronological
  for(const g of sorted) for(const s of g.seats){
    (seq[s.player]=seq[s.player]||[]).push(s.rank===1?1:0);
  }
  const rows=[];
  const names = (roster&&roster.length) ? roster : Object.keys(seq);
  for(const p of names){
    const arr=seq[p]; if(!arr||!arr.length) continue;
    let bestWin=0, curWin=0, bestDry=0, curDry=0;
    let tailWin=0, tailDry=0;
    arr.forEach(v=>{
      if(v===1){ curWin++; curDry=0; if(curWin>bestWin)bestWin=curWin; }
      else { curDry++; curWin=0; if(curDry>bestDry)bestDry=curDry; }
    });
    // current active run = trailing streak
    for(let i=arr.length-1;i>=0 && arr[i]===1;i--) tailWin++;
    for(let i=arr.length-1;i>=0 && arr[i]===0;i--) tailDry++;
    rows.push({player:p, games:arr.length, bestWin, bestDry,
      curWin:tailWin, curDry:tailDry});
  }
  rows.sort((a,b)=> b.bestWin-a.bestWin || a.bestDry-b.bestDry);
  return rows;
}
function computeStreaks(){
  return computeStreaksForGames(gamesForYear(), CORE.length?CORE:null);
}
function renderStreaks(){
  const host=$('#streakChart'); if(!host) return;
  const r=insR();
  const rows=computeStreaksForGames(insG(), r&&r.length?r:null);
  if(!rows.length){ host.innerHTML=`<div class="empty" style="padding:16px">${t('streak_none')}</div>`; return; }
  const maxWin=Math.max(...rows.map(r=>r.bestWin),1);
  const maxDry=Math.max(...rows.map(r=>r.bestDry),1);
  host.innerHTML=`<div class="strk-list">`+rows.map(r=>{
    const col=playerColor(r.player);
    const curTxt = r.curWin>0
      ? `<span class="strk-cur win">${t('streak_cur_win',{n:r.curWin})}</span>`
      : (r.curDry>0 ? `<span class="strk-cur dry">${t('streak_cur_dry',{n:r.curDry})}</span>` : '');
    return `<div class="strk-row">
      <div class="strk-name" data-player="${esc(r.player)}"><span class="strk-dot" style="background:${col}"></span>${esc(r.player)}</div>
      <div class="strk-bars">
        <div class="strk-metric">

        </div>
        <div class="strk-metric">
          <div class="strk-metric-l">${t('streak_best_dry')}</div>
          <div class="strk-track"><div class="strk-fill dry" style="width:${r.bestDry/maxDry*100}%">${r.bestDry}</div></div>
        </div>

/* ===== Commander diversity (one-trick vs brewer) ===== */
// Per player: distinct commanders piloted, total games, % on their single most-played deck,
// and a normalized diversity score (effective number of decks / games -> 0..1-ish).
function computeDiversity(){
  const games=insG();
  const byP={}; // player -> {total, decks:{cmd:count}}
  for(const g of games) for(const s of g.seats){
    const p=byP[s.player]||(byP[s.player]={total:0, decks:{}});
    p.total++; p.decks[s.commander]=(p.decks[s.commander]||0)+1;
  }
  const rows=[];
  for(const p of (CORE.length?CORE:Object.keys(byP))){
    const d=byP[p]; if(!d||d.total<1) continue;
    const counts=Object.values(d.decks);
    const distinct=counts.length;
    const top=Math.max(...counts);
    const topPct=+(100*top/d.total).toFixed(0);
    // Shannon effective number of decks (perplexity): higher = more spread
    const props=counts.map(c=>c/d.total);
    const H=-props.reduce((s,x)=>s+ (x>0? x*Math.log(x):0),0);
    const eff=Math.exp(H); // effective distinct decks
    rows.push({player:p, total:d.total, distinct, topPct, eff:+eff.toFixed(1)});
  }
  rows.sort((a,b)=> b.eff-a.eff || b.distinct-a.distinct);
  return rows;
}
function renderDiversity(){
  const host=$('#divChart'); if(!host) return;
  const rows=computeDiversity();
  if(!rows.length){ host.innerHTML=`<div class="empty" style="padding:16px">${t('div_none')}</div>`; return; }
  const maxEff=Math.max(...rows.map(r=>r.eff),1);
  host.innerHTML=`<div class="strk-list">`+rows.map(r=>{
    const col=playerColor(r.player);
    // label the archetype at the extremes
    const tag = r.eff>=Math.max(4, maxEff*0.7) ? `<span class="div-tag brewer">${t('div_brewer')}</span>`
      : (r.topPct>=50 ? `<span class="div-tag trick">${t('div_trick')}</span>` : '');
    return `<div class="div-row">
      <div class="strk-name" data-player="${esc(r.player)}"><span class="strk-dot" style="background:${col}"></span>${esc(r.player)}${tag}</div>
      <div class="div-track"><div class="div-fill" style="width:${r.eff/maxEff*100}%;background:${col}"></div></div>
      <div class="div-stats">
        <span><b>${r.distinct}</b> ${t('div_decks')}</span>
        <span class="div-sep">·</span>
        <span>${t('div_eff')}: <b>${r.eff}</b></span>
        <span class="div-sep">·</span>

}

/* ===== Pod parity over time (is the group balancing?) ===== */
// For each game, compute the spread of rolling win rates across active players (max-min, and
// standard deviation). A shrinking spread = more balanced pod. We plot the spread line.
// One point per GAME (not calendar month) — each player's rolling win rate uses only their
// own games, so someone who hasn't played in a while simply hasn't updated their rate yet,
// rather than being smeared across a month with a stale number.
function computeParity(){
  const games=insG().filter(g=>g.date).sort((a,b)=>a.date<b.date?-1:1);
  if(games.length<2) return null;
  const players=insR();
  const minGames=Math.min(ROLLING_WINDOW_GAMES, ROLLING_MIN_GAMES);
  const hist={}; players.forEach(p=>hist[p]=[]);
  const series=games.map(g=>{
    g.seats.forEach(s=>{ if(hist[s.player]) hist[s.player].push(s.rank===1); });
    const wrs=players.map(p=>hist[p].slice(-ROLLING_WINDOW_GAMES))
      .filter(win=>win.length>=minGames)
      .map(win=>100*win.filter(Boolean).length/win.length);
    if(wrs.length<2) return {spread:null, sd:null};
    const mx=Math.max(...wrs), mn=Math.min(...wrs);
    const mean=wrs.reduce((a,b)=>a+b,0)/wrs.length;
    const sd=Math.sqrt(wrs.reduce((s,x)=>s+(x-mean)**2,0)/wrs.length);
    return {spread:+(mx-mn).toFixed(0), sd:+sd.toFixed(1)};
  });
  return {n:games.length, series, dateAt:i=>games[i].date};
}
function renderParity(){
  const host=$('#parityChart'), note=$('#parityNote'); if(!host) return;
  const d=computeParity();
  if(!d){ host.innerHTML=`<div class="empty" style="padding:16px">${t('parity_none')}</div>`; if(note)note.textContent=''; return; }
  const pts=d.series.map((s,i)=>({v:s.sd,i})).filter(o=>o.v!=null);
  if(pts.length<2){ host.innerHTML=`<div class="empty" style="padding:16px">${t('parity_none')}</div>`; if(note)note.textContent=''; return; }
  const W=860,H=300,padL=44,padR=20,padT=20,padB=46, plotW=W-padL-padR, plotH=H-padT-padB, n=d.n;
  const xAt=i=> padL+(n<=1?plotW/2:(i/(n-1))*plotW);
  const ax=niceAxis(pts.map(o=>o.v));
  const yAt=v=> padT+(1-(v-ax.lo)/(ax.hi-ax.lo))*plotH;
  let grid='';
  ax.ticks.forEach(v=>{const y=yAt(v);
    grid+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--line)" stroke-width="1" ${v===ax.lo?'':'stroke-dasharray="2 4"'}/>`;
    grid+=`<text x="${padL-8}" y="${y+4}" text-anchor="end" fill="var(--ink3)" font-size="11" font-family="JetBrains Mono">${v}</text>`;});
  let xl='';const step=Math.max(1,Math.ceil(n/6));
  for(let i=0;i<n;i+=step){const[y,mo]=d.dateAt(i).split('-');
    xl+=`<text x="${xAt(i)}" y="${H-padB+20}" text-anchor="middle" fill="var(--ink3)" font-size="10.5" font-family="JetBrains Mono">${new Date(y,mo-1).toLocaleDateString(lang,{month:'short',year:'2-digit'})}</text>`;}
  let path=''; pts.forEach((o,k)=>{ path+=(k===0?'M':'L')+xAt(o.i)+' '+yAt(o.v); });
  const area=path+`L${xAt(pts[pts.length-1].i)} ${padT+plotH}L${xAt(pts[0].i)} ${padT+plotH}Z`;
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" class="trend-svg" preserveAspectRatio="xMidYMid meet">
    ${grid}
    <path d="${area}" fill="rgba(217,178,90,0.10)" stroke="none"/>
    <path d="${path}" fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${xAt(pts[pts.length-1].i)}" cy="${yAt(pts[pts.length-1].v)}" r="3.5" fill="var(--gold)"/>
    ${xl}
  </svg>`;
  // trend note: compare first third vs last third average spread
  if(note){
    const vals=pts.map(o=>o.v);
    const third=Math.max(1,Math.floor(vals.length/3));
    const early=vals.slice(0,third).reduce((a,b)=>a+b,0)/third;
    const late=vals.slice(-third).reduce((a,b)=>a+b,0)/third;
    const diff=late-early;
    const verdict = Math.abs(diff)<2 ? t('parity_steady')
      : (diff<0 ? t('parity_closer') : t('parity_wider'));
    note.innerHTML=t('parity_note',{verdict:`<b>${verdict}</b>`});
  }
}

/* ===== matchup detail (deck-by-deck) ===== */
function computeMatchupDetail(pA, pB){
  const raw = gamesForYear();
  // chronological order (same convention as computeStreaksForGames): shared meetings
  // only make sense as a "recent form" / "streak" story when walked oldest → newest.
  const games = raw.slice().sort((x,y)=>{
    const dx=x.date||'', dy=y.date||''; if(dx!==dy) return dx<dy?-1:1; return (x.order||0)-(y.order||0);
  });
  const hh={games:0,aAhead:0,bAhead:0,ties:0};
  const cmdPairs={}, aCmds={}, bCmds={};
  const meetings=[]; // chronological log of every shared game, for form/streak/timeline
  let aRs=0,bRs=0,aSolN=0,aSol=0,bSolN=0,bSol=0;
  for(const g of games){
    const sa=g.seats.find(s=>s.player===pA);
    const sb=g.seats.find(s=>s.player===pB);
    if(!sa||!sb) continue;
    hh.games++;
    const result = sa.rank<sb.rank?'a' : sa.rank>sb.rank?'b' : 'tie';
    if(result==='a')hh.aAhead++; else if(result==='b')hh.bAhead++; else hh.ties++;
    aRs+=sa.rank; bRs+=sb.rank;
    if(sa.sol!=null){aSolN++; if(sa.sol===1)aSol++;}
    if(sb.sol!=null){bSolN++; if(sb.sol===1)bSol++;}
    meetings.push({date:g.date,num:g.num,result,aRank:sa.rank,bRank:sb.rank,aCmd:sa.commander,bCmd:sb.commander});
    const key=sa.commander+'|||'+sb.commander;
    const cp=cmdPairs[key]||(cmdPairs[key]={aCmd:sa.commander,bCmd:sb.commander,games:0,aAhead:0,bAhead:0,ties:0});
    cp.games++; if(sa.rank<sb.rank)cp.aAhead++; else if(sa.rank>sb.rank)cp.bAhead++; else cp.ties++;
    const ac=aCmds[sa.commander]||(aCmds[sa.commander]={cmd:sa.commander,games:0,ahead:0,behind:0,ties:0});
    ac.games++; if(sa.rank<sb.rank)ac.ahead++; else if(sa.rank>sb.rank)ac.behind++; else ac.ties++;
    const bc=bCmds[sb.commander]||(bCmds[sb.commander]={cmd:sb.commander,games:0,ahead:0,behind:0,ties:0});
    bc.games++; if(sb.rank<sa.rank)bc.ahead++; else if(sb.rank>sa.rank)bc.behind++; else bc.ties++;
  }
  // longest-ever run each side has been ahead, plus whichever run is currently active (trailing)
  let bestA=0,bestB=0,curA=0,curB=0;
  meetings.forEach(m=>{
    if(m.result==='a'){curA++;curB=0;if(curA>bestA)bestA=curA;}
    else if(m.result==='b'){curB++;curA=0;if(curB>bestB)bestB=curB;}
    else{curA=0;curB=0;}
  });
  let streak=null;
  if(meetings.length){
    const last=meetings[meetings.length-1].result;
    if(last==='a')streak={who:'a',n:curA};
    else if(last==='b')streak={who:'b',n:curB};
  }
  return {
    hh,
    meetings,
    recent: meetings.slice(-10),
    streak, bestStreak:{a:bestA,b:bestB},
    avgRank:{a:hh.games?+(aRs/hh.games).toFixed(2):null, b:hh.games?+(bRs/hh.games).toFixed(2):null},
    sol:{a:aSolN?Math.round(100*aSol/aSolN):null, b:bSolN?Math.round(100*bSol/bSolN):null},
    cmdPairs:Object.values(cmdPairs).sort((a,b)=>b.games-a.games||(b.aAhead-b.bAhead)-(a.aAhead-a.bAhead)),
    aCmds:Object.values(aCmds).sort((a,b)=>b.games-a.games),
    bCmds:Object.values(bCmds).sort((a,b)=>b.games-a.games)
  };
}

/* ===== Matchup News — the Recent Impact highlights-feed idea applied to one specific pair's
   shared games, per user request. No slider, same fixed "last 8 (or fewer)" window as Commander
   News, for the same reason: a pair's shared-game count varies too much for one control to make
   sense everywhere. Two event types: */
function computeMatchupNews(pA, pB){
  const sorted=gamesForYear().filter(g=>g.seats.some(s=>s.player===pA) && g.seats.some(s=>s.player===pB))
    .slice().sort((x,y)=>{
      const dx=x.date||'', dy=y.date||'';
      if(dx!==dy) return dx<dy?1:-1;
      return (y.order||0)-(x.order||0);
    }); // newest-first, matches Recent Impact / Commander News convention
  if(!sorted.length) return null;
  const WINDOW=Math.min(8, sorted.length);
  const windowGames=sorted.slice(0, WINDOW);
  const windowSet=new Set(windowGames);
  const beforeGames=sorted.filter(g=>!windowSet.has(g));
  const events=[];

  // 1) head-to-head lead changes/ties within THIS pair's full shared history — same
  // before/after flip-detection as Recent Impact's pod-wide rivalry event (h2hRecordsFor),
  // narrowed to one specific pair instead of every pair sharing the window, and reusing its
  // exact i18n keys/wording so the two feeds agree on what a "lead change" sounds like. Only
  // fires on an actual flip or tie, not on an extended lead — restating "still ahead, now by
  // one more" isn't news, same rule as everywhere else in this feed.
  const recordOf=games=>{
    const rec={a:0,b:0,ties:0};
    games.forEach(g=>{
      const sa=g.seats.find(s=>s.player===pA), sb=g.seats.find(s=>s.player===pB);
      if(sa.rank<sb.rank) rec.a++; else if(sa.rank>sb.rank) rec.b++; else rec.ties++;
    });
    return rec;
  };
  const statusOf=rec=> (rec.a+rec.b+rec.ties===0) ? null : (rec.a>rec.b?'a':rec.a<rec.b?'b':'tie');
  const beforeRec=recordOf(beforeGames), afterRec=recordOf(sorted);
  const bStatus=statusOf(beforeRec), aStatus=statusOf(afterRec);
  if(bStatus!=null && aStatus!=null && bStatus!==aStatus){
    const latestDate=windowGames[0].date;
    if(aStatus==='tie'){
      events.push({type:'rivalry', tagKey:'impact_tag_rivalry', weight:5, date:latestDate,
        html:t('impact_ev_rivalry_tie',{a:`<b>${esc(pA)}</b>`,b:`<b>${esc(pB)}</b>`,rec:`${afterRec.a}-${afterRec.b}`})});
    } else {
      const leader=aStatus==='a'?pA:pB, other=aStatus==='a'?pB:pA, ls=aStatus==='a'?afterRec.a:afterRec.b, os=aStatus==='a'?afterRec.b:afterRec.a;
      events.push({type:'rivalry', tagKey:'impact_tag_rivalry', weight:6, date:latestDate,
        html:t('impact_ev_rivalry_flip',{leader:`<b>${esc(leader)}</b>`,other:`<b>${esc(other)}</b>`,rec:`${ls}-${os}`})});
    }
  }

  // 2) Clean Sweep, restricted to when ONE OF THE TWO PLAYERS is the sweep winner — on user
  // feedback that this feed should only ever be about pA and pB's own relationship, not just
  // "stuff that happened at a table they both sat at". A third player sweeping a table that
  // happens to include both of them isn't a fact about their rivalry — both would just be
  // anonymous bystanders in that story. Pace (game duration) is excluded entirely here for the
  // same reason: it's a property of the whole table, not of how pA and pB did against EACH
  // OTHER, so unlike Recent Impact / Commander News there's no honest way to make it "about"
  // this specific pair. Reuses computeGameStory() (shared with Recent Impact) and just filters
  // down to the one fact that's genuinely pair-specific: one of them decisively beating the
  // other (and everyone else) in the same game.
  events.push(...computeGameStory(windowGames).filter(e=>e.type==='sweep' && (e.winner===pA || e.winner===pB)));

  // Sorted chronologically by the game each event is about (newest first), not grouped by
  // event type — same fix, and same reasoning, as Recent Impact/Commander News: grouping by
  // type read oddly out of order once every event carried its own date.
  events.sort((a,b)=>{
    const da=a.date||'', db=b.date||'';
    if(da!==db) return da<db?1:-1;
    if((a.dayIndex||0)!==(b.dayIndex||0)) return (b.dayIndex||0)-(a.dayIndex||0);
    const order={rivalry:6,sweep:4};
    if((order[a.type]||0)!==(order[b.type]||0)) return (order[b.type]||0)-(order[a.type]||0);
    return (b.weight||0)-(a.weight||0);
  });
  const dated=windowGames.filter(g=>g.date).map(g=>g.date).sort();
  return {n:WINDOW, total:sorted.length, events, from:dated[0]||null, to:dated[dated.length-1]||null};
}
